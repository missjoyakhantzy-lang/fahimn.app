<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Aavira Fashion</title>
  <style>
    :root{--rani:#D81B60;--bg:#fff;--text:#171717;--muted:#777;--line:#eee}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    .wrap{max-width:520px;margin:auto;padding:20px}.top{display:flex;align-items:center;gap:12px;margin-bottom:24px}.back{border:0;background:none;font-size:24px;cursor:pointer}.title{font-size:22px;font-weight:700}
    .card{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.empty{text-align:center;padding:42px 18px;color:var(--muted)}
    input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;margin:7px 0;font-size:15px;outline:none}input:focus{border-color:var(--rani)}
    button.primary{width:100%;border:0;border-radius:12px;padding:14px;background:var(--rani);color:#fff;font-weight:700;font-size:15px;margin-top:8px;cursor:pointer}
    .hint{font-size:13px;color:var(--muted);line-height:1.5}.error{color:#c62828;font-size:13px;margin-top:10px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><button class="back" onclick="history.back()" aria-label="Back">‹</button><div class="title">My Orders</div></div>
    <section class="card">
      <h3>View your orders</h3>
      <p class="hint">Enter your order ID and the mobile number or email used for the order. Login is not required.</p>
      <input id="orderId" autocomplete="off" placeholder="Order ID">
      <input id="contact" autocomplete="off" placeholder="Mobile number or email">
      <button class="primary" id="trackBtn">Track Order</button>
      <div id="error" class="error" hidden></div>
    </section>
    <section id="result" class="card" hidden></section>
  </main>
  <script>
    // This page intentionally contains no backend URL. API access should come from user_data.js.
    async function trackGuestOrder(){
      const orderId=document.getElementById('orderId').value.trim();
      const contact=document.getElementById('contact').value.trim();
      const error=document.getElementById('error');
      const result=document.getElementById('result');
      error.hidden=true; result.hidden=true;
      if(!orderId||!contact){error.textContent='Please enter both Order ID and mobile/email.';error.hidden=false;return;}
      if(typeof window.getGuestOrderByIdentity!=='function'){
        error.textContent='Order service is not connected yet. Connect this page through user_data.js.';error.hidden=false;return;
      }
      try{
        const order=await window.getGuestOrderByIdentity(orderId,contact);
        if(!order){error.textContent='Order not found or the details do not match.';error.hidden=false;return;}
        result.innerHTML='<h3>Order '+escapeHtml(order.id||orderId)+'</h3><p><strong>Status:</strong> '+escapeHtml(order.status||'Processing')+'</p>';
        result.hidden=false;
      }catch(e){error.textContent='Unable to load the order right now.';error.hidden=false;}
    }
    function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    document.getElementById('trackBtn').addEventListener('click',trackGuestOrder);
  </script>
</body>
</html>
