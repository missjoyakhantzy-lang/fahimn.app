<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Aavira Luxe - My Wishlist</title>
    <meta name="theme-color" content="#ffffff">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6A1B29;
            --primary-light: rgba(106, 27, 41, 0.05);
            --secondary: #E5C158;
            --text-main: #1A1A1A;
            --text-muted: #737373;
            --border: #E5E5E5;
            --bg-main: #FFFFFF;
            --bg-page: #F7F7F9;
            --success: #10B981;
            --error: #EF4444;
            --font: 'Plus Jakarta Sans', sans-serif;
            --shadow-card: 0 4px 15px rgba(0,0,0,0.03);
            --shadow-float: 0 -8px 24px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; background: var(--bg-page); min-height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .app-container { width: 100%; max-width: 460px; background: var(--bg-page); height: 100vh; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.05); display: flex; flex-direction: column; }

        /* HEADER */
        .pro-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 100; flex-shrink: 0;}
        .icon-btn { background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; padding: 4px; transition: 0.2s;}
        .icon-btn:active { transform: scale(0.9); }
        .header-titles { text-align: center; }
        .header-titles h1 { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: var(--text-main); font-family: 'Playfair Display', serif; }
        .header-titles p { font-size: 10px; color: var(--primary); font-weight: 600; text-transform: uppercase; margin-top: 2px; }
        
        .cart-icon-wrapper { position: relative; display: inline-block; }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: var(--primary); color: white; font-size: 9px; font-weight: 700; width: 16px; height: 16px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 2px solid white;}

        /* MAIN SCROLL */
        .main-content { flex: 1; padding: 16px; overflow-y: auto; scrollbar-width: none; padding-bottom: 100px;}
        .main-content::-webkit-scrollbar { display: none; }

        /* EMPTY STATE */
        .empty-wishlist-state { display:none; flex-direction:column; align-items:center; justify-content:center; height: 75vh; text-align:center; padding: 20px; width: 100%; animation: fadeIn 0.4s ease;}
        .empty-wishlist-state .icon-circle { width: 90px; height: 90px; background: #FFF1F2; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .empty-wishlist-state i { font-size: 40px; color: #F43F5E; }
        .empty-wishlist-state h2 { font-size: 22px; color: var(--text-main); margin-bottom: 10px; font-weight: 700; font-family: 'Playfair Display', serif;}
        .empty-wishlist-state p { font-size: 13px; color: var(--text-muted); margin-bottom: 30px; line-height: 1.5; max-width: 250px;}
        .explore-btn { background: var(--text-main); color: white; padding: 14px 40px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); text-decoration: none; transition: 0.2s;}
        .explore-btn:active { transform: scale(0.95); }

        /* SKELETON GRID */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-bottom: 20px; }
        .skel-card { background: var(--bg-main); border-radius: 16px; overflow: hidden; border: 1px solid rgba(0,0,0,0.02); box-shadow: var(--shadow-card);}
        .skel-img { height: 180px; width: 100%; }
        .skel-box { background: #eee; background-image: linear-gradient(90deg, #eee 25%, #e0e0e0 50%, #eee 75%); background-size: 200px 100%; animation: shimmer 1.5s infinite linear; }
        .skel-info { padding: 12px; }
        .skel-line { height: 10px; border-radius: 4px; margin-bottom: 8px; }
        @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }

        /* WISHLIST CARDS */
        .w-card { background: var(--bg-main); border-radius: 16px; overflow: hidden; border: 1px solid rgba(0,0,0,0.02); box-shadow: var(--shadow-card); position: relative; transition: all 0.3s ease; animation: popIn 0.4s ease; display: flex; flex-direction: column;}
        .w-card.removing { transform: scale(0.8); opacity: 0; }
        
        .w-img-wrapper { position: relative; width: 100%; height: 200px; background: #f5f5f5; cursor: pointer; overflow: hidden;}
        .w-img { width: 100%; height: 100%; background-size: cover; background-position: top center; transition: transform 0.5s ease; }
        .w-card:hover .w-img { transform: scale(1.05); }
        
        .btn-remove { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9); backdrop-filter: blur(4px); color: var(--text-muted); border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 2;}
        .btn-remove:active { transform: scale(0.85); background: var(--error); color: white;}

        .w-info { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between;}
        .w-title { font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; cursor: pointer;}
        
        .w-price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;}
        .w-price { font-size: 14px; font-weight: 800; color: var(--primary); }
        .w-old { font-size: 10px; color: var(--text-muted); text-decoration: line-through; font-weight: 500;}
        .w-off { font-size: 9px; font-weight: 700; color: var(--success); background: #ECFDF5; padding: 2px 6px; border-radius: 4px;}

        .btn-move { width: 100%; background: var(--white); color: var(--primary); border: 1.5px solid var(--primary); padding: 10px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; letter-spacing: 0.5px; text-transform: uppercase;}
        .btn-move:active { background: var(--primary); color: white; transform: scale(0.95); }

        /* TOAST */
        .pro-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #18181B; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; width: 90%; max-width: 340px; border-radius: 12px; z-index: 1000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .pro-toast.show { top: 20px; }
        .pro-toast h4 { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
        .pro-toast p { font-size: 12px; color: #A1A1AA; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 460px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-between; padding: 12px 10px 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); border-top: 1px solid #eee; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #aaa; cursor: pointer; transition: 0.3s; flex: 1; text-decoration: none;}
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 18px; }
        .nav-item span { font-size: 9px; font-weight: 600; }

        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="pro-header">
            <button class="icon-btn ripple" onclick="window.location.href='./'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="header-titles">
                <h1>MY WISHLIST</h1>
                <p id="headerItemCount">0 Items</p>
            </div>
            <a href="cart" class="icon-btn cart-icon-wrapper">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="topCartBadge" style="display:none;">0</span>
            </a>
        </header>

        <main class="main-content">
            
            <!-- LOADING SKELETON -->
            <div class="grid-container" id="skeletonView">
                <div class="skel-card">
                    <div class="skel-img skel-box"></div>
                    <div class="skel-info">
                        <div class="skel-line skel-box" style="width: 100%;"></div>
                        <div class="skel-line skel-box" style="width: 70%;"></div>
                        <div class="skel-line skel-box" style="width: 40%; margin-top:10px;"></div>
                        <div class="skel-line skel-box" style="width: 100%; height:35px; margin-top:15px; border-radius:10px;"></div>
                    </div>
                </div>
                <div class="skel-card">
                    <div class="skel-img skel-box"></div>
                    <div class="skel-info">
                        <div class="skel-line skel-box" style="width: 100%;"></div>
                        <div class="skel-line skel-box" style="width: 70%;"></div>
                        <div class="skel-line skel-box" style="width: 40%; margin-top:10px;"></div>
                        <div class="skel-line skel-box" style="width: 100%; height:35px; margin-top:15px; border-radius:10px;"></div>
                    </div>
                </div>
            </div>

            <!-- EMPTY WISHLIST STATE -->
            <div id="emptyWishlistView" class="empty-wishlist-state">
                <div class="icon-circle"><i class="fa-solid fa-heart-crack"></i></div>
                <h2>Nothing saved yet!</h2>
                <p>Save your favorite premium ethnic wear here and buy them later.</p>
                <a href="./" class="explore-btn">Start Exploring</a> 
            </div>

            <!-- WISHLIST GRID -->
            <div class="grid-container" id="wishlistGrid" style="display: none;">
                <!-- JS Will Inject Cards Here -->
            </div>

        </main>

        <!-- FLOATING BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <a href="./" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="categories" class="nav-item"><i class="fa-solid fa-border-all"></i><span>Category</span></a>
            <a href="wishlist" class="nav-item active"><i class="fa-solid fa-heart"></i><span>Wishlist</span></a>
            <a href="profile" class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
        </nav>

        <!-- TOAST ALERTS -->
        <div class="pro-toast" id="alertToast">
            <span id="toastIcon"></span>
            <div class="toast-content"><h4 id="toastTitle">Alert</h4><p id="toastMessage">Message</p></div>
        </div>

    </div>

    <script src="user_data.js"></script>

    <!-- ✨ JAVASCRIPT LOGIC ✨ -->
    <script>
        window.triggerHaptic = function(type = 'light') {
            try {
                if (!navigator.vibrate) return;
                if (type === 'light') navigator.vibrate(30);
                else if (type === 'error') navigator.vibrate([60, 40, 60]);
                else if (type === 'success') navigator.vibrate([40, 50, 40]);
            } catch(e) {}
        };

        window.showToast = function(title, message, type = 'error') {
            const toast = document.getElementById('alertToast');
            if(!toast) return;
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            document.getElementById('toastIcon').innerHTML = type === 'error' ? '<i class="fa-solid fa-circle-xmark" style="color:#F87171;"></i>' : '<i class="fa-solid fa-circle-check" style="color:#34D399;"></i>';
            window.triggerHaptic(type);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function parsePrice(val) { return parseInt(String(val).replace(/[^0-9]/g, '')) || 0; }

        let wishlistIds = [];
        let wishlistProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
            updateCartBadge();
            initWishlist();
        });

        function updateCartBadge() {
            let cart = [];
            try { cart = JSON.parse(localStorage.getItem('aavira_cart')) || []; } catch(e){}
            const badge = document.getElementById('topCartBadge');
            if(badge) {
                let total = cart.reduce((sum, item) => sum + item.qty, 0);
                badge.innerText = total;
                badge.style.display = total > 0 ? 'flex' : 'none';
            }
        }

        async function initWishlist() {
            try {
                let storedWishlist = JSON.parse(localStorage.getItem('aavira_wishlist')) || [];
                if(Array.isArray(storedWishlist)) {
                    wishlistIds = storedWishlist.map(id => String(id).trim());
                }
            } catch(e) { wishlistIds = []; }

            if (wishlistIds.length === 0) {
                showEmptyState();
                return;
            }

            try {
                if(typeof window.getVercelData === 'function') {
                    const allProducts = await window.getVercelData();
                    // Filter only products that are in the wishlist
                    wishlistProducts = allProducts.filter(p => wishlistIds.includes(String(p.id).trim()));
                }
            } catch(e) { console.error("API Fetch Error:", e); }

            if(wishlistProducts.length === 0) {
                showEmptyState();
            } else {
                renderWishlist();
            }
        }

        function showEmptyState() {
            document.getElementById('skeletonView').style.display = 'none';
            document.getElementById('wishlistGrid').style.display = 'none';
            document.getElementById('emptyWishlistView').style.display = 'flex';
            document.getElementById('headerItemCount').innerText = "0 Items";
        }

        function renderWishlist() {
            const grid = document.getElementById('wishlistGrid');
            grid.innerHTML = '';
            document.getElementById('skeletonView').style.display = 'none';
            grid.style.display = 'grid';

            document.getElementById('headerItemCount').innerText = `${wishlistProducts.length} Item${wishlistProducts.length > 1 ? 's' : ''}`;

            wishlistProducts.forEach((p, index) => {
                let cPrice = parsePrice(p.price); 
                let oPrice = p.mrp ? parsePrice(p.mrp) : (cPrice + 450);
                let discount = oPrice > cPrice ? Math.round(((oPrice - cPrice) / oPrice) * 100) : 0;
                let img = p.imageMain || p.image || p.imageUrl;

                const card = document.createElement('div');
                card.className = 'w-card';
                card.id = `wishlist_card_${p.id}`;
                
                card.innerHTML = `
                    <div class="w-img-wrapper" onclick="window.location.href='product.html?id=${p.id}'">
                        <div class="w-img" style="background-image: url('${img}');"></div>
                    </div>
                    <button class="btn-remove" onclick="removeWishlistItem('${p.id}', this)"><i class="fa-solid fa-trash-can"></i></button>
                    
                    <div class="w-info">
                        <div>
                            <h4 class="w-title" onclick="window.location.href='product.html?id=${p.id}'">${p.name}</h4>
                            <div class="w-price-row">
                                <span class="w-price">₹${cPrice.toLocaleString('en-IN')}</span>
                                ${discount > 0 ? `<span class="w-old">₹${oPrice.toLocaleString('en-IN')}</span><span class="w-off">${discount}% OFF</span>` : ''}
                            </div>
                        </div>
                        <button class="btn-move" onclick="moveToBag('${p.id}', this)">MOVE TO BAG</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.removeWishlistItem = function(productId, btnEl) {
            window.triggerHaptic('error');
            const card = btnEl.closest('.w-card');
            card.classList.add('removing'); 
            
            setTimeout(() => {
                wishlistIds = wishlistIds.filter(id => String(id) !== String(productId));
                localStorage.setItem('aavira_wishlist', JSON.stringify(wishlistIds));
                
                wishlistProducts = wishlistProducts.filter(p => String(p.id) !== String(productId));
                
                document.getElementById('headerItemCount').innerText = `${wishlistProducts.length} Items`;
                
                if(wishlistProducts.length === 0) { showEmptyState(); }
                else { card.remove(); }
                
                window.showToast("Removed", "Item removed from wishlist.", "error");
            }, 300); 
        }

        window.moveToBag = function(productId, btnEl) {
            window.triggerHaptic('success');
            
            // Get product details
            const p = wishlistProducts.find(x => String(x.id) === String(productId));
            if(!p) return;

            // Determine default color and size
            let defaultColor = "As Shown";
            if(p.colors && p.colors.length > 0) defaultColor = p.colors[0].name || p.colors[0];
            else if(p.color) defaultColor = p.color.split(',')[0].trim();

            // Add to Cart
            let cart = [];
            try { cart = JSON.parse(localStorage.getItem('aavira_cart')) || []; } catch(e){}
            if(!Array.isArray(cart)) cart = [];

            let exIdx = cart.findIndex(item => String(item.productId) === String(productId) && item.size === 'Free Size' && item.color === defaultColor);
            if (exIdx > -1) { cart[exIdx].qty += 1; } 
            else { cart.push({ productId: String(productId), size: 'Free Size', color: defaultColor, qty: 1 }); }
            
            localStorage.setItem('aavira_cart', JSON.stringify(cart));
            updateCartBadge();

            // Remove from Wishlist visually and locally
            const card = btnEl.closest('.w-card');
            card.classList.add('removing'); 
            
            setTimeout(() => {
                wishlistIds = wishlistIds.filter(id => String(id) !== String(productId));
                localStorage.setItem('aavira_wishlist', JSON.stringify(wishlistIds));
                wishlistProducts = wishlistProducts.filter(p => String(p.id) !== String(productId));
                document.getElementById('headerItemCount').innerText = `${wishlistProducts.length} Items`;
                
                if(wishlistProducts.length === 0) { showEmptyState(); }
                else { card.remove(); }
                
                window.showToast("Added to Bag", "Product moved to your shopping cart! 🛍️", "success");
            }, 300);
        }
    </script>
</body>
</html>
