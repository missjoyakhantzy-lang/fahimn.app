<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Aavira Luxe - My Wishlist</title>
    <meta name="theme-color" content="#ffffff">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root{
            --rani:#D81B60;--rani-dark:#B71550;--gold:#D4AF37;
            --ivory:#FDFBF7;--white:#FFFFFF;--text:#242024;--muted:#756D73;--border:#E7E0D9;
        }
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        html,body{width:100%;min-height:100%;background:var(--ivory);font-family:Inter,system-ui,sans-serif;color:var(--text)}
        body{display:flex;justify-content:center;overflow:hidden}
        button,a{font:inherit}
        .app-container{width:100%;max-width:460px;height:100vh;background:var(--ivory);display:flex;flex-direction:column;position:relative;overflow:hidden}
        .pro-header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);box-shadow:0 4px 18px rgba(36,32,36,.045);z-index:50;flex-shrink:0}
        .icon-btn{width:40px;height:40px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:13px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;transition:.2s}
        .icon-btn:active{transform:scale(.92)}
        .header-titles{text-align:center;min-width:0}
        .header-titles h1{font:700 17px "Playfair Display",serif;letter-spacing:.02em;color:var(--text)}
        .header-titles p{font-size:9px;font-weight:700;color:var(--rani);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
        .cart-icon-wrapper{position:relative}
        .cart-badge{position:absolute;top:-3px;right:-3px;width:17px;height:17px;border-radius:50%;background:var(--rani);color:#fff;border:2px solid #fff;font-size:8px;font-weight:800;align-items:center;justify-content:center}
        .main-content{flex:1;overflow-y:auto;padding:14px 14px 34px;scrollbar-width:none}
        .main-content::-webkit-scrollbar{display:none}
        .wishlist-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 14px}
        .toolbar-title{font-size:11px;font-weight:800;color:var(--text);letter-spacing:.08em;text-transform:uppercase}
        .toolbar-sub{font-size:9px;color:var(--muted);margin-top:3px}
        .clear-btn{border:0;background:#fff;color:var(--rani);font-size:10px;font-weight:800;padding:8px 11px;border-radius:10px;border:1px solid #F4D6E1;cursor:pointer}
        .grid-container{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:24px}
        .skel-card{background:#fff;border:1px solid var(--border);overflow:hidden}
        .skel-img{height:185px;width:100%}
        .skel-box{background:linear-gradient(90deg,#f1eeee 25%,#fff 50%,#f1eeee 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
        .skel-info{padding:11px}.skel-line{height:9px;border-radius:5px;margin-bottom:7px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .w-card{background:#fff;border:1px solid #eee8e4;overflow:hidden;position:relative;display:flex;flex-direction:column;animation:popIn .35s ease;transition:transform .25s,box-shadow .25s}
        .w-card:active{transform:scale(.985)}
        .w-card.removing{transform:scale(.86);opacity:0;transition:.3s}
        .w-img-wrapper{position:relative;width:100%;aspect-ratio:1/1.1;background:#f7f5f3;overflow:hidden;cursor:pointer}
        .w-img{position:absolute;inset:0;width:100%;height:100%;background-size:cover;background-position:center;transition:transform .6s ease}
        .w-card:hover .w-img{transform:scale(1.045)}
        .discount-tag{position:absolute;top:8px;left:8px;z-index:4;background:#fff;padding:3px 7px;font-size:8px;font-weight:800;color:var(--rani);letter-spacing:.08em;box-shadow:0 2px 8px rgba(0,0,0,.1)}
        .bestseller{position:absolute;bottom:0;left:0;right:0;z-index:4;background:rgba(36,32,36,.88);color:#fff;text-align:center;padding:5px;font-size:7px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
        .btn-remove{position:absolute;top:7px;right:7px;z-index:5;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.94);color:var(--rani);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.1);cursor:pointer}
        .w-info{padding:10px 11px 11px;display:flex;flex-direction:column;flex:1;background:#fff}
        .w-title{font-size:12px;font-weight:650;color:#242024;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px;cursor:pointer}
        .rating-row{display:flex;align-items:center;gap:5px;margin-bottom:6px}
        .rating-badge{display:inline-flex;align-items:center;gap:3px;background:#16a34a;color:#fff;font-size:8px;font-weight:800;padding:2px 5px;border-radius:4px}
        .colour-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;min-height:13px}
        .swatches{display:flex;margin-left:1px}
        .swatches span{width:9px;height:9px;border-radius:50%;border:1px solid #ddd;margin-left:-2px}
        .colour-text{font-size:8px;color:#9b9298;text-transform:uppercase;letter-spacing:.06em}
        .w-price-row{display:flex;align-items:baseline;gap:6px;margin-top:auto;padding-top:7px;border-top:1px solid #f3eeee}
        .w-price{font-size:14px;font-weight:800;color:#242024}
        .w-old{font-size:9px;color:#9b9298;text-decoration:line-through}
        .view-btn{margin-left:auto;width:28px;height:28px;border:0;border-radius:50%;background:var(--rani);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(216,27,96,.16)}
        .empty-wishlist-state{display:none;flex-direction:column;align-items:center;justify-content:center;height:72vh;text-align:center;padding:20px}
        .empty-wishlist-state .icon-circle{width:84px;height:84px;background:#F9E8EE;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:18px;color:var(--rani)}
        .empty-wishlist-state h2{font:700 23px "Playfair Display",serif;margin-bottom:8px}
        .empty-wishlist-state p{font-size:12px;color:var(--muted);line-height:1.5;max-width:260px;margin-bottom:24px}
        .explore-btn{background:var(--rani);color:#fff;padding:13px 28px;border-radius:14px;font-size:12px;font-weight:800;text-decoration:none;box-shadow:0 9px 20px rgba(216,27,96,.18)}
        .pro-toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 18px;border-radius:50px;font-size:11px;font-weight:700;z-index:10060;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;box-shadow:0 10px 20px rgba(0,0,0,.2)}
        .pro-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        @keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
        @media(min-width:640px){.app-container{box-shadow:0 0 40px rgba(36,32,36,.06)}}
    </style>

  <style data-aavira-ui>body.aavira-theme{--primary:#D81B60;--primary-color:#D81B60;--pink:#D81B60;background:#FDFBF7!important;color:#242024}.aavira-spinner-done{animation:none!important;transform:none!important}</style>
</head>
<body>

    <div class="app-container">
        
        <header class="pro-header">
            <button class="icon-btn" aria-label="Go back" onclick="history.back()"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <div class="header-titles">
                <h1>MY WISHLIST</h1>
                <p id="headerItemCount">0 Items</p>
            </div>
            <a href="/cart" class="icon-btn cart-icon-wrapper" aria-label="Open cart">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                <span class="cart-badge" id="topCartBadge" style="display:none;">0</span>
            </a>
        </header>

        <main class="main-content">
            <div class="wishlist-toolbar"><div><div class="toolbar-title">Saved Collection</div><div class="toolbar-sub">Your handpicked Aavira pieces</div></div><button class="clear-btn" onclick="clearWishlist()">Clear All</button></div>
            <!-- LOADING SKELETON -->
            <div class="grid-container" id="skeletonView">
                <div class="skel-card">
                    <div class="skel-img skel-box"></div>
                    <div class="skel-info">
                        <div class="skel-line skel-box" style="width: 100%;"></div>
                        <div class="skel-line skel-box" style="width: 70%;"></div>
                        <div class="skel-line skel-box" style="width: 40%; margin-top:10px;"></div>
                        <div class="skel-line skel-box" style="width: 100%; height:35px; margin-top:15px; border-radius:10px;"></div>
                    </div>
                </div>
                <div class="skel-card">
                    <div class="skel-img skel-box"></div>
                    <div class="skel-info">
                        <div class="skel-line skel-box" style="width: 100%;"></div>
                        <div class="skel-line skel-box" style="width: 70%;"></div>
                        <div class="skel-line skel-box" style="width: 40%; margin-top:10px;"></div>
                        <div class="skel-line skel-box" style="width: 100%; height:35px; margin-top:15px; border-radius:10px;"></div>
                    </div>
                </div>
            </div>

            <!-- EMPTY WISHLIST STATE -->
            <div id="emptyWishlistView" class="empty-wishlist-state">
                <div class="icon-circle"><i class="fa-solid fa-heart-crack"></i></div>
                <h2>Nothing saved yet!</h2>
                <p>Save your favorite premium ethnic wear here and buy them later.</p>
                <a href="./" class="explore-btn">Start Exploring</a> 
            </div>

            <!-- WISHLIST GRID -->
            <div class="grid-container" id="wishlistGrid" style="display: none;">
                <!-- JS Will Inject Cards Here -->
            </div>

        </main>

        <!-- TOAST ALERTS -->
        <div class="pro-toast" id="alertToast">
            <span id="toastIcon"></span>
            <div class="toast-content"><h4 id="toastTitle">Alert</h4><p id="toastMessage">Message</p></div>
        </div>

    </div>

    <!-- EXTERNAL DATA SCRIPT -->
    <script src="user_data.js"></script>

    <!-- ✨ JAVASCRIPT LOGIC ✨ -->
    <script>
        window.triggerHaptic = function(type = 'light') {
            try {
                if (!navigator.vibrate) return;
                if (type === 'light') navigator.vibrate(30);
                else if (type === 'error') navigator.vibrate([60, 40, 60]);
                else if (type === 'success') navigator.vibrate([40, 50, 40]);
            } catch(e) {}
        };

        window.showToast = function(title, message, type = 'error') {
            const toast = document.getElementById('alertToast');
            if(!toast) return;
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            document.getElementById('toastIcon').innerHTML = type === 'error' ? '<i class="fa-solid fa-circle-xmark" style="color:#F87171;"></i>' : '<i class="fa-solid fa-circle-check" style="color:#34D399;"></i>';
            window.triggerHaptic(type);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function parsePrice(val) { return parseInt(String(val).replace(/[^0-9]/g, '')) || 0; }

        let wishlistIds = [];
        let wishlistProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
            updateCartBadge();
            initWishlist();
            if(typeof lucide!=='undefined') lucide.createIcons();
        });

        function updateCartBadge() {
            let cart = [];
            try { cart = JSON.parse(localStorage.getItem('aavira_cart')) || []; } catch(e){}
            const badge = document.getElementById('topCartBadge');
            if(badge) {
                let total = cart.reduce((sum, item) => sum + item.qty, 0);
                badge.innerText = total;
                badge.style.display = total > 0 ? 'flex' : 'none';
            }
        }

        async function initWishlist() {
            try {
                let storedWishlist = JSON.parse(localStorage.getItem('aavira_wishlist')) || [];
                if(Array.isArray(storedWishlist)) {
                    wishlistIds = storedWishlist.map(id => String(id).trim());
                }
            } catch(e) { wishlistIds = []; }

            if (wishlistIds.length === 0) {
                showEmptyState();
                return;
            }

            try {
                if(typeof window.getVercelData === 'function') {
                    const allProducts = await window.getVercelData();
                    // Filter only products that are in the wishlist
                    wishlistProducts = allProducts.filter(p => wishlistIds.includes(String(p.id).trim()));
                }
            } catch(e) { console.error("API Fetch Error:", e); }

            if(wishlistProducts.length === 0) {
                showEmptyState();
            } else {
                renderWishlist();
            }
        }

        function showEmptyState() {
            document.getElementById('skeletonView').style.display = 'none';
            document.getElementById('wishlistGrid').style.display = 'none';
            document.getElementById('emptyWishlistView').style.display = 'flex';
            document.getElementById('headerItemCount').innerText = "0 Items";
        }

        function renderWishlist() {
            const grid = document.getElementById('wishlistGrid');
            grid.innerHTML = '';
            document.getElementById('skeletonView').style.display = 'none';
            grid.style.display = 'grid';

            document.getElementById('headerItemCount').innerText = `${wishlistProducts.length} Item${wishlistProducts.length > 1 ? 's' : ''}`;

            wishlistProducts.forEach((p, index) => {
                let cPrice = parsePrice(p.price); 
                let oPrice = p.mrp ? parsePrice(p.mrp) : (cPrice + 450);
                let discount = oPrice > cPrice ? Math.round(((oPrice - cPrice) / oPrice) * 100) : 0;
                let img = p.imageMain || p.image || p.imageUrl;

                const card = document.createElement('div');
                card.className = 'w-card';
                card.id = `wishlist_card_${p.id}`;
                const image = img || 'https://placehold.co/400x440/f5f5f5/cccccc?text=Aavira';
                const colours = Array.isArray(p.colors) ? p.colors : [];
                const colourDots = colours.slice(0,3).map(col => {
                    const value = typeof col === 'object' ? (col.hex || col.color || col.name || '') : col;
                    return `<span style="background:${String(value).replace(/"/g,'&quot;')}"></span>`;
                }).join('');
                let h=0;const sid=String(p.id);for(let j=0;j<sid.length;j++){h=(h*31+sid.charCodeAt(j))>>>0;}
                const rating=(3.8+(h%12)/10).toFixed(1);
                const stockLeft=2+(h%9);
                const isBestseller=(h%5)===0;
                const colourLabel = colours.length > 1 ? `${colours.length} Colours` : '1 Colour';
                card.innerHTML = `
                    <div class="w-img-wrapper" onclick="window.location.href='/product?id=${p.id}'">
                        <div class="w-img" style="background-image:url('${String(image).replace(/'/g,"%27")}')"></div>
                        ${discount > 0 ? `<div class="discount-tag">${discount}% OFF</div>` : ''}
                        ${isBestseller ? '<div class="bestseller">Bestseller</div>' : ''}
                        <button class="btn-remove" aria-label="Remove from wishlist" onclick="removeWishlistItem('${p.id}', this)"><i data-lucide="heart" class="w-4 h-4" fill="currentColor"></i></button>
                    </div>
                    <div class="w-info">
                        <h4 class="w-title" onclick="window.location.href='/product?id=${p.id}'">${p.name || 'Aavira Product'}</h4>
                        <div class="rating-row"><span class="rating-badge"><i data-lucide="star" class="w-2.5 h-2.5" fill="currentColor"></i> ${rating}</span>${stockLeft<=4 ? `<span style="font-size:8px;font-weight:800;color:#ea580c;margin-left:auto;">Only ${stockLeft} left</span>` : ''}</div>
                        <div class="colour-row"><div class="swatches">${colourDots}</div><span class="colour-text">${colourLabel}</span></div>
                        <div class="w-price-row">
                            <span class="w-price">₹${cPrice.toLocaleString('en-IN')}</span>
                            ${discount > 0 ? `<span class="w-old">₹${oPrice.toLocaleString('en-IN')}</span>` : ''}
                            <button class="view-btn" aria-label="View product" onclick="window.location.href='/product?id=${p.id}'"><i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            if(typeof lucide!=='undefined') lucide.createIcons();
        }

        function clearWishlist() {
            if (!wishlistIds.length) return;
            if (!confirm('Clear all wishlist items?')) return;
            wishlistIds = [];
            wishlistProducts = [];
            localStorage.setItem('aavira_wishlist','[]');
            showEmptyState();
            window.showToast('Wishlist Cleared','All saved items removed.','success');
        }

        window.removeWishlistItem = function(productId, btnEl) {
            window.triggerHaptic('error');
            const card = btnEl.closest('.w-card');
            card.classList.add('removing'); 
            
            setTimeout(() => {
                wishlistIds = wishlistIds.filter(id => String(id) !== String(productId));
                localStorage.setItem('aavira_wishlist', JSON.stringify(wishlistIds));
                
                wishlistProducts = wishlistProducts.filter(p => String(p.id) !== String(productId));
                
                document.getElementById('headerItemCount').innerText = `${wishlistProducts.length} Items`;
                
                if(wishlistProducts.length === 0) { showEmptyState(); }
                else { card.remove(); }
                
                window.showToast("Removed", "Item removed from wishlist.", "error");
            }, 300); 
        }

        window.moveToBag = function(productId, btnEl) {
            window.triggerHaptic('success');
            
            // Get product details
            const p = wishlistProducts.find(x => String(x.id) === String(productId));
            if(!p) return;

            // Determine default color and size
            let defaultColor = "As Shown";
            if(p.colors && p.colors.length > 0) defaultColor = p.colors[0].name || p.colors[0];
            else if(p.color) defaultColor = p.color.split(',')[0].trim();

            // Add to Cart
            let cart = [];
            try { cart = JSON.parse(localStorage.getItem('aavira_cart')) || []; } catch(e){}
            if(!Array.isArray(cart)) cart = [];

            let exIdx = cart.findIndex(item => String(item.productId) === String(productId) && item.size === 'Free Size' && item.color === defaultColor);
            if (exIdx > -1) { cart[exIdx].qty += 1; } 
            else { cart.push({ productId: String(productId), size: 'Free Size', color: defaultColor, qty: 1 }); }
            
            localStorage.setItem('aavira_cart', JSON.stringify(cart));
            updateCartBadge();

            // Remove from Wishlist visually and locally
            const card = btnEl.closest('.w-card');
            card.classList.add('removing'); 
            
            setTimeout(() => {
                wishlistIds = wishlistIds.filter(id => String(id) !== String(productId));
                localStorage.setItem('aavira_wishlist', JSON.stringify(wishlistIds));
                wishlistProducts = wishlistProducts.filter(p => String(p.id) !== String(productId));
                document.getElementById('headerItemCount').innerText = `${wishlistProducts.length} Items`;
                
                if(wishlistProducts.length === 0) { showEmptyState(); }
                else { card.remove(); }
                
                window.showToast("Added to Bag", "Product moved to your shopping cart! 🛍️", "success");
            }, 300);
        }
    </script>
  <script data-aavira-ui>(function(){function f(){document.body.classList.add("aavira-theme");var s=document.querySelectorAll(".mini-spin,.fa-spin");for(var i=0;i<s.length;i++){(function(e){setTimeout(function(){e.classList.add("aavira-spinner-done")},4000)})(s[i])}}document.readyState==="loading"?document.addEventListener("DOMContentLoaded",f,{once:true}):f()})();</script>
</body>
</html>
