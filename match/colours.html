<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop by colour - Aavira</title>
<meta name="description" content="Find Aavira ethnic wear by colour.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{--rani:#D81B60;--rani-dark:#B71550;--gold:#D4AF37;--ivory:#FDFBF7;--cream:#F7F1E8;--ink:#242024;--muted:#6B6369;--line:#E7E0D9;--ease:cubic-bezier(.2,.8,.2,1)}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--ivory);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2{font-family:"Playfair Display",serif;margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rani);outline-offset:2px}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--ivory)}
@media(min-width:640px){body{background:#EFE8DE}.app{box-shadow:0 0 60px rgba(36,32,36,.12)}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-row{height:60px;display:flex;align-items:center;gap:8px;padding:0 12px}
.top-row h1{font-size:20px;font-weight:600;flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#F9E8EE;color:var(--rani)}
.icon-btn svg{width:22px;height:22px;stroke-width:1.6}

/* selected-colour strip */
.strip{display:none;gap:14px;overflow-x:auto;padding:12px 16px;border-top:1px solid var(--line);scrollbar-width:none;background:#fff}
.strip::-webkit-scrollbar{display:none}
.strip.is-on{display:flex}
.strip .swatch{flex:0 0 auto}
.strip .swatch i{width:36px;height:36px}
.strip .swatch span{font-size:11px}
.strip .swatch small{display:none}

main{padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.lead{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.5}

/* swatches */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px}
.swatch{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.swatch i{width:56px;height:56px;border-radius:50%;box-shadow:inset 0 0 0 3px #fff,0 0 0 1px rgba(0,0,0,.14);transition:transform .15s,box-shadow .15s}
.swatch:hover i{transform:scale(1.06);box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--rani)}
.swatch span{font-size:12px;font-weight:500;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch small{font-size:10.5px;color:#9A9298;margin-top:-4px}
.swatch.is-active i{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--rani)}
.swatch.is-active span{color:var(--rani);font-weight:600}

/* results */
.res-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.res-head h2{font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.res-head h2 i.dot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #fff,0 0 0 1px rgba(0,0,0,.18)}
.res-head p{margin:2px 0 0;font-size:12px;color:var(--muted);font-family:"Inter",sans-serif}
.link-btn{background:none;border:0;padding:0;color:var(--rani);font-size:13px;font-weight:600}
.link-btn:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.hint{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;margin-top:56px;line-height:1.6}
.hint b{color:var(--ink)}

/* product card */
.pcard{position:relative}
.pcard-link{display:block}
.pcard-media{position:relative;display:block;aspect-ratio:1/1;background:var(--cream);overflow:hidden;border-radius:14px}
.pcard-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.pcard:hover .pcard-media img{transform:scale(1.05)}
.tags{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tag-off{background:var(--rani);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px}
.tag-best{background:rgba(27,23,25,.88);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px}
.rchip{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.96);color:var(--ink);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.rchip svg{width:11px;height:11px;fill:var(--gold);stroke:var(--gold)}
.pcard-body{display:block;padding:10px 2px 0}
.pcard-name{display:block;font-size:13.5px;font-weight:500;line-height:1.35}
.pcard-price{display:flex;align-items:baseline;gap:8px;margin-top:5px}
.price{font-size:16px;font-weight:700}
.mrp{font-size:12px;color:var(--muted);text-decoration:line-through}
.pcard-meta{display:flex;align-items:center;gap:8px;margin-top:8px}
.dots{display:inline-flex;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;margin-left:-4px;box-shadow:0 0 0 2px var(--ivory),inset 0 0 0 1px rgba(0,0,0,.14)}
.dots i:first-child{margin-left:0}
.dots b{min-width:20px;height:20px;padding:0 5px;margin-left:7px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.low{display:block;margin-top:6px;font-size:12px;font-weight:600;color:#B45309}
.buy{display:flex;align-items:center;justify-content:center;width:100%;height:40px;margin-top:10px;background:var(--rani);color:#fff;border-radius:10px;font-size:13px;font-weight:600;transition:background .2s,transform .1s}
.buy:hover{background:var(--rani-dark)}
.buy:active{transform:scale(.98)}
.heart{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s,color .2s}
.heart:active{transform:scale(.88)}
.heart svg{width:17px;height:17px;stroke-width:1.8}
.heart.is-on{color:var(--rani)}
.heart.is-on svg{fill:currentColor}

.skel{background:linear-gradient(90deg,#F1EBE3 25%,#F8F3EC 37%,#F1EBE3 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:14px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:#111827;color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:500;z-index:50;pointer-events:none;white-space:nowrap;transition:opacity .25s,transform .25s var(--ease)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="app">
  <header class="top">
    <div class="top-row">
      <button type="button" class="icon-btn" onclick="goBack()" aria-label="Back"><i data-lucide="arrow-left"></i></button>
      <h1>Shop by colour</h1>
    </div>
    <div id="strip" class="strip" role="tablist" aria-label="Colours"></div>
  </header>

  <main id="content" aria-live="polite"></main>
</div>

<script>
/* =========================================================
   Helpers
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const PLACEHOLDER='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#F7F1E8"/><text x="200" y="210" font-family="Georgia,serif" font-size="30" fill="#B9AFA6" text-anchor="middle">Aavira</text></svg>');
window.imgFallback=img=>{img.onerror=null;img.src=PLACEHOLDER};
const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const safeUrl=v=>{const r=String(v??'').trim();if(!r)return'';try{const u=new URL(r,location.origin);return['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};
const safeImageUrl=v=>safeUrl(v)||PLACEHOLDER;
const safeJson=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}};
const saveJson=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const icons=()=>{if(window.lucide)lucide.createIcons()};
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN');
const priceInfo=p=>{const pr=Number(p.price)||0,m=Number(p.mrp)||pr;return{pr,m,off:m>pr?Math.round((m-pr)/m*100):0}};
const vibrate=(m=30)=>{if('vibrate' in navigator)navigator.vibrate(m)};

let toastTimer;
const showToast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('is-on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('is-on'),2000)};

/* Professional fabric-tone palette. Names must match the colour names stored on your products. */
const palette=[
  ["Red","#C8102E"],["Maroon","#6D1230"],["Wine","#5E1A2B"],["Rani Pink","#D81B60"],["Pink","#F4A6C0"],["Magenta","#C2185B"],
  ["Coral","#F08A6E"],["Peach","#F6C1A5"],["Orange","#E2711D"],["Rust","#B7410E"],["Mustard","#D4A017"],["Yellow","#E8B923"],
  ["Gold","#C9A227"],["Beige","#D9C3A0"],["Ivory","#F5EFE0"],["White","#FFFFFF"],["Green","#2E7D5B"],["Emerald","#0F7B5A"],
  ["Olive","#6B7A2A"],["Lime","#A4C639"],["Mint","#A8D5BA"],["Teal","#0F766E"],["Turquoise","#2BB5B8"],["Sky Blue","#7FB7E0"],
  ["Blue","#1F4E9C"],["Navy Blue","#1B2A5C"],["Lavender","#C7B8E6"],["Violet","#9B6BC9"],["Purple","#6B3FA0"],
  ["Brown","#7B4B2A"],["Gray","#8A8A8A"],["Black","#1A1A1A"]
];
const hexMap=Object.fromEntries(palette.map(([n,h])=>[n.toLowerCase(),h]));
const colorHex=n=>{
  const k=String(n).trim().toLowerCase();
  if(hexMap[k])return hexMap[k];
  return(window.CSS&&CSS.supports('color',k))?k:'#D1D5DB';
};

/* =========================================================
   Data
   ========================================================= */
let allProducts=[],loading=true,failed=false;
const normalize=x=>({
  id:x.id,name:x.name,price:x.price,mrp:x.mrp,
  colors:Array.isArray(x.colors)?x.colors:[],
  img:x.imageMain||x.image||x.imageUrl||'',
  rating:x.rating??x.averageRating??x.avgRating??x.ratingAvg??x.average_rating??x.avg_rating??x.stars,
  stock:x.stock,bestseller:!!x.bestseller
});
const applyReviewStats=()=>{
  const agg={};
  safeJson('aavira_experiences',[]).forEach(e=>{
    const pid=e.productId??e.product_id??e.pid;if(pid==null)return;
    const a=agg[String(pid)]=agg[String(pid)]||{s:0,n:0};a.s+=Number(e.rating)||0;a.n++;
  });
  allProducts.forEach(p=>{const a=agg[String(p.id)];if(a&&a.n&&!(Number(p.rating)>0))p.rating=a.s/a.n});
};

/* Colours that exist in the catalogue, most-used first, with style counts. */
const catalogueColors=()=>{
  const m=new Map();
  allProducts.forEach(p=>p.colors.forEach(c=>{
    const name=String(c).trim(),k=name.toLowerCase();if(!k)return;
    m.set(k,{name,n:(m.get(k)?.n||0)+1});
  }));
  return m.size?[...m.values()].sort((a,b)=>b.n-a.n):palette.map(([name])=>({name,n:0}));
};
const swatchHtml=(c,active)=>`<button type="button" class="swatch ${active?'is-active':''}" data-color="${escapeHtml(c.name)}" ${active?'aria-current="true"':''}>
  <i style="background:${colorHex(c.name)}"></i><span>${escapeHtml(c.name)}</span>${c.n?`<small>${c.n} ${c.n>1?'styles':'style'}</small>`:''}</button>`;

/* =========================================================
   Product card
   ========================================================= */
const isWished=id=>safeJson('aavira_wishlist',[]).map(String).includes(String(id));
const colorDots=p=>{
  const c=p.colors;if(!c.length)return'';
  return `<span class="pcard-meta"><span class="dots" role="img" aria-label="${c.length} ${c.length>1?'colours':'colour'} available">${c.slice(0,3).map(x=>`<i style="background:${colorHex(x)}"></i>`).join('')}${c.length>3?`<b>+${c.length-3}</b>`:''}</span></span>`;
};
const lowStock=p=>{const s=Number(p.stock);return(Number.isFinite(s)&&s>0&&s<=4)?`<span class="low">Only ${s} left</span>`:''};
const cardHtml=p=>{
  const {pr,m,off}=priceInfo(p),id=escapeHtml(p.id),name=escapeHtml(p.name);
  const href=`/product?id=${encodeURIComponent(p.id)}`,r=Number(p.rating);
  return `<article class="pcard">
    <a class="pcard-link" href="${href}" data-product="${id}">
      <span class="pcard-media">
        <img src="${escapeHtml(safeImageUrl(p.img))}" alt="" loading="lazy" onerror="imgFallback(this)">
        ${(off||p.bestseller)?`<span class="tags">${off?`<span class="tag-off">${off}% off</span>`:''}${p.bestseller?'<span class="tag-best">Bestseller</span>':''}</span>`:''}
        ${r>0?`<span class="rchip"><i data-lucide="star"></i>${r.toFixed(1)}</span>`:''}
      </span>
      <span class="pcard-body">
        <span class="pcard-name clamp1">${name}</span>
        <span class="pcard-price"><span class="price">${fmt(pr)}</span>${m>pr?`<span class="mrp">${fmt(m)}</span>`:''}</span>
        ${colorDots(p)}${lowStock(p)}
      </span>
    </a>
    <a class="buy" href="${href}&buy=1" data-product="${id}">Buy now</a>
    <button type="button" class="heart ${isWished(p.id)?'is-on':''}" data-heart="${id}" aria-pressed="${isWished(p.id)}" aria-label="Save ${name} to wishlist"><i data-lucide="heart"></i></button>
  </article>`;
};

/* =========================================================
   Screens: colour picker  ->  colour results
   ========================================================= */
const currentColor=()=>new URLSearchParams(location.search).get('color')||'';

function render(){
  const c=$('#content'),strip=$('#strip'),sel=currentColor();

  if(loading){
    strip.classList.remove('is-on');
    c.innerHTML=`<div class="swatches">${Array(8).fill('<div class="skel" style="height:78px"></div>').join('')}</div>`;
    return;
  }
  if(failed){
    strip.classList.remove('is-on');
    c.innerHTML='<div class="hint" style="margin-top:40px">Products are unavailable right now.<br><button type="button" class="link-btn" onclick="load()">Try again</button></div>';
    return;
  }

  const colors=catalogueColors();

  /* Picker */
  if(!sel){
    strip.classList.remove('is-on');strip.innerHTML='';
    c.innerHTML=`<p class="lead">Pick a shade to see matching styles.</p><div class="swatches">${colors.map(x=>swatchHtml(x,false)).join('')}</div>`;
    return;
  }

  /* Results */
  strip.innerHTML=colors.map(x=>swatchHtml(x,x.name.toLowerCase()===sel.toLowerCase())).join('');
  strip.classList.add('is-on');
  strip.querySelector('.is-active')?.scrollIntoView({inline:'center',block:'nearest'});

  const list=allProducts.filter(p=>p.colors.some(x=>String(x).trim().toLowerCase()===sel.toLowerCase()));
  const display=colors.find(x=>x.name.toLowerCase()===sel.toLowerCase())?.name||sel;
  c.innerHTML=`<div class="res-head">
      <div><h2><i class="dot" style="background:${colorHex(display)}"></i>${escapeHtml(display)}</h2>
      <p>${list.length?`${list.length} ${list.length>1?'styles':'style'} available`:'No styles yet'}</p></div>
      <button type="button" class="link-btn" onclick="clearColor()">All colours</button>
    </div>
    <div class="grid2">${list.length?list.map(cardHtml).join(''):'<div class="hint"><b>No styles in this colour yet</b><br>Try another shade.</div>'}</div>`;
  icons();
  window.scrollTo({top:0});
}

function selectColor(name,push=true){
  const url=new URL(location.href);
  name?url.searchParams.set('color',name):url.searchParams.delete('color');
  push?history.pushState(null,'',url):history.replaceState(null,'',url);
  render();
}
window.clearColor=()=>selectColor('');

async function load(){
  loading=true;failed=false;render();
  try{
    const d=typeof window.getVercelData==='function'?await window.getVercelData():[];
    if(!Array.isArray(d)||!d.length)throw new Error('No products');
    allProducts=d.map(normalize);applyReviewStats();
  }catch{failed=true}
  loading=false;render();icons();
}

/* =========================================================
   Events
   ========================================================= */
function goBack(){
  /* from results go back to the picker; from the picker go to the previous page or home */
  if(currentColor()){clearColor();return}
  if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1)history.back();
  else location.href='/';
}
window.addEventListener('popstate',render);

document.addEventListener('click',e=>{
  const sw=e.target.closest('[data-color]');
  if(sw){vibrate(30);selectColor(sw.dataset.color);return}

  const h=e.target.closest('[data-heart]');
  if(h){
    vibrate(40);
    const id=String(h.dataset.heart);let w=safeJson('aavira_wishlist',[]).map(String);
    const on=!h.classList.contains('is-on');
    w=on?(w.includes(id)?w:[...w,id]):w.filter(x=>x!==id);
    saveJson('aavira_wishlist',w);
    document.querySelectorAll(`[data-heart="${CSS.escape(id)}"]`).forEach(b=>{b.classList.toggle('is-on',on);b.setAttribute('aria-pressed',on)});
    showToast(on?'Added to wishlist':'Removed from wishlist');
    return;
  }

  const a=e.target.closest('a[data-product]');
  if(a){
    let r=safeJson('aavira_recent',[]).filter(i=>String(i)!==a.dataset.product);
    r.unshift(a.dataset.product);saveJson('aavira_recent',r.slice(0,8));
  }
});

document.addEventListener('DOMContentLoaded',()=>{icons();load()});
</script>
<script src="/user_data.js"></script>
</body>
</html>
