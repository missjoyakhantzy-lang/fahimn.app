<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shop by Colour - Aavira Fashion</title>
<meta name="description" content="Find your matching Aavira Fashion blouse by colour.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  color-scheme:light;
  --rani:#111113;
  --rani-dark:#000000;
  --rani-tint:#F2F2F7;
  --gold:#D4AF37;
  --gold-deep:#111113;
  --gold-text:#8A6D1D;
  --gold-soft:#F8F8FA;
  --ivory:#FFFFFF;
  --cream:#F8F8FA;
  --ink:#111113;
  --mid:#4A4F55;
  --muted:#6E6E73;
  --line:#E5E5EA;
  --blush:#F2F2F7;
  --plum:#111113;
  --plum2:#1C1C1E;
  --green:#15803D;
  --danger:#DC2626;
  --amber:#B45309;
  --ease:cubic-bezier(.22,1,.36,1);
  --ios-spring:cubic-bezier(.32,.72,0,1);
  --font-main:"Barlow Condensed","Roboto Condensed",system-ui,sans-serif;
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#FFFFFF!important}
body{
  margin:0;
  font-family:var(--font-main);
  letter-spacing:.015em;
  background:var(--ivory)!important;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  position:relative;
}
h1,h2,h3,h4{font-family:var(--font-main);letter-spacing:.01em;margin:0}
a{color:inherit;text-decoration:none}
button,select,input{font-family:inherit;letter-spacing:inherit;user-select:none}
button{cursor:pointer}
input{user-select:text}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--rani);outline-offset:2px}

.app{
  max-width:420px;
  margin:0 auto;
  background:#FFFFFF;
  display:flex;
  flex-direction:column;
  min-height:100dvh;
  position:relative;
  overflow-x:clip;
}
@media(min-width:640px){
  body{background:#F5F5F7!important}
  .app{box-shadow:0 0 50px rgba(0,0,0,.06);border-inline:1px solid #EBEBEF}
}

/* Compact & Bold Loading Spinner State */
.is-busy{position:relative;pointer-events:none;color:transparent!important}
.is-busy>*{opacity:0!important}
.is-busy::after{
  content:"";
  position:absolute;
  inset:0;
  margin:auto;
  width:14px;
  height:14px;
  border:2.2px solid var(--spin,var(--rani));
  border-top-color:transparent;
  border-radius:50%;
  animation:spin .55s linear infinite;
  z-index:5;
}
:is(.sqa-add,.cd-checkout,.p-primary).is-busy{--spin:#fff}
.go.is-busy{background:var(--rani)!important;border-color:var(--rani)!important;--spin:#fff;transform:none}
.go.is-busy::after{width:11px;height:11px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Sticky Header ---------- */
.top{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
  transition:box-shadow .2s;
}
.top.scrolled{box-shadow:0 6px 20px rgba(0,0,0,.05)}
.top-row{min-height:54px;display:flex;align-items:center;gap:8px;padding:7px 10px}
.icon-btn,
.back-btn{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:50%;
  border:1px solid #EBEBEF;
  background:#F8F8FA;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:background .18s,border-color .18s,transform .15s var(--ease);
  cursor:pointer;
}
@media(hover:hover){
  .icon-btn:hover,.back-btn:hover{background:#EFEFF4;border-color:#D4D4D8}
}
.icon-btn:active,.back-btn:active{transform:scale(.92)}
.icon-btn svg,.back-btn svg{width:17.5px;height:17.5px;stroke-width:1.85}
.back-btn.is-loading{pointer-events:none}
.back-btn.is-loading svg{display:none}
.back-btn.is-loading::after{
  content:'';
  width:15px;
  height:15px;
  border-radius:50%;
  border:2px solid rgba(17,17,19,.2);
  border-top-color:var(--ink);
  animation:spin .6s linear infinite;
}
.cart-badge{
  position:absolute;
  top:-2px;
  right:-2px;
  min-width:16px;
  height:16px;
  padding:0 4px;
  border-radius:999px;
  background:#000000;
  color:#fff;
  font-size:10px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1.5px solid #fff;
}

.head-title-wrap{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
}
.head-dot{
  width:20px;
  height:20px;
  flex:0 0 20px;
  border-radius:6px;
  border:1px solid rgba(17,17,19,.18);
}
.head-titles{min-width:0;flex:1}
.head-title{
  font-family:var(--font-main);
  font-size:18.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.all-btn{
  flex:0 0 auto;
  height:32px;
  padding:0 12px;
  border-radius:999px;
  border:1px solid #E5E5EA;
  background:#F8F8FA;
  color:var(--ink);
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:transform .14s,background .18s;
}
.all-btn:active{transform:scale(.95)}
.all-btn svg{width:13px;height:13px;stroke-width:2.1}

/* ---------- Sticky Horizontal Full-Colour Strip (When Viewing Products) ---------- */
.color-strip-bar{
  display:flex;
  align-items:center;
  gap:6px;
  overflow-x:auto;
  padding:2px 10px 8px;
  scrollbar-width:none;
}
.color-strip-bar::-webkit-scrollbar{display:none}
.s-pill{
  flex:0 0 auto;
  width:34px;
  height:34px;
  border-radius:9px;
  border:1.5px solid rgba(17,17,19,.15);
  padding:0;
  cursor:pointer;
  transition:transform .15s var(--ease),box-shadow .15s,border-color .15s;
  position:relative;
}
.s-pill.is-light{border-color:#D0D0D8}
.s-pill:active{transform:scale(.92)}
.s-pill.is-on{
  border:2.5px solid #111113;
  transform:scale(1.08);
  box-shadow:0 4px 10px rgba(0,0,0,.22);
}
.s-pill.is-on::after{
  content:"";
  position:absolute;
  inset:0;
  margin:auto;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#FFFFFF;
  box-shadow:0 1px 4px rgba(0,0,0,.45);
}
.s-pill.is-light.is-on::after{
  background:#111113;
  box-shadow:none;
}

/* Filter Chips Row (Sort / Price / Sale / Rating) */
.filters{
  display:flex;
  gap:7px;
  align-items:center;
  overflow-x:auto;
  padding:0 10px 9px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.dsel{
  flex:0 0 auto;
  height:32px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#FFFFFF;
  padding:0 11px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:border-color .15s,transform .12s,background .15s;
}
.dsel.is-active{border-color:var(--rani);background:var(--blush);font-weight:700}
.dsel:active{transform:scale(.96)}
.dsel svg{width:13px;height:13px;color:var(--muted)}
.chip{
  flex:0 0 auto;
  height:32px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#FFFFFF;
  padding:0 12px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink);
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.chip.is-on{
  background:linear-gradient(135deg,#242429,#0a0a0c);
  border-color:transparent;
  color:#FFFFFF;
  font-weight:700;
  box-shadow:0 6px 14px -4px rgba(0,0,0,.35);
}
.chip:active{transform:scale(.96)}
.chip svg{width:12.5px;height:12.5px}

/* ---------- Main Content ---------- */
main{flex:1;padding:10px 10px calc(86px + env(safe-area-inset-bottom,0px))}

/* ---------- FULL-BLEED PURE COLOUR GRID (ONLY COLOUR TILES) ---------- */
.swatch-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.swatch-card{
  position:relative;
  width:100%;
  aspect-ratio:1.12/1;
  border-radius:12px;
  border:1px solid rgba(17,17,19,.12);
  padding:0;
  cursor:pointer;
  overflow:hidden;
  display:block;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  transition:transform .16s var(--ease),box-shadow .18s,border-color .18s;
  opacity:0;
  transform:translateY(6px);
  animation:resultIn .24s var(--ease) forwards;
  animation-delay:calc(var(--i,0) * 14ms);
}
.swatch-card.is-light{
  border:1.5px solid #D4D4DC;
}
@media(hover:hover){
  .swatch-card:hover{
    transform:scale(1.02);
    box-shadow:0 8px 18px -6px rgba(0,0,0,.22);
    border-color:#111113;
  }
}
.swatch-card:active{
  transform:scale(.95);
}

/* ---------- Product Cards (100% Identical to aavirafashion.shop, search.html & wishlist.html) ---------- */
.res-count{
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--muted);
  margin:0 2px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.res-count b{color:var(--ink);font-weight:700}
.clear-link{
  background:rgba(212,175,55,.12);
  border:1px solid rgba(212,175,55,.32);
  border-radius:999px;
  color:#8A6D1D;
  font-family:var(--font-main);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  padding:4px 11px;
  flex:0 0 auto;
}

@keyframes resultIn{to{opacity:1;transform:translateY(0)}}
.results-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:8px 6px;
  margin-inline:-2px;
}
.pcard{
  position:relative;
  min-width:0;
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:0!important;
  overflow:hidden;
  padding-bottom:9px;
  box-shadow:none!important;
  display:flex;
  flex-direction:column;
  opacity:0;
  transform:translateY(8px);
  animation:resultIn .28s var(--ease) forwards;
  animation-delay:calc(var(--i,0) * 35ms);
  transition:border-color .22s var(--ease),transform .28s var(--ease),opacity .28s ease;
}
@media(hover:hover){
  .pcard:hover{
    box-shadow:none!important;
    border-color:#111113;
  }
}
.pcard.out-stock .pcard-media img{opacity:.76}
.pcard-link{display:block;cursor:pointer}
.pcard-media{
  position:relative;
  display:block;
  width:100%;
  aspect-ratio:1/1;
  border-radius:0!important;
  background:#F4F4F6;
  overflow:hidden;
}
.pcard-media img{
  width:100%;
  height:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:0!important;
  display:block;
  transition:transform .5s var(--ease);
}
@media(hover:hover){.pcard:hover .pcard-media img{transform:scale(1.04)}}
.tags{
  position:absolute;
  left:0;
  top:8px;
  max-width:62%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  z-index:2;
  pointer-events:none;
}
.tag-best{
  background:#DEC276;
  color:#111113;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3.5px 8px;
  border-radius:0;
  line-height:1.1;
  white-space:nowrap;
}
.tag-drop{
  background:#15803D;
  color:#FFFFFF;
  font-size:10px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  padding:3px 7px;
  border-radius:0;
  line-height:1.1;
  white-space:nowrap;
}
.tag-stock{
  position:absolute;
  right:0;
  top:8px;
  z-index:2;
  pointer-events:none;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:3.5px 8px;
  line-height:1.1;
  white-space:nowrap;
}
.tag-stock.oos{background:rgba(185,28,28,.94);color:#FFFFFF}
.tag-stock.low-stk{background:rgba(180,83,9,.94);color:#FFFFFF}
.tag-off{
  color:#2E8B57;
  background:transparent;
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  padding:0;
  border-radius:0;
  line-height:1.1;
  white-space:nowrap;
}

.pcard-foot{display:flex;flex-direction:column;padding:7px 9px 0;min-width:0;flex:1}
.pcard-text{display:block;min-width:0;cursor:pointer}
.pcard-name{
  display:block;
  font-size:14.5px;
  font-weight:500;
  letter-spacing:.01em;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#4A4F55;
}
.pcard-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px;margin-top:3px}
.price{font-size:16px;font-weight:700;letter-spacing:.01em;color:#111113}
.mrp{font-size:13px;color:#7D828A;text-decoration:line-through;font-weight:500}
.color-strip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2.5px 10px 2.5px 8px;
  border-radius:999px;
  background:linear-gradient(90deg,#EFEAE1 0%,rgba(239,234,225,.78) 62%,rgba(239,234,225,.08) 100%);
  color:#3A3532;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  white-space:nowrap;
  box-shadow:-2px 3px 8px -2px rgba(0,0,0,.13),inset 1.5px 0 0 rgba(212,175,55,.65);
  -webkit-mask-image:linear-gradient(90deg,#000 72%,rgba(0,0,0,.38) 100%);
  mask-image:linear-gradient(90deg,#000 72%,rgba(0,0,0,.38) 100%);
  flex-shrink:0;
}
.color-strip .cs-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.2);
  flex:0 0 8px;
}
.pcard-row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:5px;min-width:0;width:100%}
.pcard-metalink{display:flex;align-items:center;gap:5px;min-width:0;flex:1;overflow:hidden;cursor:pointer}

.go{
  margin-left:auto;
  flex:0 0 28px;
  width:28px;
  height:28px;
  padding:0;
  border:1px solid #E5E5EA;
  border-radius:50%;
  background:#FAFAFC;
  color:#111113;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:none!important;
  cursor:pointer;
  transition:transform .2s var(--ease),background .2s,color .2s,border-color .2s;
}
@media(hover:hover){.go:hover{background:#111113;border-color:#111113;color:#fff}}
.go:active{transform:scale(.9)}
.go svg{width:14px;height:14px;stroke-width:2.2}

.rating{
  display:inline-flex;
  align-items:center;
  gap:2.5px;
  font-weight:600;
  font-size:11.5px;
  color:#fff;
  background:#15803D;
  padding:2.5px 6.5px;
  border-radius:999px;
  flex-shrink:0;
  line-height:1;
}
.rating.mid{background:#B45309}
.rating.bad{background:#B91C1C}
.rating.none{background:#9A9298}
.rating svg{width:9px;height:9px;fill:currentColor;flex-shrink:0}

.low{
  display:inline-flex;
  align-items:center;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:#B45309;
  background:rgba(180,83,9,.08);
  padding:2.5px 7px;
  border-radius:999px;
  width:fit-content;
  max-width:100%;
}
.low.out{color:#B91C1C;background:rgba(185,28,28,.08)}

/* Skeletons */
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 6px;margin-inline:-2px}
.skel-card{
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:0;
  overflow:hidden;
  opacity:0;
  animation:resultIn .28s var(--ease) forwards;
  animation-delay:calc(var(--i,0) * 45ms);
}
.skel-media{
  aspect-ratio:1/1;
  background:linear-gradient(90deg,#F2F2F7 25%,#FAFAFC 37%,#F2F2F7 63%);
  background-size:400% 100%;
  animation:shimmer 1.3s ease infinite;
}
.skel-body{padding:9px;display:flex;flex-direction:column;gap:7px}
.skel-line{
  height:12px;
  border-radius:4px;
  background:linear-gradient(90deg,#F2F2F7 25%,#FAFAFC 37%,#F2F2F7 63%);
  background-size:400% 100%;
  animation:shimmer 1.3s ease infinite;
}

/* Empty State */
.empty{text-align:center;padding:38px 18px;color:var(--muted);background:#FFFFFF;border:1px solid #EBEBEF;border-radius:16px}
.empty .e-ic{
  width:56px;
  height:56px;
  border-radius:14px;
  border:1.5px solid rgba(17,17,19,.15);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}
.empty b{display:block;color:var(--ink);font-size:20px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-bottom:4px}
.empty p{font-size:14px;line-height:1.45;margin:0 auto 14px;max-width:250px}
.empty-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* ---------- Floating Cart Bar ---------- */
.cart-bar{
  position:fixed;
  z-index:85;
  left:0;
  right:0;
  margin:0 auto;
  width:calc(100% - 28px);
  max-width:392px;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;
  align-items:center;
  gap:9px;
  background:linear-gradient(135deg,#1C1C1E,#0B0B0D);
  color:#FFFFFF;
  border:1.5px solid rgba(212,175,55,.65);
  border-radius:999px;
  padding:6px 7px 6px 9px;
  box-shadow:0 16px 34px -10px rgba(0,0,0,.38);
  cursor:pointer;
}
.cart-bar[hidden]{display:none!important}
.cb-imgs{display:flex;align-items:center;flex:none}
.cb-imgs img{
  width:29px;
  height:29px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #FFFFFF;
  background:#F4F4F6;
}
.cb-imgs img+img{margin-left:-9px}
.cb-count{
  flex:1;
  text-align:left;
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
  color:#FFFFFF;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:0 4px;
}
.cb-go{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  flex:none;
  height:32px;
  padding:0 14px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#111113;
  background:linear-gradient(135deg,#E5C158,#C9A227);
  border-radius:999px;
}
.cb-go svg{width:13px;height:13px;stroke-width:2.3}

/* ---------- Sort / Price Sheet ---------- */
.scrim{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:95;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s;
}
.scrim.show{opacity:1;pointer-events:auto}
.scrim[hidden]{display:none!important}
.sheet{
  background:#FFFFFF;
  border-top:1px solid #E5E5EA;
  border-radius:24px 24px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));
  width:100%;
  max-width:420px;
  margin:0 auto;
  box-shadow:0 -20px 50px rgba(0,0,0,.18);
  transform:translateY(102%);
  transition:transform .3s var(--ease);
  max-height:78dvh;
  overflow-y:auto;
}
.scrim.show .sheet{transform:none}
.sheet-handle{width:42px;height:4px;border-radius:999px;background:#D9D9DE;margin:4px auto 12px}
.sheet h3{margin:0 0 8px;font-family:var(--font-main);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;color:var(--ink)}
.opt-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  border:0;
  background:none;
  padding:14px 4px;
  font-size:15.5px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink);
  cursor:pointer;
  border-bottom:1px solid #F2F2F6;
}
.opt-row:last-child{border-bottom:0}
.opt-row .radio{
  width:20px;
  height:20px;
  border-radius:50%;
  border:2px solid #C8C8D0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  transition:border-color .15s;
}
.opt-row.is-on{color:var(--rani);font-weight:700}
.opt-row.is-on .radio{border-color:var(--rani)}
.opt-row.is-on .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--rani)}

/* ---------- Quick View Popup (#sqaOv) ---------- */
.sqa-ov{
  position:fixed;
  inset:0;
  z-index:110;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.sqa-ov[hidden]{display:none!important}
.sqa-sheet{
  width:100%;
  max-width:420px;
  background:#FFFFFF;
  border-top:1px solid #E5E5EA;
  border-radius:26px 26px 0 0;
  padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));
  position:relative;
  max-height:92dvh;
  overflow-y:auto;
  animation:sqaUp .28s var(--ease);
  box-shadow:0 -20px 50px rgba(0,0,0,.18);
}
@keyframes sqaUp{from{transform:translateY(40px);opacity:0}}
.sqa-grab{width:42px;height:4px;border-radius:999px;background:#D9D9DE;margin:0 auto 12px}
.sqa-top{display:flex;gap:14px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sqa-media{
  position:relative;
  width:110px;
  height:110px;
  flex:0 0 110px;
  border-radius:12px;
  overflow:hidden;
  background:#F4F4F6;
  border:1px solid var(--line);
}
.sqa-media.is-switching::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(108deg,rgba(244,244,246,.85) 20%,rgba(255,255,255,.98) 42%,rgba(17,17,19,.14) 50%,rgba(255,255,255,.98) 58%,rgba(244,244,246,.85) 80%);
  background-size:220% 100%;
  animation:sqaShimmer .68s linear infinite;
  z-index:3;
}
@keyframes sqaShimmer{to{background-position:-220% 0}}
.sqa-img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;display:block;transition:opacity .2s}
.sqa-media.is-switching .sqa-img{opacity:.25}
.sqa-summary{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sqa-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sqa-name{
  font-family:var(--font-main);
  font-size:18px;
  font-weight:600;
  color:var(--ink);
  line-height:1.22;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.sqa-x{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#F8F8FA;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--ink);
  margin-top:-2px;
}
.sqa-x svg{width:15px;height:15px;stroke-width:2.2}
.sqa-price-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin-top:2px}
.sqa-price{font-size:19px;font-weight:700;color:var(--rani)}
.sqa-mrp{font-size:13px;color:#7D828A;text-decoration:line-through;font-weight:500}
.sqa-lowest{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;color:#7C3AED}
.sqa-badges{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:2px}
.sqa-sku{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.sqa-shead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.7px;
  margin:11px 0 7px;
  color:var(--muted);
}
.sqa-shead em{font-style:normal;color:var(--ink);font-weight:700;text-transform:none;letter-spacing:0}
.sqa-err{color:#DC2626!important;font-style:normal;font-size:12.5px;font-weight:700!important;text-transform:none!important;letter-spacing:0!important}
.sqa-colors{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.sqa-colors::-webkit-scrollbar{display:none}
.sqa-sw{
  position:relative;
  flex:0 0 auto;
  width:46px;
  height:46px;
  border-radius:50%;
  border:2px solid var(--line);
  padding:2.5px;
  background:#fff;
  cursor:pointer;
  transition:transform .2s,border-color .2s;
}
.sqa-sw img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:50%;display:block}
.sqa-sw.on{border-color:#111113;transform:scale(1.06);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.sqa-sizes{display:flex;gap:7px;flex-wrap:wrap}
.sqa-sz{
  min-width:42px;
  height:38px;
  padding:0 12px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:background .2s,color .2s,border-color .2s,transform .15s;
}
.sqa-sz:active{transform:scale(.95)}
.sqa-sz.on{
  background:linear-gradient(135deg,#242429,#0a0a0c);
  color:#fff;
  border-color:transparent;
  font-weight:700;
  box-shadow:0 5px 12px -3px rgba(0,0,0,.35);
}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.sqa-sizes.shake{animation:shake .35s}
.qty-box{
  flex:0 0 auto;
  height:40px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:#F8F8FA;
  border:1.5px solid var(--line);
  border-radius:999px;
  padding:3px 4px;
}
.qty-btn{
  position:relative;
  overflow:hidden;
  width:30px;
  height:30px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.qty-btn:active{transform:scale(.9)}
.qty-btn.plus{background:linear-gradient(135deg,#242429,#000000);color:#fff;border-color:#000}
.qty-btn.plus::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.72) 50%,transparent 80%);
  transform:translateX(-140%);
  animation:plusSimar 2.2s ease-in-out infinite;
}
@keyframes plusSimar{0%,55%{transform:translateX(-140%)}100%{transform:translateX(140%)}}
.qty-val{min-width:22px;text-align:center;font-size:14px;font-weight:700;color:var(--ink)}
.sqa-actions{display:grid;grid-template-columns:auto 1fr 40px 40px;gap:8px;margin-top:12px;align-items:center}
.sqa-add{
  grid-column:1/-1;
  width:100%;
  min-height:44px;
  background:linear-gradient(135deg,#242429,#000);
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 18px;
  font-size:14.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  box-shadow:0 10px 22px -8px rgba(0,0,0,.45);
}
.sqa-add:active{transform:scale(.98)}
.sqa-add:disabled{opacity:.5;cursor:not-allowed}
.sqa-add svg{width:15px;height:15px;stroke-width:2.3}
.sqa-full{
  min-height:40px;
  padding:0 14px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-size:13.5px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.sqa-wish,.sqa-share{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:transform .2s,background .2s,color .2s,border-color .2s;
}
.sqa-wish:active,.sqa-share:active{transform:scale(.9)}
.sqa-wish svg,.sqa-share svg{width:16px;height:16px;stroke-width:2}
.sqa-wish.on{color:#C8102E;background:#FFF0F3;border-color:#C8102E}
.sqa-wish.on svg{fill:currentColor}

/* ---------- Shopping Bag Drawer (#cartDrawerOv) ---------- */
.cd-ov{
  position:fixed;
  inset:0;
  z-index:115;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.cd-ov.on{display:flex}
.cd-sheet{
  width:100%;
  max-width:420px;
  max-height:88dvh;
  overflow-y:auto;
  background:#FFFFFF;
  border-radius:26px 26px 0 0;
  padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));
  border-top:1px solid #E5E5EA;
  box-shadow:0 -20px 50px rgba(0,0,0,.18);
  animation:sqaUp .28s var(--ease);
}
.cd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid #EBEBEF;margin-bottom:12px}
.cd-title-wrap{display:flex;align-items:center;gap:10px}
.cd-bag-ic{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#F8F8FA;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #E5E5EA;
}
.cd-bag-ic svg{width:18px;height:18px;stroke-width:2}
.cd-title-wrap h3{font-family:var(--font-main);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cd-title-wrap small{display:block;font-size:12.5px;color:var(--gold-text);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.cd-list{display:flex;flex-direction:column;gap:10px;max-height:44dvh;overflow-y:auto;padding-right:2px}
.cd-item{
  display:flex;
  align-items:center;
  gap:11px;
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:14px;
  padding:10px;
}
.cd-img{width:60px;height:60px;flex:0 0 60px;border-radius:0;object-fit:cover;background:#F4F4F6;border:1px solid #EBEBEF}
.cd-info{flex:1;min-width:0}
.cd-name{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.cd-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.cd-chip{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#F8F8FA;color:var(--ink);border:1px solid #E5E5EA}
.cd-price{font-size:15px;font-weight:700;color:var(--ink)}
.cd-ctrl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cd-del{width:26px;height:26px;border:0;border-radius:50%;background:#FEF2F2;color:var(--danger);display:inline-flex;align-items:center;justify-content:center}
.cd-del svg{width:13px;height:13px;stroke-width:2.2}
.cd-qty{display:inline-flex;align-items:center;background:#F8F8FA;border:1px solid #E5E5EA;border-radius:999px;padding:2px}
.cd-qbtn{width:25px;height:25px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.cd-qbtn.plus{background:var(--rani);color:#fff}
.cd-qval{min-width:22px;text-align:center;font-size:13px;font-weight:700;color:var(--ink)}
.cd-sum{
  margin-top:14px;
  padding:12px 14px;
  border-radius:14px;
  background:#F8F8FA;
  border:1px dashed #D4D4D8;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cd-sum span{font-size:13.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.cd-sum b{font-size:18px;font-weight:700;color:var(--ink)}
.cd-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.cd-checkout{
  width:100%;
  min-height:44px;
  border:0;
  border-radius:999px;
  background:linear-gradient(135deg,#242429,#000);
  color:#fff;
  font-size:14.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 10px 22px -6px rgba(0,0,0,.38);
}

/* Unified Top Pill Toast & Footer */
.foot{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
  letter-spacing:.02em;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);
  margin-top:6px;
}
.toast{
  position:fixed;
  left:50%;
  top:calc(62px + env(safe-area-inset-top,0px));
  bottom:auto;
  transform:translate(-50%,-16px);
  opacity:0;
  display:flex;
  align-items:center;
  gap:9px;
  background:linear-gradient(135deg,#16A34A,#15803D);
  color:#fff;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.02em;
  line-height:1.4;
  padding:10px 18px 10px 12px;
  border-radius:999px;
  box-shadow:0 10px 28px rgba(0,0,0,.32);
  pointer-events:none;
  transition:opacity .25s,transform .25s var(--ease);
  z-index:200;
  max-width:min(320px,88%);
}
.toast::before{
  content:"\2713";
  width:21px;
  height:21px;
  flex:0 0 21px;
  border-radius:50%;
  background:#fff;
  color:#16A34A;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
}
.toast[data-type="error"]{background:linear-gradient(135deg,#DC2626,#B91C1C)}
.toast[data-type="error"]::before{content:"!";color:#DC2626}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:375px){
  .top-row{padding:7px 8px}
  .back-btn,.icon-btn{width:33px;height:33px;flex:0 0 33px}
  main{padding-inline:8px}
  .swatch-grid{gap:7px}
  .pcard-foot{padding:7px 8px 0}
  .pcard-name{font-size:13.5px}
  .price{font-size:15.5px}
  .mrp{font-size:12px}
  .tag-off{font-size:12px}
  .rating{font-size:11px;padding:2px 5.5px}
  .go{width:26px;height:26px;flex:0 0 26px}
}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app">
  <header class="top" id="topBar">
    <div class="top-row">
      <button type="button" class="back-btn" onclick="goBack()" aria-label="Back"><i data-lucide="arrow-left"></i></button>
      <div class="head-title-wrap">
        <span class="head-dot" id="headDot" hidden></span>
        <div class="head-titles">
          <h1 class="head-title" id="headTitle">Shop by Colour</h1>
        </div>
      </div>
      <button type="button" class="all-btn" id="allColoursBtn" hidden onclick="selectColour(null)"><i data-lucide="grid"></i>All Colours</button>

      <button type="button" class="dsel" id="priceBtn" aria-label="Filter by price"><span id="priceLabel">Price: Any</span><i data-lucide="chevron-down"></i></button>
      <button type="button" class="chip" id="chipSale" aria-pressed="false"><i data-lucide="badge-percent"></i>On sale</button>
      <button type="button" class="chip" id="chipRate" aria-pressed="false"><i data-lucide="star"></i>4★ &amp; above</button>
    </div>
  </header>

  <main id="mainContent" aria-live="polite"></main>
  <footer class="foot">&copy; 2026 Aavira Fashion. All rights reserved.</footer>
</div>

<!-- FLOATING CART BAR -->
<button type="button" id="cartBar" class="cart-bar" hidden onclick="openCartDrawer()" aria-label="View your cart">
  <span class="cb-imgs" id="cartBarImgs" aria-hidden="true"></span>
  <span class="cb-count" id="cartBarCount">0 items</span>

<!-- SORT / PRICE FILTER SHEET -->

<!-- SHOPPING BAG DRAWER (#cartDrawerOv) -->
<div class="cd-ov" id="cartDrawerOv" onclick="if(event.target===this)closeCartDrawer()">

const COLOUR_BY_ID = Object.fromEntries(FIXED_COLOURS.map(c => [c.id, c]));

/* Longest-Phrase-First Alias Lookup Table */
const normToken = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');

const ALIAS_RULES = (() => {
  const list = [];
  FIXED_COLOURS.forEach(c => {
    c.aliases.forEach(a => {
      const phrase = normToken(a);
      if (phrase) {
        list.push({
          id: c.id,
          phrase,
          words: phrase.split(' ').length,
          len: phrase.length,
          rx: new RegExp(`(?:^|\\s)${phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?:$|\\s)`, 'i')
        });
      }
    });
  });
  return list.sort((a, b) => (b.words - a.words) || (b.len - a.len));
})();

const classifyColourPhrase = rawText => {
  const matchedIds = new Set();
  const segments = String(rawText || '').split(/[,/|&+]+/).map(normToken).filter(Boolean);
  for (const seg of segments) {
    let remaining = ` ${seg} `;
    for (const rule of ALIAS_RULES) {
      if (rule.rx.test(remaining)) {
        matchedIds.add(rule.id);
        remaining = remaining.replace(rule.rx, ' ');
      }
    }
  }
  return [...matchedIds];
};

/* ==========================================================================
   COLOUR OPTION SYNC ENGINE
   - Extracts each product's Colour Options (colors[i] <-> colorImages[i])
   - Never uses the default product card cover image (imageMain) when a colour option image exists
   - Matches strictly against the product's Colour Options so the exact matched colour option & photo appear
   ========================================================================== */
let allProducts = [];
const prodMap = {};
/* colourBuckets[colourId] holds array of { product, option: { name, image, index } } */
const colourBuckets = Object.fromEntries(FIXED_COLOURS.map(c => [c.id, []]));

const splitColorNames = val => {
  if (!val) return [];
  if (Array.isArray(val)) {
    return val.flatMap(item => {
      if (item && typeof item === 'object') {
        const n = item.name ?? item.color ?? item.colour ?? item.colorName ?? item.colourName ?? item.label ?? item.title ?? '';
        return String(n).trim() ? [String(n).trim()] : [];
      }
      return String(item ?? '').split(/[,|\n]+/).map(s => s.trim()).filter(Boolean);
    });
  }
  if (typeof val === 'string') {
    const trimmed = val.trim();
    if (!trimmed) return [];
    if (trimmed.startsWith('[')) {
      try { return splitColorNames(JSON.parse(trimmed)); } catch {}
    }
    return trimmed.split(/[,|\n]+/).map(s => s.trim()).filter(Boolean);
  }
  return [];
};

const extractAdminColorPairs = raw => {
  const pairs = [];
  const pushPair = (name, image) => {
    const cleanName = String(name ?? '').trim();
    const cleanImg = String(image ?? '').trim();
    if (!cleanName && !cleanImg) return;
    pairs.push({ name: cleanName, image: cleanImg });
  };
  const variantSources = [raw.colorVariants, raw.colourVariants, raw.variants, raw.colorOptions, raw.colourOptions, raw.colorList];
  for (const src of variantSources) {
    if (Array.isArray(src) && src.length && src.some(it => it && typeof it === 'object')) {
      src.forEach(it => {
        if (it && typeof it === 'object') {
          pushPair(
            it.name ?? it.color ?? it.colour ?? it.colorName ?? it.colourName ?? it.label ?? it.title ?? '',
            it.image ?? it.img ?? it.imageUrl ?? it.url ?? it.photo ?? it.src ?? ''
          );
        }
      });
      if (pairs.length) return pairs;
    }
  }
  const nameSources = [
    raw.colors, raw.colours, raw.colorNames, raw.colourNames,
    raw.colorsName, raw.coloursName, raw.colorsInfo, raw.coloursInfo,
    raw.colorInfo, raw.colourInfo, raw.colorLabels, raw.colourLabels,
    raw.color, raw.colour
  ];
  let fallbackNames = [];
  for (const src of nameSources) {
    const list = splitColorNames(src);
    if (list.length > fallbackNames.length) fallbackNames = list;
  }

  if (Array.isArray(raw.colorImages) && raw.colorImages.some(it => it && typeof it === 'object')) {
    raw.colorImages.forEach((it, idx) => {
      if (it && typeof it === 'object') {
        pushPair(
          it.name ?? it.color ?? it.colour ?? it.colorName ?? it.colourName ?? it.label ?? fallbackNames[idx] ?? '',
          it.image ?? it.img ?? it.imageUrl ?? it.url ?? it.photo ?? it.src ?? ''
        );
      } else if (typeof it === 'string' && it.trim()) {
        pushPair(fallbackNames[idx] ?? '', it.trim());
      }
    });
    if (pairs.length) return pairs;
  }

  if (Array.isArray(raw.colors) && raw.colors.some(it => it && typeof it === 'object')) {
    const fallbackImgs = Array.isArray(raw.colorImages) ? raw.colorImages.filter(u => typeof u === 'string') : [];
    raw.colors.forEach((it, idx) => {
      if (it && typeof it === 'object') {
        pushPair(
          it.name ?? it.color ?? it.colour ?? it.colorName ?? it.colourName ?? it.label ?? '',
          it.image ?? it.img ?? it.imageUrl ?? it.url ?? it.photo ?? fallbackImgs[idx] ?? ''
        );
      }
    });
    if (pairs.length) return pairs;
  }

  if (raw.colorImages && typeof raw.colorImages === 'object' && !Array.isArray(raw.colorImages)) {
    Object.entries(raw.colorImages).forEach(([k, v]) => {
      if (typeof v === 'string' && v.trim()) pushPair(k, v.trim());
    });
    if (pairs.length) return pairs;
  }

  return pairs;
};

/* Returns the exact Colour Options list for a product:
   Each colour option i pairs colors[i] directly with colorImages[i] (NOT the default product card image) */
const getProductColorList = product => {
  if (!product) return [];
  const mainImg = String(product.img || product.imageMain || product.image || product.imageUrl || '').trim();
  const adminPairs = Array.isArray(product.colorPairs) && product.colorPairs.length
    ? product.colorPairs
    : extractAdminColorPairs(product);

  if (adminPairs.length) {
    return adminPairs.map((p, idx) => ({
      name: String(p.name || '').trim(),
      image: String(p.image || '').trim(),
      index: idx
    })).filter(opt => opt.name || opt.image);
  }

  const nameSources = [
    product.colors, product.colours, product.colorNames, product.colourNames,
    product.colorsName, product.coloursName, product.colorsInfo, product.coloursInfo,
    product.colorInfo, product.colourInfo, product.colorLabels, product.colourLabels,
    product.color, product.colour
  ];
  let names = [];
  for (const src of nameSources) {
    const list = splitColorNames(src);
    if (list.length > names.length) names = list;
  }

  const rawImgs = Array.isArray(product.colorImages)
    ? product.colorImages
    : (Array.isArray(product.colourImages) ? product.colourImages : []);
  const imgs = rawImgs
    .map(it => (it && typeof it === 'object') ? (it.image ?? it.img ?? it.imageUrl ?? it.url ?? '') : String(it ?? '').trim())
    .filter(Boolean);

  if (imgs.length > 0) {
    if (names.length === imgs.length + 1 && mainImg && !imgs.includes(mainImg)) {
      return [
        { name: String(names[0] || '').trim(), image: mainImg, index: 0 },
        ...imgs.map((url, i) => ({ name: String(names[i + 1] || '').trim(), image: url, index: i + 1 }))
      ];
    }
    return imgs.map((url, i) => ({
      name: String(names[i] || '').trim(),
      image: url,
      index: i
    }));
  }

  if (names.length > 0) {
    return names.map((n, i) => ({ name: String(n).trim(), image: mainImg, index: i }));
  }

  return [];
};

/* Sync product strictly by its Colour Options (never by product title or default card cover image) */
const rebuildColourBuckets = () => {
  FIXED_COLOURS.forEach(c => { colourBuckets[c.id] = []; });

  allProducts.forEach(p => {
    const options = getProductColorList(p);
    p._colorOptions = options;
    p._matchedOptionByColourId = {};

    /* Match ONLY from the product's actual colour options */
    options.forEach((opt, idx) => {
      const optName = String(opt.name || '').trim();
      const optImg = String(opt.image || '').trim();
      if (!optName || /^colour\s+\d+$/i.test(optName) || optName.toLowerCase() === 'standard' || optName.toLowerCase() === 'main') return;

      const matchedCids = classifyColourPhrase(optName);
      matchedCids.forEach(cid => {
        const targetCol = COLOUR_BY_ID[cid];
        if (!targetCol) return;
        const existing = p._matchedOptionByColourId[cid];
        const isExactName = normToken(optName) === normToken(targetCol.name);
        if (!existing || (isExactName && !existing.isExact)) {
          p._matchedOptionByColourId[cid] = {
            name: optName,
            image: optImg || p.img,
            index: idx,
            isExact: isExactName
          };
        }
      });
    });

    Object.entries(p._matchedOptionByColourId).forEach(([cid, matchedOption]) => {
      if (colourBuckets[cid]) {
        colourBuckets[cid].push({ product: p, option: matchedOption });
      }
    });
  });
};

const normalize = x => {
  const pid = x.id ?? x._id;
  const nameSources = [
    x.colors, x.colours, x.colorNames, x.colourNames,
    x.colorsName, x.coloursName, x.colorsInfo, x.coloursInfo,
    x.colorInfo, x.colourInfo, x.colorLabels, x.colourLabels,
    x.color, x.colour
  ];
  let parsedColors = [];
  for (const src of nameSources) {
    const list = splitColorNames(src);
    if (list.length > parsedColors.length) parsedColors = list;
  }
  const item = {
    id: pid,
    name: x.name || x.title || '',
    price: x.price,
    mrp: x.mrp ?? x.originalPrice,
    colors: parsedColors,
    colorsInfo: x.colorsInfo || x.coloursInfo || '',
    colorImages: Array.isArray(x.colorImages) ? x.colorImages : (Array.isArray(x.colourImages) ? x.colourImages : []),
    colorPairs: extractAdminColorPairs(x),
    sizes: Array.isArray(x.sizes) && x.sizes.length ? x.sizes : ['32', '34', '36', '38', '40', '42'],
    img: x.imageMain || x.image || x.imageUrl || x.img || '',
    category: x.category || x.type || x.collection || x.tag || '',
    description: x.description || '',
    stock: x.stock,
    bestseller: !!x.bestseller,
    rating: clamp(Number(x.rating ?? x.averageRating ?? x.avgRating ?? x.ratingAvg ?? x.average_rating ?? x.avg_rating ?? x.stars) || 0, 0, 5)
  };
  if (pid != null) prodMap[String(pid)] = item;
  return item;
};

const applyReviewStats = () => {
  const agg = {};
  (safeJson('aavira_experiences', []) || []).forEach(e => {
    const pid = e.productId ?? e.product_id ?? e.pid;
    if (pid == null) return;
    const a = agg[String(pid)] = agg[String(pid)] || { s: 0, n: 0 };
    a.s += Number(e.rating) || 0;
    a.n++;
  });
  allProducts.forEach(p => {
    const a = agg[String(p.id)];
    if (a && a.n && !(Number(p.rating) > 0)) p.rating = clamp(Math.round((a.s / a.n) * 10) / 10, 0, 5);
  });
};

/* ---------- Active State & URL Sync ---------- */
let activeColourId = null;
let sortVal = 'rel';
let priceVal = 'any';

const resolveColourParam = rawParam => {
  if (!rawParam) return null;
  const clean = String(rawParam).trim().toLowerCase();
  const direct = FIXED_COLOURS.find(c => c.id === clean || c.name.toLowerCase() === clean);
  if (direct) return direct.id;
  const classified = classifyColourPhrase(clean);
  return classified[0] || null;
};

/* ---------- Product Card Template (Synced Directly to the Matched Colour Option) ---------- */
const colorStripHtml = (p, matchedOption, selectedCol) => {
  if (matchedOption && matchedOption.name) {
    const dotBg = selectedCol ? selectedCol.bg : '#111113';
    return `<span class="color-strip"><span class="cs-dot" style="background:${dotBg}"></span>${escapeHtml(matchedOption.name)}</span>`;
  }
  const list = p._colorOptions || getProductColorList(p);
  const count = Math.max(1, list.length);
  return `<span class="color-strip">${count} ${count === 1 ? 'Colour' : 'Colours'}</span>`;
};

const ratingPill = p => {
  const r = clamp(Number(p.rating) || 0, 0, 5);
  const tone = r >= 4 ? '' : r >= 3 ? 'mid' : r > 0 ? 'bad' : 'none';
  return `<span class="rating ${tone}" role="img" aria-label="Rating ${r > 0 ? r.toFixed(1) : '0.0'}"><i data-lucide="star" fill="currentColor"></i>${r > 0 ? r.toFixed(1) : '0.0'}</span>`;
};

const resultCard = (entry, i = 0, selectedCol = null) => {
  const p = entry.product || entry;
  const matchedOption = entry.option || (selectedCol && p._matchedOptionByColourId?.[selectedCol.id]) || null;
  const { pr, m, saved, off } = priceInfo(p);
  const id = escapeHtml(p.id), name = escapeHtml(p.name);

  /* Strictly use the matched Colour Option's image (NOT the default product card cover image) */
  const displayImg = safeImageUrl(matchedOption?.image || p.img);
  const optNameParam = matchedOption?.name ? `&color=${encodeURIComponent(matchedOption.name)}` : '';
  const href = `/product?id=${encodeURIComponent(p.id)}${optNameParam}`;
  const stock = Number(p.stock);
  const isOut = Number.isFinite(stock) && stock <= 0 && p.stock !== '' && p.stock != null;
  const isLow = !isOut && Number.isFinite(stock) && stock > 0 && stock <= 4;

  const topTags = [
    p.bestseller ? '<span class="tag-best">BESTSELLER</span>' : '',
    off >= 20 && !isOut ? '<span class="tag-drop">PRICE DROP</span>' : ''
  ].filter(Boolean).join('');

  const stockOverlay = isOut
    ? '<span class="tag-stock oos">Out of Stock</span>'
    : (isLow ? `<span class="tag-stock low-stk">Only ${stock} Left</span>` : '');

  return `<article class="pcard${isOut ? ' out-stock' : ''}" style="--i:${i}">
    <span class="pcard-link" data-product="${id}" data-matched-color="${escapeHtml(matchedOption?.name || '')}">
      <span class="pcard-media">
        <img src="${escapeHtml(displayImg)}" alt="${escapeHtml(matchedOption?.name ? `${ p.name } - ${ matchedOption.name }` : p.name)}" loading="lazy" onerror="imgFallback(this)">
        ${topTags ? `<span class="tags">${topTags}</span>` : ''}
        ${stockOverlay}
      </span>
    </span>
    <div class="pcard-foot">
      <a class="pcard-text" href="${href}" data-product="${id}" data-matched-color="${escapeHtml(matchedOption?.name || '')}">
        <span class="pcard-name">${name}</span>
        <span class="pcard-price">
          <span class="price">${fmt(pr)}</span>
          ${m > pr ? `<span class="mrp">${fmt(m)}</span>` : ''}
          ${saved > 0 ? `<span class="tag-off">${fmt(saved)} OFF</span>` : ''}
        </span>
      </a>
      <div class="pcard-row">
        <a class="pcard-metalink" href="${href}" data-product="${id}" data-matched-color="${escapeHtml(matchedOption?.name || '')}">${colorStripHtml(p, matchedOption, selectedCol)}${ratingPill(p)}</a>
        <button type="button" class="go" data-qv="${id}" data-qv-color="${escapeHtml(matchedOption?.name || '')}" aria-label="Quick view ${name}"><i data-lucide="eye"></i></button>
      </div>
    </div>
  </article>`;
};

const skeletons = (n = 6) => `<div class="skel-grid">` + Array(n).fill(0).map((_, i) => `<div class="skel-card" style="--i:${i}"><div class="skel-media"></div><div class="skel-body"><div class="skel-line" style="width:76%"></div><div class="skel-line" style="width:48%"></div><div class="skel-line" style="width:60%"></div></div></div>`).join('') + `</div>`;

/* ---------- Render Sticky Horizontal Pure-Colour Strip ---------- */
const renderStickyStrip = () => {
  const strip = $('#strip');
  if (!activeColourId) {
    strip.hidden = true;
    return;
  }
  strip.hidden = false;
  strip.innerHTML = FIXED_COLOURS.map(c => {
    const on = c.id === activeColourId;
    return `<button type="button" class="s-pill${c.light ? ' is-light' : ''}${on ? ' is-on' : ''}" style="background:${c.bg}" data-cid="${c.id}" title="${escapeHtml(c.name)}" aria-label="${escapeHtml(c.name)}"></button>`;
  }).join('');

  strip.querySelectorAll('.s-pill').forEach(btn => {
    btn.addEventListener('click', () => selectColour(btn.dataset.cid));
  });

  requestAnimationFrame(() => {
    const activePill = strip.querySelector('.s-pill.is-on');
    if (activePill) activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
};

/* ---------- Render Pure Full-Colour Swatch Grid (Only Colours Visible) ---------- */
const renderPaletteView = () => {
  return `<div class="swatch-grid">
    ${FIXED_COLOURS.map((c, i) => `<button type="button" class="swatch-card${c.light ? ' is-light' : ''}" style="--i:${i};background:${c.bg}" data-pick-colour="${c.id}" title="${escapeHtml(c.name)}" aria-label="${escapeHtml(c.name)}"></button>`).join('')}
  </div>`;
};

/* ---------- Render Selected Colour Products View ---------- */
const renderSelectedColourView = col => {
  const sale = $('#chipSale').classList.contains('is-on');
  const rate = $('#chipRate').classList.contains('is-on');
  const sort = sortVal;
  const priceRange = priceVal;

  $('#sortBtn').classList.toggle('is-active', sort !== 'rel');
  $('#priceBtn').classList.toggle('is-active', priceRange !== 'any');

  if (!allProducts.length && window._loading) {
    return skeletons(6);
  }
  if (!allProducts.length && window._failed) {
    return `<div class="empty"><div class="e-ic" style="background:${col.bg}"></div><b>Products unavailable</b><p>Please check your connection and try again.</p><button type="button" class="chip" onclick="loadProducts()"><i data-lucide="rotate-ccw"></i>Try again</button></div>`;
  }

  const baseList = colourBuckets[col.id] || [];
  let f = [...baseList];
  if (sale) f = f.filter(entry => priceInfo(entry.product).off > 0);
  if (rate) f = f.filter(entry => Number(entry.product.rating) >= 4);
  if (priceRange !== 'any') {
    const [lo, hi] = priceRange.split('-');
    f = f.filter(entry => {
      const pr = priceInfo(entry.product).pr;
      return pr >= Number(lo) && (hi === '' || hi === undefined || pr <= Number(hi));
    });
  }

  const by = {
    plh: (a, b) => priceInfo(a.product).pr - priceInfo(b.product).pr,
    phl: (a, b) => priceInfo(b.product).pr - priceInfo(a.product).pr,
    disc: (a, b) => priceInfo(b.product).off - priceInfo(a.product).off,
    rate: (a, b) => (Number(b.product.rating) || 0) - (Number(a.product.rating) || 0)
  }[sort];
  if (by) f.sort(by);

  const activeFilterCount = [sale, rate, priceRange !== 'any', sort !== 'rel'].filter(Boolean).length;

  if (!f.length) {
    return `
      <div class="empty">
        <div class="e-ic" style="background:${col.bg}"></div>
        <b>${activeFilterCount ? 'No matches with current filters' : `No ${escapeHtml(col.name)} blouses right now`}</b>
        <p>${activeFilterCount ? 'Reset your price or rating filters to view available styles.' : 'Tap another shade above or view all colours.'}</p>
        <div class="empty-actions">
          ${activeFilterCount ? '<button type="button" class="chip" onclick="clearAllFilters()"><i data-lucide="rotate-ccw"></i>Clear filters</button>' : ''}
          <button type="button" class="chip is-on" onclick="selectColour(null)"><i data-lucide="grid"></i>All Colours</button>
        </div>
      </div>`;
  }

  return `
    <p class="res-count">
      <span>Showing <b>${f.length}</b> ${escapeHtml(col.name)} blouse${f.length === 1 ? '' : 's'}</span>
      ${activeFilterCount ? '<button type="button" class="clear-link" onclick="clearAllFilters()">Reset filters</button>' : ''}
    </p>
    <div class="results-grid">${f.map((entry, i) => resultCard(entry, i, col)).join('')}</div>
  `;
};

/* ---------- Main Render Controller ---------- */
function render() {
  const main = $('#mainContent');
  const col = activeColourId ? COLOUR_BY_ID[activeColourId] : null;

  const headDot = $('#headDot');
  const headTitle = $('#headTitle');
  const allBtn = $('#allColoursBtn');
  const filtersBar = $('#colourFilters');

  if (col) {
    headDot.hidden = false;
    headDot.style.background = col.bg;
    headTitle.textContent = col.name;
    allBtn.hidden = false;
    filtersBar.hidden = false;
  } else {
    headDot.hidden = true;
    headTitle.textContent = 'Shop by Colour';
    allBtn.hidden = true;
    filtersBar.hidden = true;
  }

  renderStickyStrip();

  const url = new URL(location.href);
  if (col) {
    url.searchParams.set('c', col.name);
  } else {
    url.searchParams.delete('c');
    url.searchParams.delete('color');
    url.searchParams.delete('colour');
  }
  try { history.replaceState(null, '', url); } catch {}

  if (!col) {
    main.innerHTML = renderPaletteView();
  } else {
    main.innerHTML = renderSelectedColourView(col);
  }

  $$('[data-pick-colour]').forEach(btn => {
    btn.addEventListener('click', () => selectColour(btn.dataset.pickColour));
  });

  icons();
}

window.selectColour = cid => {
  const next = cid && COLOUR_BY_ID[cid] ? cid : null;
  activeColourId = next;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
};

window.clearAllFilters = () => {

  $('#chipRate').classList.remove('is-on'); $('#chipRate').setAttribute('aria-pressed', 'false');

/* ---------- Quick View Logic (#sqaOv) Synced with Matched Colour Option ---------- */
let sqaPid = null;
let sqaQty = 1;
let sqaSwitchToken = 0;

window.stepSqaQty = delta => {
  sqaQty = clamp(sqaQty + delta, 1, 20);
  const el = $('#sqaQtyVal');
  if (el) el.textContent = String(sqaQty);
  navigator.vibrate?.(15);
};

window.openSugQA = (id, preferredColorName = '') => {
  const p = prodMap[String(id)];
  if (!p) return;
  sqaPid = String(id);
  sqaQty = 1;
  if ($('#sqaQtyVal')) $('#sqaQtyVal').textContent = '1';
  const { pr: price, m: mrp, saved } = priceInfo(p);
  const rating = clamp(Number(p.rating) || 0, 0, 5);
  const stockNum = Number(p.stock);
  const isOut = Number.isFinite(stockNum) && stockNum <= 0 && p.stock !== '' && p.stock != null;
  const wished = wishIds().has(String(p.id));

  const qvColors = (p._colorOptions && p._colorOptions.length ? p._colorOptions : getProductColorList(p)).map((c, idx) => ({
    name: String(c.name || `Colour ${idx + 1}`).trim(),
    image: safeImageUrl(c.image || p.img)
  }));

  /* Pre-select the exact matched Colour Option so Quick View opens with that exact colour option photo & name */
  let defaultIdx = 0;
  const matchedOpt = activeColourId && p._matchedOptionByColourId?.[activeColourId];
  const targetColorName = String(preferredColorName || matchedOpt?.name || '').trim().toLowerCase();

  if (targetColorName && qvColors.length) {
    const byName = qvColors.findIndex(c => c.name.toLowerCase() === targetColorName);
    if (byName >= 0) defaultIdx = byName;
  } else if (activeColourId && qvColors.length > 1) {
    const byBucket = qvColors.findIndex(c => classifyColourPhrase(c.name).includes(activeColourId));
    if (byBucket >= 0) defaultIdx = byBucket;
  }

  const initialColor = qvColors[defaultIdx] || { name: matchedOpt?.name || 'Standard', image: safeImageUrl(matchedOpt?.image || p.img) };

  $('#sqaMedia')?.classList.remove('is-switching');
  $('#sqaImg').src = initialColor.image;
  $('#sqaImg').alt = p.name || '';
  $('#sqaImg').onerror = function () { this.onerror = null; this.src = PLACEHOLDER; };
  $('#sqaName').textContent = p.name || '';

  $('#sqaPriceRow').innerHTML = `
    <span class="sqa-price">${fmt(price)}</span>
    ${mrp > price ? `<span class="sqa-mrp">${fmt(mrp)}</span>` : ''}
    ${saved > 0 ? `<span class="tag-off">${fmt(saved)} OFF</span>` : ''}`;

  const rateClass = rating >= 4 ? '' : rating >= 3 ? 'mid' : rating > 0 ? 'bad' : 'none';
  const stockBadge = isOut
    ? '<span class="low out" style="margin:0">Out of stock</span>'
    : (Number.isFinite(stockNum) && stockNum > 0 && stockNum <= 4
      ? `<span class="low" style="margin:0">Only ${stockNum} left</span>`
      : '<span class="low" style="margin:0;color:#15803D;background:rgba(21,128,61,.08)">In stock</span>');

  $('#sqaBadges').innerHTML = `
    <span class="rating ${rateClass}"><i data-lucide="star" fill="currentColor"></i>${rating > 0 ? rating.toFixed(1) : '0.0'}</span>
    ${p.bestseller ? '<span class="tag-best">BESTSELLER</span>' : ''}
    ${stockBadge}`;

  $('#sqaSku').textContent = 'SKU: AV-' + String(p.id).substring(0, 5).toUpperCase() + ' · Free delivery';

  $('#sqaColorWrap').hidden = !(qvColors.length >= 1);
  $('#sqaColorName').textContent = '· ' + initialColor.name;
  $('#sqaColors').innerHTML = qvColors.map((c, i) => `
    <button type="button" class="sqa-sw${i === defaultIdx ? ' on' : ''}" data-color="${escapeHtml(c.name)}" data-img="${escapeHtml(c.image)}" title="${escapeHtml(c.name)}" aria-label="${escapeHtml(c.name)}">
      <img src="${escapeHtml(c.image)}" alt="" loading="lazy" ${FALLBACK_ATTR}>
    </button>`).join('');

  $('#sqaErr').hidden = true;
  const sizes = Array.isArray(p.sizes) && p.sizes.length ? p.sizes : ['32', '34', '36', '38', '40', '42'];
  $('#sqaSizes').innerHTML = sizes.map((s, idx) => `<button type="button" class="sqa-sz${idx === 0 ? ' on' : ''}" data-size="${escapeHtml(s)}" ${isOut ? 'disabled' : ''}>${escapeHtml(s)}</button>`).join('');

  const addBtn = $('#sqaAdd');
  addBtn.disabled = isOut;
  $('#sqaAddText').textContent = isOut ? 'Out of stock' : 'Add to bag';
  $('#sqaFullLink').href = `/product?id=${encodeURIComponent(p.id)}&color=${encodeURIComponent(initialColor.name)}`;

  const wishBtn = $('#sqaWishBtn');
  wishBtn.dataset.heart = String(p.id);
  wishBtn.classList.toggle('on', wished);
  wishBtn.setAttribute('aria-pressed', wished);

  $('#sqaShareBtn').onclick = async () => {
    const shareUrl = new URL(`/product?id=${encodeURIComponent(p.id)}&color=${encodeURIComponent(initialColor.name)}`, location.origin).href;
    if (navigator.share) {
      try { await navigator.share({ title: p.name || 'Aavira Fashion', url: shareUrl }); return; } catch {}
    }
    try { await navigator.clipboard.writeText(shareUrl); showToast('Link copied'); } catch {}
  };

  $('#sqaOv').hidden = false;
  document.body.style.overflow = 'hidden';
  icons();
};

window.closeSugQA = () => {
  $('#sqaOv').hidden = true;
  document.body.style.overflow = '';
  sqaPid = null;
};

const pickSqaColor = btn => {
  const wasActive = btn.classList.contains('on');
  $$('#sqaColors .sqa-sw').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  sqaQty = 1;
  if ($('#sqaQtyVal')) $('#sqaQtyVal').textContent = '1';
  const pickedColor = btn.dataset.color || 'Standard';
  const em = $('#sqaColorName');
  if (em) em.textContent = '· ' + pickedColor;
  if (sqaPid && $('#sqaFullLink')) {
    $('#sqaFullLink').href = `/product?id=${encodeURIComponent(sqaPid)}&color=${encodeURIComponent(pickedColor)}`;
  }
  const img = $('#sqaImg');
  const media = $('#sqaMedia');
  const src = btn.dataset.img || '';
  if (!img || !src) return;
  if (wasActive) { navigator.vibrate?.(15); return; }

  const my = ++sqaSwitchToken;
  const t0 = Date.now(), MIN_SHOW = 420;
  media?.classList.add('is-switching');
  navigator.vibrate?.(15);
  const finish = ok => {
    if (my !== sqaSwitchToken) return;
    const wait = Math.max(0, MIN_SHOW - (Date.now() - t0));
    setTimeout(() => {
      if (my !== sqaSwitchToken) return;
      if (ok) img.src = src;
      media?.classList.remove('is-switching');
    }, wait);
  };
  const pre = new Image();
  pre.onload = () => finish(true);
  pre.onerror = () => finish(false);
  pre.src = src;
};

$('#sqaAdd').addEventListener('click', () => {
  const p = prodMap[sqaPid];
  if (!p) return;
  const sel = $('#sqaSizes .sqa-sz.on');
  if (!sel) {
    $('#sqaErr').hidden = false;
    const row = $('#sqaSizes');
    row.classList.remove('shake');
    void row.offsetWidth;
    row.classList.add('shake');
    navigator.vibrate?.(150);
    showToast('Please select a size', 'error');
    return;
  }
  const size = sel.dataset.size;
  const clrBtn = $('#sqaColors .sqa-sw.on');
  const matchedOpt = activeColourId && p._matchedOptionByColourId?.[activeColourId];
  const color = clrBtn?.dataset.color || matchedOpt?.name || (p.colors && p.colors[0]) || 'Standard';
  const img = clrBtn?.dataset.img || safeImageUrl(matchedOpt?.image || p.img);
  const addQty = Math.max(1, Number(sqaQty) || 1);

  const btn = $('#sqaAdd');
  btn.classList.add('is-busy');
  setTimeout(() => {
    btn.classList.remove('is-busy');
    const cart = readCart();
    const ex = cart.find(it => String(it.productId ?? it.id) === String(p.id) && it.size === size && (it.color || 'Standard') === color);
    if (ex) {
      ex.qty = clamp((Number(ex.qty) || 1) + addQty, 1, 20);
      ex.image = img;
    } else {
      cart.push({ productId: String(p.id), name: p.name, price: Number(p.price) || 0, mrp: Number(p.mrp) || 0, size, color, image: img, qty: addQty });
    }
    writeCart(cart);
    updateCartBadge();
    closeSugQA();
    showToast(`${color} (${size}) × ${addQty} added to bag`);
  }, 240);
});

/* ---------- Shopping Bag Drawer (#cartDrawerOv) ---------- */
window.renderCartDrawer = () => {

  const listEl = $('#cdList');
  const sumBox = $('#cdSumBox');
  const checkoutBtn = $('#cdCheckoutBtn');
  const totalCount = cart.reduce((s, it) => s + (Number(it.qty) || 1), 0);
  const totalAmt = cart.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);

  $('#cdSubCount').textContent = totalCount
    ? `${totalCount} ${totalCount === 1 ? 'item' : 'items'} ready to order`
    : 'Your bag is currently empty';

  if (!cart.length) {
    listEl.innerHTML = '<div class="empty" style="padding:24px 12px"><b>No items in your bag yet</b><p style="margin-bottom:0">Tap any product eye icon to pick colour &amp; size.</p></div>';
    sumBox.hidden = true;
    checkoutBtn.disabled = true;
    $('#cdCheckoutText').textContent = 'Bag is Empty';
    icons();
    return;
  }

  sumBox.hidden = false;
  checkoutBtn.disabled = false;
  $('#cdTotalAmt').textContent = fmt(totalAmt);
  $('#cdCheckoutText').textContent = `Proceed to Checkout · ${fmt(totalAmt)}`;

  listEl.innerHTML = cart.map((it, idx) => {
    const qty = Number(it.qty) || 1;
    const price = Number(it.price) || 0;
    return `<div class="cd-item">
      <img class="cd-img" src="${escapeHtml(safeImageUrl(it.image))}" alt="" ${FALLBACK_ATTR}>
      <div class="cd-info">
        <div class="cd-name">${escapeHtml(it.name || 'Aavira Outfit')}</div>
        <div class="cd-meta">
          <span class="cd-chip">Size: ${escapeHtml(it.size || 'Free')}</span>
          <span class="cd-chip">${escapeHtml(it.color || 'Standard')}</span>
        </div>
        <div class="cd-price">${fmt(price * qty)} <small style="font-weight:500;color:var(--muted)">(${fmt(price)} × ${qty})</small></div>
      </div>
      <div class="cd-ctrl">
        <button type="button" class="cd-del" onclick="removeCartItemAt(${idx})" aria-label="Remove item"><i data-lucide="trash-2"></i></button>
        <div class="cd-qty">
          <button type="button" class="cd-qbtn" onclick="changeCartItemQty(${idx}, -1)" aria-label="Decrease">−</button>
          <span class="cd-qval">${qty}</span>
          <button type="button" class="cd-qbtn plus" onclick="changeCartItemQty(${idx}, 1)" aria-label="Increase">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
  icons();
};

window.openCartDrawer = () => {
  renderCartDrawer();
  $('#cartDrawerOv').classList.add('on');
  document.body.style.overflow = 'hidden';
};
window.closeCartDrawer = () => {
  $('#cartDrawerOv').classList.remove('on');
  document.body.style.overflow = '';
};
window.changeCartItemQty = (index, delta) => {
  const cart = readCart();
  if (!cart[index]) return;
  const next = (Number(cart[index].qty) || 1) + delta;
  if (next <= 0) cart.splice(index, 1);
  else cart[index].qty = clamp(next, 1, 20);
  writeCart(cart);
  updateCartBadge();
  renderCartDrawer();
};
window.removeCartItemAt = index => {
  const cart = readCart();
  cart.splice(index, 1);
  writeCart(cart);
  updateCartBadge();
  renderCartDrawer();
};
window.proceedToCheckout = btn => {
  const cart = readCart().filter(it => it && (Number(it.qty) || 0) > 0);
  if (!cart.length) return showToast('Your bag is empty', 'error');
  saveJson('aavira_checkout_items', cart);
  btn?.classList.add('is-busy');
  setTimeout(() => {
    btn?.classList.remove('is-busy');
    location.href = '/checkout';
  }, 240);
};

/* ---------- Load Products with Cache Fallback ---------- */
async function loadProducts() {
  window._loading = true;
  window._failed = false;
  render();
  try {
    let d = typeof window.getVercelData === 'function' ? await window.getVercelData() : [];
    if ((!Array.isArray(d) || !d.length)) {
      const cached = safeJson('aavira_cache_products', null);
      if (cached && Array.isArray(cached.data) && cached.data.length) d = cached.data;
    } else {
      saveJson('aavira_cache_products', { time: Date.now(), data: d });
    }
    if (!Array.isArray(d) || !d.length) throw new Error('No products');
    allProducts = d.map(normalize);
    applyReviewStats();
    rebuildColourBuckets();
  } catch {
    window._failed = true;
  }
  window._loading = false;
  render();
}

function goBack() {
  if (activeColourId) {
    selectColour(null);
    return;
  }
  const btn = document.querySelector('.back-btn');
  if (btn && !btn.classList.contains('is-loading')) btn.classList.add('is-loading');
  setTimeout(() => {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
        history.back();
        return;
      }
    } catch {}
    location.href = '/';
  }, 280);
}

$('#sortBtn').addEventListener('click', () => openOpts('Sort by', SORT_OPTS, sortVal, v => {
  sortVal = v;
  $('#sortLabel').textContent = 'Sort: ' + SORT_OPTS.find(o => o.v === v).t;
  render();
}));
$('#priceBtn').addEventListener('click', () => openOpts('Price', PRICE_OPTS, priceVal, v => {
  priceVal = v;
  $('#priceLabel').textContent = 'Price: ' + (v === 'any' ? 'Any' : PRICE_OPTS.find(o => o.v === v).t);
  render();
}));
$('#optScrim').addEventListener('click', e => { if (e.target.id === 'optScrim') closeOpts(); });
['chipSale', 'chipRate'].forEach(id => $('#' + id).addEventListener('click', e => {
  const b = e.currentTarget, on = !b.classList.contains('is-on');
  b.classList.toggle('is-on', on);
  b.setAttribute('aria-pressed', on);
  render();
}));
window.addEventListener('scroll', () => { $('#topBar').classList.toggle('scrolled', scrollY > 8); }, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#sqaOv').hidden) closeSugQA();
    if ($('#cartDrawerOv').classList.contains('on')) closeCartDrawer();
    if (!$('#optScrim').hidden) closeOpts();
  }
});

document.addEventListener('click', e => {
  const qvBtn = e.target.closest('[data-qv]');
  if (qvBtn) {
    e.preventDefault();
    e.stopPropagation();
    const id = qvBtn.dataset.qv;
    const qvColor = qvBtn.dataset.qvColor || '';
    qvBtn.classList.add('is-busy');
    setTimeout(() => {
      qvBtn.classList.remove('is-busy');
      openSugQA(id, qvColor);
    }, 200);
    return;
  }

  const sw = e.target.closest('#sqaColors .sqa-sw');
  if (sw) {
    pickSqaColor(sw);
    return;
  }

  const sz = e.target.closest('#sqaSizes .sqa-sz');
  if (sz) {
    $$('#sqaSizes .sqa-sz').forEach(b => b.classList.remove('on'));
    sz.classList.add('on');
    $('#sqaErr').hidden = true;
    navigator.vibrate?.(15);
    return;
  }

  if (e.target.closest('#sqaOv') && !e.target.closest('.sqa-sheet')) {
    closeSugQA();
    return;
  }

  const heart = e.target.closest('[data-heart]');
  if (heart) {
    e.preventDefault();
    const id = String(heart.dataset.heart);
    if (!id) return;
    const on = toggleWishId(id);
    heart.classList.toggle('on', on);
    heart.setAttribute('aria-pressed', on);
    showToast(on ? 'Saved to wishlist' : 'Removed from wishlist');
    return;
  }

  const prodEl = e.target.closest('[data-product]');
  if (!prodEl) return;
  let r = (safeJson('aavira_recent', []) || []).filter(i => String(i) !== prodEl.dataset.product);
  r.unshift(prodEl.dataset.product);
  saveJson('aavira_recent', r.slice(0, 8));
  if (prodEl.tagName !== 'A') {
    const anchor = prodEl.closest('.pcard')?.querySelector('a[data-product]');
    if (anchor && anchor !== prodEl) { anchor.click(); }
  }
});

window.addEventListener('pageshow', () => {
  $$('.is-busy,.is-loading').forEach(el => el.classList.remove('is-busy', 'is-loading'));
  updateCartBadge();
  updateWishBadge();
});
window.addEventListener('storage', e => {
  if (!e.key || e.key.startsWith('aavira_')) {
    updateCartBadge();
    updateWishBadge();
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const rawColour = params.get('c') || params.get('color') || params.get('colour');
  if (rawColour) {
    activeColourId = resolveColourParam(rawColour);
  }
  updateCartBadge();
  updateWishBadge();
  icons();
  loadProducts();
});
</script>
</body>
</html>
