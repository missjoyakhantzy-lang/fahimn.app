<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Orders - Aavira Fashion</title>
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--rani:#D81B60;--rani-dark:#B71550;--ivory:#FDFBF7;--cream:#F7F1E8;--ink:#242024;--muted:#6B6369;--line:#E7E0D9;--blush:#F9E8EE;--green:#15803D;--danger:#B91C1C;--amber:#B45309}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--ivory);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--ivory);position:relative;overflow:hidden}
@media(min-width:640px){body{background:#EFE8DE}.app{box-shadow:0 0 60px rgba(36,32,36,.12)}}
.hdr{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:60px;padding:env(safe-area-inset-top,0) 6px 0;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.hdr .logo{height:36px;max-width:150px;object-fit:contain;display:block;margin:0 auto}
.hdr h1{font-family:"Playfair Display",serif;font-size:18px;text-align:center}
.ib{width:42px;height:42px;border:0;background:none;border-radius:50%;color:var(--rani);font-size:17px;display:flex;align-items:center;justify-content:center}
.ib:active{background:var(--blush)}
.top{padding:16px 16px 0;flex:0 0 auto}
.top h2{font-family:"Playfair Display",serif;font-size:24px}
.top p{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.search{position:relative;margin-bottom:12px}
.search i{position:absolute;left:14px;top:15px;font-size:13px;color:var(--muted)}
.search input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px 0 38px;font:inherit;font-size:14px;outline:none;background:#fff}
.search input:focus{border-color:var(--rani);box-shadow:0 0 0 3px rgba(216,27,96,.1)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--rani);border-color:var(--rani);color:#fff}
.scroll{flex:1;overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(36,32,36,.04)}
.oc{cursor:pointer;animation:rise .35s ease backwards}
.oc:active{transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.oc-top{display:flex;gap:14px}
.oc img,.ph{width:104px;height:130px;border-radius:14px;object-fit:cover;background:var(--cream);border:1px solid var(--line);flex:0 0 auto}
.ph{display:flex;align-items:center;justify-content:center;color:#CBBFC6;font-size:26px}
.oc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:11px;color:var(--muted);font-weight:600}
.oid{font-size:16px;font-weight:700}
.meta{font-size:12px;color:var(--muted)}
.price{margin-top:auto;font-size:18px;font-weight:700;color:var(--rani)}
.badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.b-Processing{background:#EFF6FF;color:#1D4ED8}.b-Confirmed{background:var(--blush);color:var(--rani)}.b-Shipped{background:#FEF3C7;color:var(--amber)}
.b-OutforDelivery{background:#FFF1F2;color:#E11D48}.b-Delivered{background:#ECFDF5;color:var(--green)}.b-Cancelled{background:#F3F4F6;color:#6B7280}
.oc-bot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.oc-bot i{margin-right:6px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty img{height:60px;max-width:60%;object-fit:contain;margin-bottom:16px}
.empty i.big{display:block;font-size:46px;color:#CBBFC6;margin-bottom:14px}
.empty h3{font-family:"Playfair Display",serif;font-size:20px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13px}
.empty a{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:999px;background:var(--rani);color:#fff;font-size:13px;font-weight:700;text-decoration:none}
.skel{height:170px;border-radius:18px;background:linear-gradient(90deg,#F1EBE3,#FAF6F0,#F1EBE3);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:14px}
@keyframes sh{to{background-position:-200% 0}}
.foot{text-align:center;padding:14px 0 6px}
.foot img{height:50px;max-width:65%;object-fit:contain;display:block;margin:0 auto 8px}
.foot p{font-size:11px;color:var(--muted)}
/* details */
.dv{position:absolute;inset:0;z-index:30;background:var(--ivory);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.25,.8,.25,1)}
.dv.on{transform:none}
.dv-body{flex:1;overflow-y:auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.h3{font-family:"Playfair Display",serif;font-size:17px;font-weight:600;margin-bottom:14px}
.eta{display:flex;gap:12px;align-items:center;background:var(--blush);border-radius:14px;padding:13px 15px;margin-bottom:14px}
.eta i{font-size:20px;color:var(--rani)}
.eta p{font-size:11px;color:var(--muted);font-weight:600}.eta b{font-size:14px}
.eta.ok{background:#ECFDF5}.eta.ok i,.eta.ok b{color:var(--green)}
.eta.no{background:#F3F4F6}.eta.no i{color:#6B7280}
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--line)}
.st{position:relative;margin-bottom:18px}.st:last-child{margin:0}
.dot{position:absolute;left:-34px;top:0;width:24px;height:24px;border-radius:50%;background:var(--line);color:#9A8F96;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #fff}
.st.done .dot{background:var(--rani);color:#fff}
.st.cur .dot{background:var(--rani);color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 4px #fff,0 0 0 4px rgba(216,27,96,.4)}60%{box-shadow:0 0 0 4px #fff,0 0 0 10px rgba(216,27,96,0)}100%{box-shadow:0 0 0 4px #fff,0 0 0 4px rgba(216,27,96,0)}}
.st.bad .dot{background:#F3F4F6;color:var(--danger)}
.st b{font-size:13.5px;display:block}.st.todo b{color:#A8A0A5}
.st small{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.it{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}.it:first-of-type{padding-top:0}.it:last-child{border:0;padding-bottom:0}
.it img,.it .ph{width:96px;height:120px}
.it h4{font-size:14px;line-height:1.35}.it small{font-size:12px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.kv.save{color:var(--green);font-weight:600}
.kv.tot{margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:16px;font-weight:700;color:var(--ink)}
.addr b{font-size:14px}.addr p{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px}
.pay{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.btn{width:100%;padding:14px;border-radius:999px;border:0;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.btn.p{background:var(--rani);color:#fff;box-shadow:0 6px 16px rgba(216,27,96,.25)}
.btn.l{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.d{background:#fff;border:1.5px solid #FECACA;color:var(--danger)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:11.5px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.qa i{font-size:16px;color:var(--rani)}
.mo{position:fixed;inset:0;z-index:60;background:rgba(36,32,36,.55);display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .3s ease}
.inv{border:1px dashed var(--line);border-radius:14px;padding:14px;margin:14px 0;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);opacity:0;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:11px 20px;border-radius:999px;z-index:100;pointer-events:none;transition:.28s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media print{.app>*:not(.mo){display:none!important}.mo{position:static;background:none}.sheet{box-shadow:none}.sheet button{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <button class="ib" onclick="location.href='/'" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <img class="logo" alt="Aavira Fashion" data-logo>
    <button class="ib" id="refBtn" onclick="refresh()" aria-label="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
  </header>
  <div class="top"><h2>My Orders</h2><p id="sub">Track all your orders here</p>
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search" placeholder="Search order ID or product" oninput="draw()"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="scroll" id="list"></div>

  <section class="dv" id="dv">
    <header class="hdr"><button class="ib" onclick="closeDv()" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><h1>Order details</h1><span></span></header>
    <div class="dv-body" id="dvBody"></div>
  </section>

  <div class="mo" id="inv" onclick="if(event.target===this)closeInv()">
    <div class="sheet">
      <div class="row"><h3 class="h3" style="margin:0">Order invoice</h3><button class="ib" onclick="closeInv()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="inv" id="invBody"></div>
      <button class="btn p" onclick="window.print()"><i class="fa-solid fa-print"></i>Print / Save as PDF</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const BACKEND = 'https://server-js-psi-five.vercel.app';
const WA = '919608720622';
const LOGO = 'public/file_0000000015bc82119a5830b82bcd3a20.png';
const LOGO2 = '/file_0000000015bc82119a5830b82bcd3a20.png';
const logoErr = `onerror="if(!this.dataset.r){this.dataset.r=1;this.src='${LOGO2}'}else{this.style.display='none'}"`;
const STEPS = ['Processing', 'Confirmed', 'Shipped', 'Out for Delivery', 'Delivered'];
const ICONS = ['fa-box', 'fa-circle-check', 'fa-truck', 'fa-truck-fast', 'fa-house-circle-check'];
const TABS = ['All', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];
const S = { orders: [], tab: 'All', cur: null };

const norm = raw => {
  const s = String(raw || '').toLowerCase();
  if (s.includes('cancel')) return 'Cancelled';
  if (s.includes('out for') || s.includes('outfor')) return 'Out for Delivery';
  if (s.includes('deliver')) return 'Delivered';
  if (s.includes('ship')) return 'Shipped';
  if (s.includes('confirm')) return 'Confirmed';
  return 'Processing';
};
const cid = s => String(s || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
const pdate = v => {
  if (!v) return null;
  if (typeof v === 'object') v = v._seconds ? v._seconds * 1000 : v.seconds ? v.seconds * 1000 : v;
  const d = new Date(v);
  return isNaN(d) ? null : d;
};
const fd = d => d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
const fdt = d => d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2000); };
const colorTxt = c => { const v = c || 'Standard'; return /^https?:|data:image|\//.test(v) ? 'As shown' : v; };
const oid = o => { const v = String(o.orderId || o.id || o._id || ''); return v.startsWith('#') ? v : '#' + v; };
const imgTag = (src, cls = '') => src
  ? `<img src="${esc(src)}" alt="" ${cls} onerror="this.outerHTML='<div class=\\'ph\\'><i class=\\'fa-solid fa-shirt\\'></i></div>'">`
  : `<div class="ph"><i class="fa-solid fa-shirt"></i></div>`;

/* Admin-controlled delivery info: deliveryNote / expectedDelivery / statusHistory come from the admin panel */
const etaText = o => {
  if (o.deliveryNote) return esc(o.deliveryNote);
  const v = o.expectedDelivery || o.estimatedDelivery || o.deliveryEta;
  if (!v) return '';
  const d = pdate(v);
  return d ? 'By ' + fd(d) : esc(v);
};
const stepTime = (o, step) => {
  const h = o.statusHistory || o.trackingHistory || o.timeline;
  if (!Array.isArray(h)) return '';
  const e = h.find(x => norm(x.status || x.title) === step);
  const d = e && pdate(e.time || e.at || e.date || e.createdAt);
  return d ? fdt(d) : '';
};
const stepNote = (o, step) => {
  const h = o.statusHistory || o.trackingHistory || o.timeline;
  const e = Array.isArray(h) && h.find(x => norm(x.status || x.title) === step);
  return e && (e.note || e.message) ? esc(e.note || e.message) : '';
};

/* Identity: login session email only. Orders always come from the server. */
const session = () => {
  const email = (localStorage.getItem('aavira_user_email') || '').trim().toLowerCase();
  const name = (localStorage.getItem('aavira_display_name') || '').trim();
  return email && name && name.toLowerCase() !== 'guest user' ? email : '';
};

const fetchOrders = async () => {
  const email = session();
  const guestId = new URLSearchParams(location.search).get('id') || '';
  $('#list').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  if (!email && !guestId) { S.orders = []; $('#sub').textContent = 'Login to see all your orders'; return draw(); }
  try {
    const url = `${BACKEND}/api/orders?nocache=${Date.now()}&` + (email ? `email=${encodeURIComponent(email)}` : `orderId=${encodeURIComponent(guestId)}`);
    const res = await fetch(url);
    const json = await res.json();
    let rows = res.ok && json.status === 'success' && Array.isArray(json.data) ? json.data : [];
    rows = email
      ? rows.filter(o => String(o.email || o.customerEmail || o.userEmail || '').trim().toLowerCase() === email)
      : rows.filter(o => cid(o.orderId || o.id || o._id) === cid(guestId)).slice(0, 1);
    S.orders = rows.sort((a, b) => (pdate(b.createdAt) || 0) - (pdate(a.createdAt) || 0));
    $('#sub').textContent = email ? `Signed in as ${email}` : 'Tracking your order';
  } catch (e) {
    S.orders = [];
    toast('Could not load orders. Check your connection.');
  }
  draw();
};
const refresh = async () => {
  const b = $('#refBtn');
  b.innerHTML = '<i class="fa-solid fa-rotate-right fa-spin"></i>';
  await fetchOrders();
  b.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
  toast('Orders refreshed');
};

const drawTabs = () => {
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab ${t === S.tab ? 'on' : ''}" onclick="S.tab='${t}';drawTabs();draw()">${t}</button>`).join('');
};
const matchTab = (o, t) => {
  const s = norm(o.orderStatus);
  if (t === 'All') return true;
  if (t === 'Processing') return s === 'Processing' || s === 'Confirmed';
  if (t === 'Shipped') return s === 'Shipped' || s === 'Out for Delivery';
  return s === t;
};
const footer = () => `<div class="foot"><img src="${LOGO}" alt="Aavira Fashion" ${logoErr}><p>&copy; ${new Date().getFullYear()} Aavira Fashion. All rights reserved.</p></div>`;

const draw = () => {
  const q = $('#q').value.trim().toLowerCase();
  const rows = S.orders.filter(o => matchTab(o, S.tab) && (!q || String(o.orderId || o.id || '').toLowerCase().includes(q) || (o.items || []).some(i => String(i.name || '').toLowerCase().includes(q))));
  if (!rows.length) {
    $('#list').innerHTML = `<div class="empty"><img src="${LOGO}" alt="" ${logoErr}><i class="fa-solid fa-box-open big"></i><h3>No orders found</h3><p>${S.orders.length ? 'Nothing here for this filter.' : 'Your orders will appear here.'}</p><a href="/">Start shopping</a></div>`;
    return;
  }
  $('#list').innerHTML = rows.map((o, i) => {
    const st = norm(o.orderStatus), items = o.items || [], first = items[0] || {};
    const d = pdate(o.createdAt), eta = etaText(o);
    let bot = eta ? `<span><i class="fa-solid fa-truck"></i>${eta}</span>` : `<span><i class="fa-regular fa-clock"></i>Delivery update soon</span>`;
    if (st === 'Delivered') bot = '<span style="color:var(--green)"><i class="fa-solid fa-circle-check"></i>Delivered</span>';
    if (st === 'Cancelled') bot = '<span><i class="fa-solid fa-circle-xmark"></i>Cancelled</span>';
    if (st === 'Out for Delivery') bot = `<span style="color:#E11D48"><i class="fa-solid fa-truck-fast"></i>${eta || 'Out for delivery'}</span>`;
    return `<div class="card oc" style="animation-delay:${Math.min(i * .06, .3)}s" onclick="openDv('${esc(o.orderId || o.id || o._id)}')">
      <div class="oc-top">${imgTag(first.image)}
        <div class="oc-info"><div class="row"><span class="lbl">Order ID</span><span class="badge b-${st.replace(/ /g, '')}">${st}</span></div>
          <div class="oid">${esc(oid(o))}</div>
          <div class="meta">${d ? fd(d) : ''} &bull; ${items.length || 1} item${items.length > 1 ? 's' : ''}</div>
          <div class="meta">${esc(first.name || '')}</div>
          <div class="price">${money(o.totalAmount || o.total)}</div></div></div>
      <div class="oc-bot">${bot}<i class="fa-solid fa-chevron-right" style="margin:0;color:#CBBFC6"></i></div></div>`;
  }).join('') + footer();
};

const openDv = id => {
  const o = S.orders.find(x => cid(x.orderId || x.id || x._id) === cid(id));
  if (!o) return;
  S.cur = o;
  const st = norm(o.orderStatus), items = o.items || [], d = pdate(o.createdAt), eta = etaText(o);
  const total = Number(o.totalAmount || o.total || 0);
  const idx = STEPS.indexOf(st);

  let etaBox = eta
    ? `<div class="eta"><i class="fa-solid fa-truck-fast"></i><div><p>Expected delivery</p><b>${eta}</b></div></div>`
    : `<div class="eta"><i class="fa-regular fa-clock"></i><div><p>Expected delivery</p><b>Aavira will update the time soon</b></div></div>`;
  if (st === 'Delivered') etaBox = '<div class="eta ok"><i class="fa-solid fa-circle-check"></i><div><p>Delivery status</p><b>Delivered successfully</b></div></div>';
  if (st === 'Cancelled') etaBox = '<div class="eta no"><i class="fa-solid fa-ban"></i><div><p>Delivery status</p><b>Order cancelled</b></div></div>';

  let tl;
  if (st === 'Cancelled') {
    tl = `<div class="st done"><div class="dot"><i class="fa-solid fa-check"></i></div><b>Order placed</b><small>${d ? fdt(d) : ''}</small></div>
          <div class="st bad"><div class="dot"><i class="fa-solid fa-xmark"></i></div><b>Cancelled</b><small>${stepTime(o, 'Cancelled') || stepNote(o, 'Cancelled')}</small></div>`;
  } else {
    tl = STEPS.map((s, i) => {
      const cls = i < idx || (st === 'Delivered' && i === idx) ? 'done' : i === idx ? 'cur' : 'todo';
      const t = stepTime(o, s) || (i === 0 && d ? fdt(d) : '');
      return `<div class="st ${cls}"><div class="dot"><i class="fa-solid ${cls === 'done' ? 'fa-check' : ICONS[i]}"></i></div><b>${s}</b>${t ? `<small>${t}</small>` : ''}${stepNote(o, s) ? `<small>${stepNote(o, s)}</small>` : ''}</div>`;
    }).join('');
  }

  const sub = Number(o.subtotal || 0), ship = o.deliveryFee ?? o.shippingFee, gift = Number(o.giftWrapFee || 0), disc = Number(o.promoDiscount || 0);
  const bill = (sub ? `<div class="kv"><span>Items subtotal</span><span>${money(sub)}</span></div>` : '')
    + (ship != null ? `<div class="kv"><span>Shipping</span><span>${Number(ship) ? money(ship) : 'Free'}</span></div>` : '')
    + (gift ? `<div class="kv"><span>Gift wrap</span><span>${money(gift)}</span></div>` : '')
    + (disc ? `<div class="kv save"><span>Coupon${o.promoCodeUsed ? ' (' + esc(o.promoCodeUsed) + ')' : ''}</span><span>- ${money(disc)}</span></div>` : '')
    + `<div class="kv tot"><span>Total amount</span><span>${money(total)}</span></div>`;

  const pm = String(o.paymentMethod || '').toLowerCase(), ps = String(o.paymentStatus || '').toLowerCase();
  const paid = ps === 'paid' || ps === 'success';
  const failed = ps === 'failed' || ps === 'error';
  const label = paid ? 'Payment received' : failed ? 'Payment failed' : pm === 'cod' ? 'Pay on delivery' : 'Payment pending';
  const color = paid ? 'var(--green)' : failed ? 'var(--danger)' : 'var(--amber)';
  let payAct = '';
  if (!paid && st !== 'Cancelled') payAct = `<button class="btn p" onclick="payWA()"><i class="fa-brands fa-whatsapp"></i>${pm === 'cod' ? 'Pay online instead' : 'Complete payment'} ${money(total)}</button>`;

  $('#dvBody').innerHTML = `
    <div class="qa"><button onclick="openInv()"><i class="fa-solid fa-file-invoice"></i>Invoice</button><button onclick="supportWA()"><i class="fa-brands fa-whatsapp" style="color:#25D366"></i>Support</button><button onclick="copyId()"><i class="fa-regular fa-copy"></i>Copy ID</button></div>
    <div class="card"><div class="row"><div><div class="lbl">Order ID</div><div class="oid">${esc(oid(o))}</div></div><span class="badge b-${st.replace(/ /g, '')}">${st}</span></div><div class="meta" style="margin-top:6px">Placed on ${d ? fdt(d) : '-'}</div></div>
    ${etaBox}
    <div class="card"><h3 class="h3">Tracking</h3><div class="tl">${tl}</div></div>
    <div class="card"><h3 class="h3">Your order</h3>${(items.length ? items : [{ name: 'Item', qty: 1, price: total }]).map(i => `<div class="it">${imgTag(i.image)}<div><h4>${esc(i.name || 'Item')}</h4><small>Size: ${esc(i.size || 'Free Size')} · Color: ${esc(colorTxt(i.color))}</small><div class="meta" style="margin-top:6px">Qty: ${i.qty || 1}</div><div class="oid" style="color:var(--rani);margin-top:4px">${money(Number(i.price || 0) * (i.qty || 1))}</div></div></div>`).join('')}</div>
    <div class="card addr"><h3 class="h3">Delivery address</h3><b>${esc(o.customerName || o.name || 'Customer')}</b><p>${esc(o.address || 'Address not provided')}</p><p><i class="fa-solid fa-phone" style="font-size:10px"></i> ${esc(o.phone || o.customerPhone || '-')}</p></div>
    <div class="card"><h3 class="h3">Payment summary</h3>${bill}
      <div class="pay"><div class="kv"><span>Method</span><b style="color:var(--ink);text-transform:uppercase">${esc(o.paymentMethod || '-')}</b></div><div class="kv" style="margin:0"><span>Status</span><b style="color:${color}">${label}</b></div>${payAct}</div></div>
    ${['Processing', 'Confirmed'].includes(st) ? '<button class="btn d" onclick="cancelWA()"><i class="fa-solid fa-ban"></i>Request cancellation</button>' : ''}`;
  $('#dv').classList.add('on');
};
const closeDv = () => $('#dv').classList.remove('on');

const wa = msg => window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, '_blank');
const supportWA = () => wa(`Hi Aavira Support,\n\nI need help with my order *${oid(S.cur)}*.`);
const cancelWA = () => wa(`Hi Aavira Support,\n\nPlease cancel my order *${oid(S.cur)}*.`);
const payWA = () => wa(`Hi Aavira Support,\n\nI want to pay for order *${oid(S.cur)}*.\n*Total: ${money(S.cur.totalAmount || S.cur.total)}*\nPlease share the UPI ID / QR code.`);
const copyId = async () => {
  try { await navigator.clipboard.writeText(String(S.cur.orderId || S.cur.id)); toast('Order ID copied'); } catch { toast('ID: ' + (S.cur.orderId || S.cur.id)); }
};
const openInv = () => {
  const o = S.cur, d = pdate(o.createdAt);
  $('#invBody').innerHTML = `<div style="text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px"><img src="${LOGO}" alt="Aavira Fashion" ${logoErr} style="height:44px;max-width:60%;object-fit:contain"><p class="meta">Order receipt</p></div>
    <div class="kv"><span>Order ID</span><b style="color:var(--ink)">${esc(oid(o))}</b></div><div class="kv"><span>Date</span><span>${d ? fd(d) : '-'}</span></div><div class="kv"><span>Customer</span><span>${esc(o.customerName || '-')}</span></div>
    <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:10px">${(o.items || []).map(i => `<div class="kv" style="margin-bottom:6px"><span>${esc(i.name)} (x${i.qty || 1})</span><b style="color:var(--ink)">${money(Number(i.price || 0) * (i.qty || 1))}</b></div>`).join('')}</div>
    <div class="kv" style="margin:0;font-weight:700;color:var(--ink)"><span>Total</span><span>${money(o.totalAmount || o.total)}</span></div>`;
  $('#inv').classList.add('on');
};
const closeInv = () => $('#inv').classList.remove('on');

document.querySelectorAll('[data-logo]').forEach(img => { img.src = LOGO; img.addEventListener('error', function h() { if (!this.dataset.r) { this.dataset.r = 1; this.src = LOGO2; } else { this.style.display = 'none'; } }); });
drawTabs();
fetchOrders();
</script>
</body>
</html>
