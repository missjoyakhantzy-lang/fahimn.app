<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Orders - Aavira Fashion</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{color-scheme:light;--rani:#D81B60;--gold:#C9A227;--gold-soft:#E7D39A;--ivory:#FDFBF7;--cream:#F7F1E8;--ink:#242024;--muted:#6B6369;--line:#E7E0D9;--blush:#F9E8EE;--plum:#1B1719;--plum2:#3A1226;--green:#15803D;--danger:#B91C1C;--amber:#B45309;--ease:cubic-bezier(.2,.8,.2,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--ivory);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--rani);outline-offset:2px}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--ivory);position:relative;overflow:hidden}
@media(min-width:640px){body{background:#EFE8DE}.app{box-shadow:0 0 60px rgba(36,32,36,.12)}}
.hdr{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:62px;padding:env(safe-area-inset-top,0) 6px 0;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:5}
.hdr h1{font-family:"Playfair Display",serif;font-size:18px;text-align:center}
.ib{width:42px;height:42px;border:0;background:none;border-radius:50%;color:var(--rani);font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.ib.back{width:46px;height:46px;background:var(--rani);color:#fff;font-size:17px;box-shadow:0 6px 14px rgba(216,27,96,.3)}
.ib.back:hover,.ib.back:active{background:#B71550;color:#fff}
.ib:hover,.ib:active{background:var(--blush);color:var(--rani)}
.brand{display:flex;align-items:center;justify-content:center;min-width:0}
.brand img{height:40px;max-width:170px;object-fit:contain;display:block;border:0;background:none;border-radius:0}
.brand .wm{font-family:"Playfair Display",serif;font-size:22px;font-weight:700}
.brand .wm em{font-style:normal;color:var(--rani)}
/* search on top */
.searchbar{padding:12px 16px 4px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.search{position:relative;margin-bottom:10px}
.search>i.s{position:absolute;left:16px;top:16px;font-size:13px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:16px;padding:0 44px 0 42px;font:inherit;font-size:16px;outline:none;background:var(--ivory);transition:.2s;-webkit-appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--rani);background:#fff;box-shadow:0 0 0 4px rgba(216,27,96,.09)}
.search .clr{position:absolute;right:8px;top:8px;width:32px;height:32px;border:0;border-radius:50%;background:var(--cream);color:var(--muted);font-size:12px}
.head{padding:16px 16px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex:0 0 auto}
.head h2{font-family:"Playfair Display",serif;font-size:26px;font-weight:600;line-height:1.1}
.head p{font-size:12.5px;color:var(--muted);margin-top:4px}
.sort{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap}
.sort i{color:var(--rani);font-size:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 16px 12px;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;color:#000;display:flex;align-items:center;gap:7px;transition:.2s}
.tab small{font-size:10.5px;font-weight:700;background:var(--cream);color:#000;border-radius:999px;padding:1px 7px}
.tab.on{background:var(--rani);border-color:var(--rani);color:#fff;box-shadow:0 6px 14px rgba(216,27,96,.25)}
.tab.on small{background:rgba(255,255,255,.18);color:#fff}
.scroll{flex:1;overflow-y:auto;padding:2px 16px calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.rc{font-size:12px;color:var(--muted);font-weight:600;margin:0 2px 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(36,32,36,.045)}
.oc{cursor:pointer;animation:rise .4s var(--ease) backwards;transition:transform .2s,box-shadow .2s}
.oc:hover{box-shadow:0 12px 28px rgba(36,32,36,.09)}
.oc:active{transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.oc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.lbl{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.oid{font-size:15.5px;font-weight:700}
.oc-body{display:flex;gap:14px}
.thumb{position:relative;flex:0 0 auto}
.thumb img,.thumb .ph{width:100px;height:126px}
.thumb .cnt{position:absolute;right:-6px;bottom:-6px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 8px;border:2px solid #fff}
.thumb img,.it img,.ph{border-radius:14px;object-fit:cover;background:var(--cream);border:1px solid var(--line);display:block}
.ph{display:flex;align-items:center;justify-content:center;color:#CBBFC6;font-size:26px}
.oc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nm{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--muted)}
.price{margin-top:auto;font-size:19px;font-weight:700}
.badge{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-Processing{background:#EFF6FF;color:#1D4ED8}.b-Confirmed{background:var(--blush);color:var(--rani)}.b-Shipped{background:#FEF3C7;color:var(--amber)}
.b-OutforDelivery{background:#FFF1F2;color:#E11D48}.b-Delivered{background:#ECFDF5;color:var(--green)}.b-Cancelled{background:#F3F4F6;color:#6B7280}
.mt{margin:16px 6px 0}
.mt-line{position:relative;height:4px;border-radius:4px;background:var(--line)}
.mt-line>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--rani))}
.mt-line>b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line);transform:translate(-50%,-50%)}
.mt-line>b.on{border-color:var(--rani);background:var(--rani)}
.mt-lbl{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;color:var(--muted)}
.mt-lbl strong{font-size:11.5px;color:var(--ink)}
.mt.bad .mt-line>i{background:#D1D5DB}
.mt.bad span{font-size:11.5px;font-weight:600;color:#6B7280}
.oc-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.oc-bot i{margin-right:6px}
.go{color:var(--rani);font-weight:700}
.go i{margin:0 0 0 6px;font-size:11px}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ico{width:84px;height:84px;border-radius:50%;background:var(--blush);color:var(--rani);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px}
.empty h3{font-family:"Playfair Display",serif;font-size:21px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.55}
.empty a{display:inline-block;margin-top:20px;padding:13px 28px;border-radius:999px;background:var(--rani);color:#fff;font-size:13px;font-weight:700;text-decoration:none;box-shadow:0 8px 18px rgba(216,27,96,.25)}
.skel{height:240px;border-radius:20px;background:linear-gradient(90deg,#F1EBE3 25%,#FAF6F0 37%,#F1EBE3 63%);background-size:400% 100%;animation:sh 1.4s infinite;margin-bottom:14px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
/* footer logo = black */
.foot{margin-top:6px;text-align:center;padding:26px 16px 10px;border-top:1px solid var(--line)}
.foot .brand img{height:54px;max-width:210px;filter:brightness(0)}
.foot .brand .wm{font-size:26px;color:#000}
.foot .ty{font-family:"Playfair Display",serif;font-size:20px;font-weight:600;margin-top:16px;color:var(--ink)}
.foot .ty::after{content:"";display:block;width:36px;height:2px;border-radius:2px;background:var(--rani);margin:10px auto 0}
.foot p{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
.foot .links{display:flex;justify-content:center;gap:18px;margin-top:12px}
.foot .links a,.foot .links button{background:none;border:0;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none}
.foot .copy{font-size:11px;margin-top:14px;color:#9A9298}
.dv{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;background:var(--ivory);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .38s var(--ease),visibility 0s .38s}
.dv.on{transform:none;visibility:visible;transition-delay:0s}
.dv-body{flex:1;overflow-y:auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.h3{font-family:"Playfair Display",serif;font-size:17px;font-weight:600;margin-bottom:14px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 22px;margin-bottom:14px;color:#fff;background:linear-gradient(120deg,#1B1719,#3A1226,#7A1546,#3A1226,#1B1719);background-size:300% 300%;animation:bgMove 9s ease-in-out infinite;box-shadow:0 14px 34px rgba(27,23,25,.28)}
@keyframes bgMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,60px) scale(1.2)}}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(216,27,96,.38),rgba(216,27,96,0) 70%);animation:orb 8s ease-in-out infinite}
.hero.ok{background:linear-gradient(120deg,#0F2A1B,#14532D,#16803D,#14532D,#0F2A1B);background-size:300% 300%}
.hero.ok::before{background:radial-gradient(circle,rgba(34,197,94,.35),rgba(34,197,94,0) 70%)}
.hero.no{background:linear-gradient(120deg,#2B2B2F,#45454B,#5A5A62,#45454B,#2B2B2F);background-size:300% 300%}
.hero.no::before{background:none}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero .lbl{color:rgba(255,255,255,.62)}
.hero .oid{color:#fff;font-size:14px}
.idrow{display:flex;align-items:center;gap:8px}
.idcp{width:26px;height:26px;border:0;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.idcp:active{background:rgba(255,255,255,.3)}
.pill-live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px}
.pill-live i{width:7px;height:7px;border-radius:50%;background:#4ADE80;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hero h3{position:relative;font-family:"Playfair Display",serif;font-size:27px;font-weight:600;margin:16px 0 4px;line-height:1.15}
.hero .sub{position:relative;font-size:13px;color:rgba(255,255,255,.78);line-height:1.5}
.hero .placed{position:relative;font-size:11.5px;color:rgba(255,255,255,.55);margin-top:16px}
.hero .eta-pill{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 14px;font-size:12.5px}
.hero .eta-pill i{color:var(--gold-soft)}
.sp{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin-top:24px}
.sp-track{position:absolute;left:10%;right:10%;top:15px;height:3px;border-radius:3px;background:rgba(255,255,255,.18)}
.sp-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,var(--gold),#F472B6);transition:width 1.1s var(--ease) .15s}
.sp-s{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.sp-c{width:32px;height:32px;border-radius:50%;background:#3A2A33;border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);font-size:12px;display:flex;align-items:center;justify-content:center}
.sp-s.done .sp-c{background:var(--rani);border-color:var(--rani);color:#fff}
.sp-s.cur .sp-c{background:#fff;border-color:#fff;color:var(--rani);animation:glow 2s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hero.ok .sp-s.done .sp-c,.hero.ok .sp-s.cur .sp-c{background:#22C55E;border-color:#22C55E;color:#fff;animation:none}
.sp-l{font-size:10px;line-height:1.3;color:rgba(255,255,255,.55);max-width:62px}
.sp-s.done .sp-l,.sp-s.cur .sp-l{color:#fff;font-weight:600}
.cour{display:flex;align-items:center;gap:14px}
.cour-ic{width:46px;height:46px;border-radius:14px;background:var(--blush);color:var(--rani);display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.cour b{font-size:14px;display:block}.cour small{font-size:12px;color:var(--muted)}
.cour .cp{margin-left:auto;background:var(--cream);border:0;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink)}
/* your order: big images */
.it{display:flex;gap:16px;padding:16px 0;border-bottom:1px dashed var(--line)}
.it:first-of-type{padding-top:0}.it:last-child{border:0;padding-bottom:0}
.it img,.it .ph{width:136px;height:172px;flex:0 0 auto;border-radius:16px}
.it-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.it h4{font-size:15px;line-height:1.35}.it small{font-size:12.5px;color:var(--muted)}
.it .ip{margin-top:auto;font-size:18px;font-weight:700;color:var(--rani)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.kv.save{color:var(--green);font-weight:600}
.kv.tot{margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:16px;font-weight:700;color:var(--ink)}
.addr b{font-size:14px}.addr p{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px}
.addr .cpy{margin-top:12px;background:var(--cream);border:0;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink)}
.pay{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.btn{width:100%;padding:14px;border-radius:999px;border:0;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--rani);color:#fff;box-shadow:0 8px 18px rgba(216,27,96,.25)}
.btn.k{background:var(--ink);color:#fff}
.btn.l{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.d{background:#fff;border:1.5px solid #FECACA;color:var(--danger)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 4px;font-size:11px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:7px}
.qa button:active{transform:scale(.97)}
.qa i{font-size:16px;color:var(--rani)}
.mo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(36,32,36,.55);display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex}
.sheet{width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .3s ease}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inv{border:1px dashed var(--line);border-radius:16px;padding:16px;margin:14px 0;font-size:12.5px}
.inv .brand img{height:48px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);opacity:0;background:linear-gradient(135deg,var(--rani),#B71550);color:#fff;font-size:14.5px;font-weight:600;line-height:1.4;text-align:center;padding:13px 26px;border-radius:999px;box-shadow:0 10px 26px rgba(216,27,96,.35);z-index:100;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88%}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* action-button loading spinner */
.is-busy{position:relative;pointer-events:none;color:transparent!important}
.is-busy>*{opacity:0}
.is-busy::after{content:"";box-sizing:border-box;position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid var(--spin,var(--rani));border-top-color:transparent;border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.p,.btn.k,.idcp,.ib.back{--spin:#fff}
.btn.d{--spin:var(--danger)}
.idcp.is-busy::after{width:12px;height:12px;margin:-6px 0 0 -6px}
.foot .links a{display:inline-block}
@media (prefers-reduced-motion:reduce){.is-busy::after{animation-duration:.8s!important;animation-iteration-count:infinite!important}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{.app>*:not(.mo){display:none!important}.mo{position:static;background:none;display:block}.sheet{max-height:none}.sheet button{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <button class="ib back" onclick="location.href='/'" aria-label="Back to home"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="brand" data-brand></div>
    <button class="ib" id="refBtn" onclick="refresh()" aria-label="Refresh orders"><i class="fa-solid fa-rotate-right"></i></button>
  </header>
  <div class="searchbar">
    <div class="search"><i class="fa-solid fa-magnifying-glass s"></i><input id="q" type="search" placeholder="Search by order ID or product name" autocomplete="off" aria-label="Search orders" oninput="onSearch()"><button class="clr" id="clr" hidden onclick="clearQ()" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button></div>
  </div>
  <div class="head">
    <div><h2>My Orders</h2><p id="sub">Track all your orders here</p></div>
    <button class="sort" id="sortBtn" onclick="toggleSort()" aria-label="Change sort order"><i class="fa-solid fa-arrow-down-wide-short"></i><span id="sortTx">Newest</span></button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="scroll" id="list"></div>

  <section class="dv" id="dv" aria-label="Order details">
    <header class="hdr"><button class="ib back" onclick="history.back()" aria-label="Back to orders"><i class="fa-solid fa-arrow-left"></i></button><h1>Track order</h1><button class="ib" id="refBtn2" onclick="refresh()" aria-label="Refresh"><i class="fa-solid fa-rotate-right"></i></button></header>
    <div class="dv-body" id="dvBody"></div>
  </section>
  <div class="mo" id="inv" onclick="if(event.target===this)closeInv()">
    <div class="sheet">
      <div class="row"><h3 class="h3" style="margin:0">Order invoice</h3><button class="ib" onclick="closeInv()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="inv" id="invBody"></div>
      <button class="btn p" onclick="window.print()"><i class="fa-solid fa-print"></i>Print / Save as PDF</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="user_data.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const BACKEND = 'https://server-js-psi-five.vercel.app';
const WA = '919608720622';
const REFRESH_MS = 60000;
const LOGO_FILE = 'file_0000000015bc82119a5830b82bcd3a20.png';
const LOGOS = [`/public/${LOGO_FILE}`, `public/${LOGO_FILE}`, `/${LOGO_FILE}`, LOGO_FILE];
const brandHtml = () => `<img src="${LOGOS[0]}" alt="Aavira Fashion" data-i="0" onerror="logoErr(this)"><span class="wm" hidden>Aavira <em>Fashion</em></span>`;
window.logoErr = img => {
  const i = Number(img.dataset.i || 0) + 1;
  if (i < LOGOS.length) { img.dataset.i = i; img.src = LOGOS[i]; }
  else { img.hidden = true; const w = img.nextElementSibling; if (w) w.hidden = false; }
};
window.phErr = img => { img.outerHTML = '<div class="ph"><i class="fa-solid fa-shirt"></i></div>'; };

const STEPS = ['Processing', 'Confirmed', 'Shipped', 'Out for Delivery', 'Delivered'];
const STEP_LABEL = ['Placed', 'Confirmed', 'Shipped', 'Out for delivery', 'Delivered'];
const ICONS = ['fa-box', 'fa-circle-check', 'fa-truck', 'fa-truck-fast', 'fa-house-circle-check'];
const TABS = ['All', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];
const S = { orders: [], tab: 'All', cur: null, synced: 0, sort: 'new' };

const norm = raw => {
  const s = String(raw || '').toLowerCase();
  if (s.includes('cancel')) return 'Cancelled';
  if (s.includes('out for') || s.includes('outfor')) return 'Out for Delivery';
  if (s.includes('deliver')) return 'Delivered';
  if (s.includes('ship')) return 'Shipped';
  if (s.includes('confirm')) return 'Confirmed';
  return 'Processing';
};
const cid = s => String(s || '').replace(/[^a-z0-9]/gi, '').toUpperCase();
const pdate = v => {
  if (!v) return null;
  if (typeof v === 'object') v = v._seconds ? v._seconds * 1000 : v.seconds ? v.seconds * 1000 : v;
  const d = new Date(v);
  return isNaN(d) ? null : d;
};
const fd = d => d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
const fdt = d => d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
const colorTxt = c => { const v = c || 'Standard'; return /^https?:|data:image|\//.test(v) ? 'As shown' : v; };
const rawId = o => String(o.orderId || o.id || o._id || '');
const oid = o => { const v = rawId(o); return v.startsWith('#') ? v : '#' + v; };
const imgTag = src => src
  ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="phErr(this)">`
  : `<div class="ph"><i class="fa-solid fa-shirt"></i></div>`;

let toastT;
const toast = m => {
  const t = $('#toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
};

/* admin-controlled delivery info */
const etaRaw = o => o.expectedDelivery || o.estimatedDelivery || o.deliveryEta;
const etaText = o => {
  if (o.deliveryNote) return esc(o.deliveryNote);
  const v = etaRaw(o);
  if (!v) return '';
  const d = pdate(v);
  return d ? 'By ' + fd(d) : esc(v);
};
const etaCountdown = o => {
  const d = pdate(etaRaw(o));
  if (!d) return '';
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const d0 = new Date(d); d0.setHours(0, 0, 0, 0);
  const n = Math.round((d0 - t0) / 86400000);
  if (n === 0) return 'Arriving today';
  if (n === 1) return 'Arriving tomorrow';
  if (n > 1) return `Arriving in ${n} days`;
  return 'Slightly delayed';
};
const stepTime = (o, step) => {
  const h = o.statusHistory || o.trackingHistory || o.timeline;
  const e = Array.isArray(h) ? h.find(x => norm(x.status || x.title) === step) : null;
  const d = e && pdate(e.time || e.at || e.date || e.createdAt);
  return d ? fdt(d) : '';
};
const courier = o => ({
  name: o.courierName || o.courier || o.shippingPartner || '',
  id: o.trackingId || o.trackingNumber || o.awb || o.awbNumber || '',
  url: (u => { try { const x = new URL(String(u || ''), location.origin); return /^https?:$/.test(x.protocol) && u ? x.href : ''; } catch { return ''; } })(o.trackingUrl || o.trackingLink)
});

/* session + fetch */
const session = () => {
  const email = (localStorage.getItem('aavira_user_email') || '').trim().toLowerCase();
  const name = (localStorage.getItem('aavira_display_name') || '').trim();
  return email && name && name.toLowerCase() !== 'guest user' ? email : '';
};
window.aaviraSessionExpired = () => {
  $('#list').innerHTML = `<div class="empty"><div class="ico"><i class="fa-solid fa-lock"></i></div><h3>Session expired</h3><p>Please log in again to view your orders.</p><a href="login.html">Go to Login</a></div>`;
  toast('Session expired. Please log in again.', 'err');
  try { if (typeof window.clearAaviraSession === 'function') window.clearAaviraSession(); } catch (e) {}
  setTimeout(() => {
    ['authToken', 'aavira_token', 'aavira_user_email', 'aavira_display_name'].forEach(k => localStorage.removeItem(k));
    window.location.href = 'login.html';
  }, 2500);
};

let loading = false;
const fetchOrders = async (silent = false) => {
  if (loading) return;
  loading = true;
  const email = session();
  const guestId = new URLSearchParams(location.search).get('id') || '';
  if (!silent) $('#list').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  if (!email && !guestId) {
    S.orders = [];
    $('#sub').textContent = 'Login to see all your orders';
    loading = false;
    return draw();
  }
  try {
    const url = `${BACKEND}/api/orders?nocache=${Date.now()}&` + (email ? `email=${encodeURIComponent(email)}` : `orderId=${encodeURIComponent(guestId)}`);
    const headers = { 'Content-Type': 'application/json' };
    const authToken = localStorage.getItem('authToken') || localStorage.getItem('aavira_token');
    const orderToken = localStorage.getItem('aavira_order_token_' + guestId);
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    if (guestId && orderToken) headers['X-Order-Token'] = orderToken;
    const res = await fetch(url, { headers });
    if (res.status === 401 || res.status === 403) { loading = false; window.aaviraSessionExpired(); return; }
    const json = await res.json();
    let rows = res.ok && json.status === 'success' && Array.isArray(json.data) ? json.data : [];
    rows = email
      ? rows.filter(o => String(o.email || o.customerEmail || o.userEmail || '').trim().toLowerCase() === email)
      : rows.filter(o => cid(rawId(o)) === cid(guestId)).slice(0, 1);
    S.orders = rows;
    $('#sub').textContent = email ? `Signed in as ${email}` : 'Tracking your order';
    S.synced = Date.now();
  } catch (e) {
    if (!silent) S.orders = [];
    toast('Could not load orders. Check your connection.', 'err');
  }
  loading = false;
  drawTabs(); draw();
  if ($('#dv').classList.contains('on') && S.cur) {
    const fresh = S.orders.find(x => cid(rawId(x)) === cid(rawId(S.cur)));
    if (fresh) renderDv(fresh, true);
  }
};
const refresh = async () => {
  const icons = document.querySelectorAll('#refBtn i, #refBtn2 i');
  icons.forEach(i => i.classList.add('fa-spin'));
  await fetchOrders(true);
  icons.forEach(i => i.classList.remove('fa-spin'));
  toast('Orders refreshed');
};
setInterval(() => { if (!document.hidden && (session() || new URLSearchParams(location.search).get('id'))) fetchOrders(true); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.synced > 30000) fetchOrders(true); });

/* search / sort */
const onSearch = () => { $('#clr').hidden = !$('#q').value; draw(); };
const clearQ = () => { $('#q').value = ''; $('#clr').hidden = true; draw(); $('#q').focus(); };
const toggleSort = () => {
  S.sort = S.sort === 'new' ? 'old' : 'new';
  $('#sortTx').textContent = S.sort === 'new' ? 'Newest' : 'Oldest';
  $('#sortBtn i').className = 'fa-solid ' + (S.sort === 'new' ? 'fa-arrow-down-wide-short' : 'fa-arrow-up-short-wide');
  draw();
};

/* list */
const matchTab = (o, t) => {
  const s = norm(o.orderStatus);
  if (t === 'All') return true;
  if (t === 'Processing') return s === 'Processing' || s === 'Confirmed';
  if (t === 'Shipped') return s === 'Shipped' || s === 'Out for Delivery';
  return s === t;
};
const drawTabs = () => {
  $('#tabs').innerHTML = TABS.map(t => {
    const n = S.orders.filter(o => matchTab(o, t)).length;
    return `<button class="tab ${t === S.tab ? 'on' : ''}" role="tab" aria-selected="${t === S.tab}" data-tab="${t}">${t}${S.orders.length ? `<small>${n}</small>` : ''}</button>`;
  }).join('');
};
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; drawTabs(); draw(); } });

const footer = () => `<div class="foot"><div class="brand">${brandHtml()}</div>
  <h4 class="ty">Thank you for shopping with us</h4>
  <p>Luxury ethnic fashion,<br>designed for modern elegance.</p>
  <div class="links"><button onclick="wa('Hi Aavira Support,\\n\\nI need help with my order.')">WhatsApp support</button><a href="/">Continue shopping</a></div>
  <p class="copy">&copy; ${new Date().getFullYear()} Aavira Fashion, Inc.</p></div>`;

const miniTrack = st => {
  if (st === 'Cancelled') return `<div class="mt bad"><div class="mt-line"><i style="width:100%"></i></div><div class="mt-lbl"><span>Order cancelled</span></div></div>`;
  const idx = STEPS.indexOf(st), pct = idx / (STEPS.length - 1) * 100;
  return `<div class="mt"><div class="mt-line"><i style="width:${pct}%"></i>${STEPS.map((s, i) => `<b class="${i <= idx ? 'on' : ''}" style="left:${i / (STEPS.length - 1) * 100}%"></b>`).join('')}</div>
    <div class="mt-lbl"><span>Placed</span><strong>${STEP_LABEL[idx]}</strong><span>Delivered</span></div></div>`;
};

const draw = () => {
  const q = $('#q').value.trim().toLowerCase();
  const rows = S.orders
    .filter(o => matchTab(o, S.tab) && (!q || rawId(o).toLowerCase().includes(q) || (o.items || []).some(i => String(i.name || '').toLowerCase().includes(q))))
    .sort((a, b) => ((pdate(b.createdAt) || 0) - (pdate(a.createdAt) || 0)) * (S.sort === 'new' ? 1 : -1));
  if (!rows.length) {
    $('#list').innerHTML = `<div class="empty"><div class="ico"><i class="fa-solid fa-${q ? 'magnifying-glass' : 'box-open'}"></i></div><h3>${q ? 'No matching orders' : 'No orders found'}</h3><p>${q ? 'Try a different order ID or product name.' : S.orders.length ? 'Nothing here for this filter.' : 'Your orders will appear here.'}</p>${q ? '<a href="#" onclick="clearQ();return false">Clear search</a>' : '<a href="/">Start shopping</a>'}</div>` + footer();
    return;
  }
  $('#list').innerHTML = `<div class="rc">${rows.length} order${rows.length > 1 ? 's' : ''}${q ? ' found' : ''}</div>` + rows.map((o, i) => {
    const st = norm(o.orderStatus), items = o.items || [], first = items[0] || {};
    const d = pdate(o.createdAt), eta = etaText(o), cd = etaCountdown(o);
    let bot = eta ? `<span><i class="fa-solid fa-truck"></i>${cd || eta}</span>` : `<span><i class="fa-regular fa-clock"></i>Delivery update soon</span>`;
    if (st === 'Delivered') bot = '<span style="color:var(--green)"><i class="fa-solid fa-circle-check"></i>Delivered</span>';
    if (st === 'Cancelled') bot = '<span><i class="fa-solid fa-circle-xmark"></i>Cancelled</span>';
    if (st === 'Out for Delivery') bot = `<span style="color:#E11D48"><i class="fa-solid fa-truck-fast"></i>${cd || eta || 'Out for delivery'}</span>`;
    return `<article class="card oc" style="animation-delay:${Math.min(i * .06, .3)}s" data-id="${esc(rawId(o))}" tabindex="0" role="button" aria-label="Track order ${esc(oid(o))}">
      <div class="oc-head"><div><div class="lbl">Order</div><div class="oid">${esc(oid(o))}</div></div><span class="badge b-${st.replace(/ /g, '')}">${st}</span></div>
      <div class="oc-body">
        <div class="thumb">${imgTag(first.image)}${items.length > 1 ? `<span class="cnt">+${items.length - 1}</span>` : ''}</div>
        <div class="oc-info"><div class="nm">${esc(first.name || 'Your order')}</div>
          <div class="meta">${d ? fd(d) : ''} &bull; ${items.length || 1} item${items.length > 1 ? 's' : ''}</div>
          <div class="price">${money(o.totalAmount || o.total)}</div></div>
      </div>
      ${miniTrack(st)}
      <div class="oc-bot">${bot}<span class="go">Track order<i class="fa-solid fa-arrow-right"></i></span></div></article>`;
  }).join('') + footer();
};
$('#list').addEventListener('click', e => { const c = e.target.closest('.oc'); if (c) openDv(c.dataset.id); });
$('#list').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const c = e.target.closest('.oc'); if (c) { e.preventDefault(); openDv(c.dataset.id); } } });

/* detail */
const HERO = {
  'Processing': ['Order received', "We've received your order and are getting it ready."],
  'Confirmed': ['Order confirmed', 'Your order is confirmed and being prepared.'],
  'Shipped': ['On its way', 'Your order has been shipped.'],
  'Out for Delivery': ['Out for delivery', 'Your order is with the delivery partner.'],
  'Delivered': ['Delivered', 'Your order has been delivered. We hope you love it.'],
  'Cancelled': ['Order cancelled', 'This order has been cancelled.']
};
const stepper = st => {
  if (st === 'Cancelled') return '';
  const idx = STEPS.indexOf(st), pct = idx / (STEPS.length - 1) * 100;
  return `<div class="sp"><div class="sp-track"><div class="sp-fill" data-w="${pct}"></div></div>${STEPS.map((s, i) => {
    const cls = i < idx || (st === 'Delivered' && i === idx) ? 'done' : i === idx ? 'cur' : '';
    return `<div class="sp-s ${cls}"><div class="sp-c"><i class="fa-solid ${cls === 'done' ? 'fa-check' : ICONS[i]}"></i></div><span class="sp-l">${STEP_LABEL[i]}</span></div>`;
  }).join('')}</div>`;
};

const renderDv = (o, keepScroll) => {
  S.cur = o;
  const body = $('#dvBody'), top = body.scrollTop;
  const st = norm(o.orderStatus), items = o.items || [], d = pdate(o.createdAt), eta = etaText(o), cd = etaCountdown(o);
  const total = Number(o.totalAmount || o.total || 0);
  const live = st === 'Shipped' || st === 'Out for Delivery';
  const hero = HERO[st];
  const heroCls = st === 'Delivered' ? 'ok' : st === 'Cancelled' ? 'no' : '';
  let etaPill = '';
  if (st !== 'Delivered' && st !== 'Cancelled') etaPill = `<div class="eta-pill"><i class="fa-solid fa-calendar-check"></i><span>${eta ? `Expected <b>${eta}</b>${cd ? ` · ${cd}` : ''}` : 'Delivery date will be updated soon'}</span></div>`;
  if (st === 'Delivered') { const t = stepTime(o, 'Delivered'); if (t) etaPill = `<div class="eta-pill"><i class="fa-solid fa-circle-check"></i><span>Delivered on <b>${t}</b></span></div>`; }
  const heroHtml = `<div class="hero ${heroCls}">
    <div class="hero-top"><div><div class="lbl">Order</div><div class="oid idrow">${esc(oid(o))}<button class="idcp" onclick="copyTxt(rawId(S.cur),'Order ID copied')" aria-label="Copy order ID"><i class="fa-regular fa-copy"></i></button></div></div>${live ? '<span class="pill-live"><i></i>On the way</span>' : `<span class="badge b-${st.replace(/ /g, '')}" style="background:rgba(255,255,255,.14);color:#fff">${st}</span>`}</div>
    <h3>${hero[0]}</h3><p class="sub">${hero[1]}</p>${etaPill}${stepper(st)}<p class="placed">Placed on ${d ? fdt(d) : '-'}</p></div>`;

  const c = courier(o);
  const courierHtml = (c.name || c.id || c.url) ? `<div class="card"><h3 class="h3">Delivery partner</h3><div class="cour"><div class="cour-ic"><i class="fa-solid fa-truck-fast"></i></div>
    <div><b>${esc(c.name || 'Courier partner')}</b><small>${c.id ? 'Tracking ID: ' + esc(c.id) : 'Tracking ID will be shared soon'}</small></div>${c.id ? `<button class="cp" data-copy="${esc(c.id)}" onclick="copyTxt(this.dataset.copy,'Tracking ID copied')">Copy</button>` : ''}</div>
    ${c.url ? `<button class="btn k" data-url="${esc(c.url)}" onclick="window.open(this.dataset.url,'_blank','noopener')"><i class="fa-solid fa-location-crosshairs"></i>Track on courier site</button>` : ''}</div>` : '';

  const sub = Number(o.subtotal || 0), ship = o.deliveryFee ?? o.shippingFee, gift = Number(o.giftWrapFee || 0), disc = Number(o.promoDiscount || 0);
  const bill = (sub ? `<div class="kv"><span>Items subtotal</span><span>${money(sub)}</span></div>` : '')
    + (ship != null ? `<div class="kv"><span>Shipping</span><span>${Number(ship) ? money(ship) : 'Free'}</span></div>` : '')
    + (gift ? `<div class="kv"><span>Gift wrap</span><span>${money(gift)}</span></div>` : '')
    + (disc ? `<div class="kv save"><span>Coupon${o.promoCodeUsed ? ' (' + esc(o.promoCodeUsed) + ')' : ''}</span><span>- ${money(disc)}</span></div>` : '')
    + `<div class="kv tot"><span>Total amount</span><span>${money(total)}</span></div>`;

  const pm = String(o.paymentMethod || '').toLowerCase(), ps = String(o.paymentStatus || '').toLowerCase();
  const paid = ps === 'paid' || ps === 'success', failed = ps === 'failed' || ps === 'error';
  const label = paid ? 'Payment received' : failed ? 'Payment failed' : pm === 'cod' ? 'Pay on delivery' : 'Payment pending';
  const color = paid ? 'var(--green)' : failed ? 'var(--danger)' : 'var(--amber)';
  let payAct = '';
  if (!paid && st !== 'Cancelled') payAct = `<button class="btn p" onclick="payWA()"><i class="fa-brands fa-whatsapp"></i>${pm === 'cod' ? 'Pay online instead' : 'Complete payment'} ${money(total)}</button>`;

  const addrFull = `${o.customerName || o.name || ''}, ${o.address || ''}, ${o.phone || o.customerPhone || ''}`;
  body.innerHTML = `
    ${heroHtml}
    <div class="qa"><button onclick="openInv()"><i class="fa-solid fa-file-invoice"></i>Invoice</button><button onclick="supportWA()"><i class="fa-brands fa-whatsapp" style="color:#25D366"></i>Support</button><button onclick="shareOrder()"><i class="fa-solid fa-share-nodes"></i>Share</button></div>
    ${courierHtml}
    <div class="card"><h3 class="h3">Your order</h3>${(items.length ? items : [{ name: 'Item', qty: 1, price: total }]).map(i => `<div class="it">${imgTag(i.image)}<div class="it-info"><h4>${esc(i.name || 'Item')}</h4><small>Size: ${esc(i.size || 'Free Size')}</small><small>Color: ${esc(colorTxt(i.color))}</small><small>Qty: ${i.qty || 1}</small><div class="ip">${money(Number(i.price || 0) * (i.qty || 1))}</div></div></div>`).join('')}</div>
    <div class="card addr"><h3 class="h3">Delivery address</h3><b>${esc(o.customerName || o.name || 'Customer')}</b><p>${esc(o.address || 'Address not provided')}</p><p><i class="fa-solid fa-phone" style="font-size:10px"></i> ${esc(o.phone || o.customerPhone || '-')}</p><button class="cpy" data-copy="${esc(addrFull)}" onclick="copyTxt(this.dataset.copy,'Address copied')"><i class="fa-regular fa-copy"></i> Copy address</button></div>
    <div class="card"><h3 class="h3">Payment summary</h3>${bill}
      <div class="pay"><div class="kv"><span>Method</span><b style="color:var(--ink);text-transform:uppercase">${esc(o.paymentMethod || '-')}</b></div><div class="kv" style="margin:0"><span>Status</span><b style="color:${color}">${label}</b></div>${payAct}</div></div>
    ${st === 'Delivered' ? '<button class="btn p" onclick="buyAgain()"><i class="fa-solid fa-rotate-right"></i>Order again</button>' : ''}
    ${['Processing', 'Confirmed'].includes(st) ? '<button class="btn d" onclick="cancelWA()"><i class="fa-solid fa-ban"></i>Request cancellation</button>' : ''}
    <button class="btn l" onclick="supportWA()"><i class="fa-brands fa-whatsapp" style="color:#25D366"></i>Need help with this order?</button>
    ${footer()}`;
  if (keepScroll) body.scrollTop = top;
  requestAnimationFrame(() => requestAnimationFrame(() => { const f = body.querySelector('.sp-fill'); if (f) f.style.width = f.dataset.w + '%'; }));
};

const openDv = id => {
  const o = S.orders.find(x => cid(rawId(x)) === cid(id));
  if (!o) return;
  renderDv(o);
  $('#dvBody').scrollTop = 0;
  if (!$('#dv').classList.contains('on')) { $('#dv').classList.add('on'); history.pushState({ dv: 1 }, ''); }
};
const closeDv = () => $('#dv').classList.remove('on');
window.addEventListener('popstate', () => { closeDv(); closeInv(); });

/* actions */
window.wa = msg => window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
const supportWA = () => wa(`Hi Aavira Support,\n\nI need help with my order *${oid(S.cur)}*.`);
const cancelWA = () => wa(`Hi Aavira Support,\n\nPlease cancel my order *${oid(S.cur)}*.`);
const payWA = () => wa(`Hi Aavira Support,\n\nI want to pay for order *${oid(S.cur)}*.\n*Total: ${money(S.cur.totalAmount || S.cur.total)}*\nPlease share the UPI ID / QR code.`);
const copyTxt = async (t, msg) => { try { await navigator.clipboard.writeText(String(t)); toast(msg); } catch { toast(String(t)); } };
const shareOrder = async () => {
  const o = S.cur, txt = `My Aavira order ${oid(o)} is ${norm(o.orderStatus)} (${money(o.totalAmount || o.total)})`;
  try { if (navigator.share) await navigator.share({ title: 'My Aavira order', text: txt }); else await copyTxt(txt, 'Order details copied'); } catch (e) {}
};
const buyAgain = () => {
  const items = (S.cur.items || []).filter(i => i.productId || i.id);
  if (!items.length) { toast('Open the product page to order again', 'err'); return; }
  let cart = []; try { cart = JSON.parse(localStorage.getItem('aavira_cart')) || []; } catch {}
  items.forEach(i => {
    const pid = String(i.productId || i.id);
    const ex = cart.find(c => String(c.productId || c.id) === pid && c.size === i.size && c.color === i.color);
    if (ex) ex.qty = Math.min(10, (Number(ex.qty) || 1) + (Number(i.qty) || 1));
    else cart.push({ cartId: `c_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, productId: pid, name: i.name, price: i.price, mrp: i.mrp || 0, image: i.image, size: i.size || 'Free Size', color: i.color || 'As Shown', qty: Number(i.qty) || 1 });
  });
  try { localStorage.setItem('aavira_cart', JSON.stringify(cart)); } catch {}
  toast('Added to your bag');
  setTimeout(() => location.href = 'cart', 700);
};
const openInv = () => {
  const o = S.cur, d = pdate(o.createdAt);

    <div class="kv"><span>Order ID</span><b style="color:var(--ink)">${esc(oid(o))}</b></div><div class="kv"><span>Date</span><span>${d ? fd(d) : '-'}</span></div><div class="kv"><span>Customer</span><span>${esc(o.customerName || '-')}</span></div>
    <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:10px">${(o.items || []).map(i => `<div class="kv" style="margin-bottom:6px"><span>${esc(i.name)} (x${i.qty || 1})</span><b style="color:var(--ink)">${money(Number(i.price || 0) * (i.qty || 1))}</b></div>`).join('')}</div>
    <div class="kv" style="margin:0;font-weight:700;color:var(--ink)"><span>Total</span><span>${money(o.totalAmount || o.total)}</span></div>`;
  $('#inv').classList.add('on');
};
const closeInv = () => $('#inv').classList.remove('on');

/* Loading spinner on every action button (0.5s).
   Buttons that open WhatsApp / share / copy run at once (the browser needs the tap itself) while the spinner shows;
   all other action buttons run after the spinner. */
const SPIN_SEL = '.ib.back,.btn,.qa button,.cpy,.cp,.idcp,.foot .links button,.foot .links a,.empty a';
const SPIN_MS = 500;
document.addEventListener('click', e => {
  const el = e.target.closest(SPIN_SEL);
  if (!el) return;
  if (el.__go) { el.__go = false; return; }
  if (el.classList.contains('is-busy')) { e.preventDefault(); e.stopImmediatePropagation(); return; }
  const oc = el.getAttribute('onclick') || '';
  const now = /supportWA|cancelWA|payWA|wa\(|window\.open|shareOrder|copyTxt/.test(oc);
  el.classList.add('is-busy');
  setTimeout(() => el.classList.remove('is-busy'), SPIN_MS);
  if (now) return;
  e.preventDefault(); e.stopImmediatePropagation();
  setTimeout(() => { el.__go = true; el.click(); }, SPIN_MS);
}, true);
window.addEventListener('pageshow', () => document.querySelectorAll('.is-busy').forEach(el => el.classList.remove('is-busy')));

document.querySelectorAll('[data-brand]').forEach(el => { el.innerHTML = brandHtml(); });
drawTabs();
fetchOrders();
</script>
