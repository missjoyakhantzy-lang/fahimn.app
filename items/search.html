<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Search - Aavira Fashion</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  color-scheme:light;
  --rani:#111113;
  --rani-dark:#000000;
  --rani-tint:#F2F2F7;
  --gold:#D4AF37;
  --gold-deep:#111113;
  --gold-text:#8A6D1D;
  --gold-soft:#F8F8FA;
  --ivory:#FFFFFF;
  --cream:#F8F8FA;
  --ink:#111113;
  --mid:#4A4F55;
  --muted:#6E6E73;
  --line:#E5E5EA;
  --blush:#F2F2F7;
  --plum:#111113;
  --plum2:#1C1C1E;
  --green:#15803D;
  --danger:#DC2626;
  --amber:#B45309;
  --ease:cubic-bezier(.22,1,.36,1);
  --ios-spring:cubic-bezier(.32,.72,0,1);
  --font-main:"Barlow Condensed","Roboto Condensed",system-ui,sans-serif;
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#FFFFFF!important}
body{
  margin:0;
  font-family:var(--font-main);
  letter-spacing:.015em;
  background:var(--ivory)!important;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  position:relative;
}
h1,h2,h3,h4{font-family:var(--font-main);letter-spacing:.01em;margin:0}
a{color:inherit;text-decoration:none}
button,select,input{font-family:inherit;letter-spacing:inherit;user-select:none}
button{cursor:pointer}
input{user-select:text}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--rani);outline-offset:2px}

.app{
  max-width:420px;
  margin:0 auto;
  background:#FFFFFF;
  display:flex;
  flex-direction:column;
  min-height:100dvh;
  position:relative;
  overflow-x:clip;
}
@media(min-width:640px){
  body{background:#F5F5F7!important}
  .app{box-shadow:0 0 50px rgba(0,0,0,.06);border-inline:1px solid #EBEBEF}
}

/* Compact & Bold Loading Spinner State */
.is-busy{position:relative;pointer-events:none;color:transparent!important}
.is-busy>*{opacity:0!important}
.is-busy::after{
  content:"";
  position:absolute;
  inset:0;
  margin:auto;
  width:14px;
  height:14px;
  border:2.2px solid var(--spin,var(--rani));
  border-top-color:transparent;
  border-radius:50%;
  animation:spin .55s linear infinite;
  z-index:5;
}
:is(.sqa-add,.cd-checkout,.p-primary).is-busy{--spin:#fff}
.go.is-busy{background:var(--rani)!important;border-color:var(--rani)!important;--spin:#fff;transform:none}
.go.is-busy::after{width:11px;height:11px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Sticky Header & Search Bar ---------- */
.top{
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
  transition:box-shadow .2s;
}
.top.scrolled{box-shadow:0 6px 20px rgba(0,0,0,.05)}
.top-row{min-height:54px;display:flex;align-items:center;gap:6px;padding:7px 10px}
.icon-btn,
.back-btn{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:50%;
  border:1px solid #EBEBEF;
  background:#F8F8FA;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:background .18s,border-color .18s,transform .15s var(--ease);
  cursor:pointer;
}
@media(hover:hover){
  .icon-btn:hover,.back-btn:hover{background:#EFEFF4;border-color:#D4D4D8}
}
.icon-btn:active,.back-btn:active{transform:scale(.92)}
.icon-btn svg,.back-btn svg{width:17.5px;height:17.5px;stroke-width:1.85}
.back-btn.is-loading{pointer-events:none}
.back-btn.is-loading svg{display:none}
.back-btn.is-loading::after{
  content:'';
  width:15px;
  height:15px;
  border-radius:50%;
  border:2px solid rgba(17,17,19,.2);
  border-top-color:var(--ink);
  animation:spin .6s linear infinite;
}
.cart-badge{
  position:absolute;
  top:-2px;
  right:-2px;
  min-width:16px;
  height:16px;
  padding:0 4px;
  border-radius:999px;
  background:#000000;
  color:#fff;
  font-size:10px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1.5px solid #fff;
}

.search-box{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  background:#F8F8FA;
  border:1px solid var(--line);
  border-radius:999px;
  padding:0 6px 0 13px;
  height:40px;
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.search-box:focus-within{
  background:#FFFFFF;
  border-color:var(--rani);
  box-shadow:0 0 0 3px rgba(17,17,19,.06);
}
.search-box>svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.search-box input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  font-family:var(--font-main);
  font-size:15px;
  font-weight:500;
  letter-spacing:.015em;
  color:var(--ink);
}
.search-box input::placeholder{color:#8E8E93;font-weight:400}
.search-box input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.search-box input[type="search"]::-ms-clear{display:none;width:0;height:0}
.clear-btn{
  border:0;
  background:#EAEAEF;
  color:var(--ink);
  display:none;
  width:26px;
  height:26px;
  border-radius:50%;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex:0 0 auto;
}
.search-box.has-text .clear-btn{display:inline-flex}
.clear-btn svg{width:12px;height:12px;stroke-width:2.2}

/* Filter Chips Row */
.filters{
  display:flex;
  gap:7px;
  align-items:center;
  overflow-x:auto;
  padding:2px 10px 9px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.dsel{
  flex:0 0 auto;
  height:33px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#FFFFFF;
  padding:0 12px;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:border-color .15s,transform .12s,background .15s;
}
.dsel.is-active{border-color:var(--rani);background:var(--blush);font-weight:700}
.dsel:active{transform:scale(.96)}
.dsel svg{width:13px;height:13px;color:var(--muted)}
.chip{
  flex:0 0 auto;
  height:33px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#FFFFFF;
  padding:0 13px;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink);
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.chip.is-on{
  background:linear-gradient(135deg,#242429,#0a0a0c);
  border-color:transparent;
  color:#FFFFFF;
  font-weight:700;
  box-shadow:0 6px 14px -4px rgba(0,0,0,.35);
}
.chip:active{transform:scale(.96)}
.chip svg{width:12.5px;height:12.5px}

/* ---------- Main Content & Sections ---------- */
main{flex:1;padding:14px 14px calc(86px + env(safe-area-inset-bottom,0px))}
.sec{margin-bottom:22px;animation:fadeUp .32s var(--ease) both}
.sec:nth-child(2){animation-delay:.04s}
.sec:nth-child(3){animation-delay:.08s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.sec-title{
  font-family:var(--font-main);
  font-size:17px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  margin:0;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--ink);
}
.sec-title svg{width:15px;height:15px;color:var(--gold-text)}
.clear-link{
  background:rgba(212,175,55,.12);
  border:1px solid rgba(212,175,55,.32);
  border-radius:999px;
  color:#8A6D1D;
  font-family:var(--font-main);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  padding:4px 11px;
}

/* Quick Access 3-Tile Row in Search Home */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:14px;
  padding:12px 6px 10px;
  cursor:pointer;
  transition:transform .15s,border-color .2s;
  position:relative;
}
@media(hover:hover){.qa:hover{border-color:#111113}}
.qa:active{transform:scale(.97);background:#FAFAFC}
.qa-ic{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#F7F7FA;
  border:1px solid #E5E5EA;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}
.qa-ic svg{width:16.5px;height:16.5px;stroke-width:1.85}
.qa span{font-size:13.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);text-align:center;line-height:1.2}
.qa .mini-badge{
  position:absolute;
  top:6px;
  right:6px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:999px;
  background:#000000;
  color:#fff;
  font-size:10px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Trending + History Chips */
.chips-row{display:flex;flex-wrap:wrap;gap:7px}
.trend-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #EBEBEF;
  background:#FFFFFF;
  border-radius:999px;
  padding:7px 13px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.02em;
  cursor:pointer;
  transition:all .15s;
  color:var(--ink);
}
@media(hover:hover){.trend-chip:hover{border-color:var(--rani);background:var(--cream)}}
.trend-chip:active{transform:scale(.96)}
.trend-chip svg{width:13.5px;height:13.5px;color:var(--gold-text)}
.hist-chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid #EBEBEF;
  background:#FFFFFF;
  border-radius:999px;
  padding:6px 6px 6px 12px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.02em;
  cursor:pointer;
  transition:all .15s;
  color:var(--ink);
  max-width:100%;
}
@media(hover:hover){.hist-chip:hover{border-color:var(--rani)}}
.hist-chip:active{transform:scale(.96)}
.hist-chip svg{width:13.5px;height:13.5px;color:var(--muted);flex:0 0 auto}
.hist-chip .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-x{
  border:0;
  background:#F2F2F7;
  color:var(--muted);
  width:22px;
  height:22px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex:0 0 auto;
}
.hist-x svg{width:11px;height:11px}
.empty-note{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  font-weight:500;
  padding:16px 12px;
  border:1px dashed var(--line);
  border-radius:14px;
  background:#FAFAFC;
}

/* ---------- Product Cards (100% Identical to aavirafashion.shop & wishlist.html) ---------- */
.res-count{
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--muted);
  margin:0 0 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.res-count b{color:var(--ink);font-weight:700}

@keyframes resultIn{to{opacity:1;transform:translateY(0)}}
.results-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:8px 6px;
  margin-inline:-6px;
}
.pcard{
  position:relative;
  min-width:0;
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:0!important;
  overflow:hidden;
  padding-bottom:9px;
  box-shadow:none!important;
  display:flex;
  flex-direction:column;
  opacity:0;
  transform:translateY(8px);
  animation:resultIn .28s var(--ease) forwards;
  animation-delay:calc(var(--i,0) * 35ms);
  transition:border-color .22s var(--ease),transform .28s var(--ease),opacity .28s ease;
}
@media(hover:hover){
  .pcard:hover{
    box-shadow:none!important;
    border-color:#111113;
  }
}
.pcard.out-stock .pcard-media img{opacity:.76}
.pcard-link{display:block;cursor:pointer}
.pcard-media{
  position:relative;
  display:block;
  width:100%;
  aspect-ratio:1/1;
  border-radius:0!important;
  background:#F4F4F6;
  overflow:hidden;
}
.pcard-media img{
  width:100%;
  height:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:0!important;
  display:block;
  transition:transform .5s var(--ease);
}
@media(hover:hover){.pcard:hover .pcard-media img{transform:scale(1.04)}}
.tags{
  position:absolute;
  left:0;
  top:8px;
  max-width:62%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  z-index:2;
  pointer-events:none;
}
.tag-best{
  background:#DEC276;
  color:#111113;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:3.5px 8px;
  border-radius:0;
  line-height:1.1;
  white-space:nowrap;
}
.tag-drop{
  background:#15803D;
  color:#FFFFFF;
  font-size:10px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  padding:3px 7px;
  border-radius:0;
  line-height:1.1;
  white-space:nowrap;
}
.tag-stock{
  position:absolute;
  right:0;
  top:8px;
  z-index:2;
  pointer-events:none;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:3.5px 8px;
  line-height:1.1;
  white-space:nowrap;
}
.tag-stock.oos{background:rgba(185,28,28,.94);color:#FFFFFF}
.tag-stock.low-stk{background:rgba(180,83,9,.94);color:#FFFFFF}
.tag-off{
  color:#2E8B57;
  background:transparent;
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  padding:0;
  border-radius:0;
  line-height:1.1;
  white-space:nowrap;
}

.pcard-foot{display:flex;flex-direction:column;padding:7px 9px 0;min-width:0;flex:1}
.pcard-text{display:block;min-width:0;cursor:pointer}
.pcard-name{
  display:block;
  font-size:14.5px;
  font-weight:500;
  letter-spacing:.01em;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#4A4F55;
}
.pcard-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px;margin-top:3px}
.price{font-size:16px;font-weight:700;letter-spacing:.01em;color:#111113}
.mrp{font-size:13px;color:#7D828A;text-decoration:line-through;font-weight:500}
.color-strip{
  display:inline-flex;
  align-items:center;
  padding:2.5px 10px 2.5px 8px;
  border-radius:999px;
  background:linear-gradient(90deg,#EFEAE1 0%,rgba(239,234,225,.78) 62%,rgba(239,234,225,.08) 100%);
  color:#3A3532;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  line-height:1;
  white-space:nowrap;
  box-shadow:-2px 3px 8px -2px rgba(0,0,0,.13),inset 1.5px 0 0 rgba(212,175,55,.65);
  -webkit-mask-image:linear-gradient(90deg,#000 72%,rgba(0,0,0,.38) 100%);
  mask-image:linear-gradient(90deg,#000 72%,rgba(0,0,0,.38) 100%);
  flex-shrink:0;
}
.pcard-row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:5px;min-width:0;width:100%}
.pcard-metalink{display:flex;align-items:center;gap:5px;min-width:0;flex:1;overflow:hidden;cursor:pointer}

.go{
  margin-left:auto;
  flex:0 0 28px;
  width:28px;
  height:28px;
  padding:0;
  border:1px solid #E5E5EA;
  border-radius:50%;
  background:#FAFAFC;
  color:#111113;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-shadow:none!important;
  cursor:pointer;
  transition:transform .2s var(--ease),background .2s,color .2s,border-color .2s;
}
@media(hover:hover){.go:hover{background:#111113;border-color:#111113;color:#fff}}
.go:active{transform:scale(.9)}
.go svg{width:14px;height:14px;stroke-width:2.2}

.rating{
  display:inline-flex;
  align-items:center;
  gap:2.5px;
  font-weight:600;
  font-size:11.5px;
  color:#fff;
  background:#15803D;
  padding:2.5px 6.5px;
  border-radius:999px;
  flex-shrink:0;
  line-height:1;
}
.rating.mid{background:#B45309}
.rating.bad{background:#B91C1C}
.rating.none{background:#9A9298}
.rating svg{width:9px;height:9px;fill:currentColor;flex-shrink:0}

.low{
  display:inline-flex;
  align-items:center;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:#B45309;
  background:rgba(180,83,9,.08);
  padding:2.5px 7px;
  border-radius:999px;
  width:fit-content;
  max-width:100%;
}
.low.out{color:#B91C1C;background:rgba(185,28,28,.08)}

/* Skeletons (Matching Sharp White Cards) */
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 6px;margin-inline:-6px}
.skel-card{
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:0;
  overflow:hidden;
  opacity:0;
  animation:resultIn .28s var(--ease) forwards;
  animation-delay:calc(var(--i,0) * 45ms);
}
.skel-media{
  aspect-ratio:1/1;
  background:linear-gradient(90deg,#F2F2F7 25%,#FAFAFC 37%,#F2F2F7 63%);
  background-size:400% 100%;
  animation:shimmer 1.3s ease infinite;
}
.skel-body{padding:9px;display:flex;flex-direction:column;gap:7px}
.skel-line{
  height:12px;
  border-radius:4px;
  background:linear-gradient(90deg,#F2F2F7 25%,#FAFAFC 37%,#F2F2F7 63%);
  background-size:400% 100%;
  animation:shimmer 1.3s ease infinite;
}

/* Empty State */
.empty{text-align:center;padding:42px 18px;color:var(--muted);background:#FFFFFF;border:1px solid #EBEBEF;border-radius:16px}
.empty .e-ic{
  width:64px;
  height:64px;
  border-radius:50%;
  background:var(--cream);
  color:var(--gold-text);
  border:1px solid var(--line);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
}
.empty .e-ic svg{width:28px;height:28px;stroke-width:1.6}
.empty b{display:block;color:var(--ink);font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-bottom:5px}
.empty p{font-size:14.5px;line-height:1.45;margin:0 auto 16px;max-width:250px}
.empty .chip{margin:0 auto}

/* ---------- Floating Cart Bar (Matching 9322.jpg Storefront Pill) ---------- */
.cart-bar{
  position:fixed;
  z-index:85;
  left:0;
  right:0;
  margin:0 auto;
  width:calc(100% - 28px);
  max-width:392px;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;
  align-items:center;
  gap:9px;
  background:linear-gradient(135deg,#1C1C1E,#0B0B0D);
  color:#FFFFFF;
  border:1.5px solid rgba(212,175,55,.65);
  border-radius:999px;
  padding:6px 7px 6px 9px;
  box-shadow:0 16px 34px -10px rgba(0,0,0,.38);
  cursor:pointer;
}
.cart-bar[hidden]{display:none!important}
.cb-imgs{display:flex;align-items:center;flex:none}
.cb-imgs img{
  width:29px;
  height:29px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #FFFFFF;
  background:#F4F4F6;
}
.cb-imgs img+img{margin-left:-9px}
.cb-count{
  flex:1;
  text-align:left;
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
  color:#FFFFFF;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:0 4px;
}
.cb-go{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  flex:none;
  height:32px;
  padding:0 14px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#111113;
  background:linear-gradient(135deg,#E5C158,#C9A227);
  border-radius:999px;
}
.cb-go svg{width:13px;height:13px;stroke-width:2.3}

/* ---------- Sort / Price Sheet & Recent History Popup (Pure White Surface) ---------- */
.scrim{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:95;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s;
}
.scrim.show{opacity:1;pointer-events:auto}
.scrim[hidden]{display:none!important}
.scrim.sheet-scrim{align-items:flex-end;padding:0}
.sheet{
  background:#FFFFFF;
  border-top:1px solid #E5E5EA;
  border-radius:24px 24px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));
  width:100%;
  max-width:420px;
  margin:0 auto;
  box-shadow:0 -20px 50px rgba(0,0,0,.18);
  transform:translateY(102%);
  transition:transform .3s var(--ease);
  max-height:78dvh;
  overflow-y:auto;
}
.scrim.show .sheet{transform:none}
.sheet-handle{width:42px;height:4px;border-radius:999px;background:#D9D9DE;margin:4px auto 12px}
.sheet h3{margin:0 0 8px;font-family:var(--font-main);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;color:var(--ink)}
.opt-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  border:0;
  background:none;
  padding:14px 4px;
  font-size:15.5px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--ink);
  cursor:pointer;
  border-bottom:1px solid #F2F2F6;
}
.opt-row:last-child{border-bottom:0}
.opt-row .radio{
  width:20px;
  height:20px;
  border-radius:50%;
  border:2px solid #C8C8D0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  transition:border-color .15s;
}
.opt-row.is-on{color:var(--rani);font-weight:700}
.opt-row.is-on .radio{border-color:var(--rani)}
.opt-row.is-on .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--rani)}

.popup{
  background:#FFFFFF;
  border:1px solid #E5E5EA;
  border-radius:22px;
  padding:22px 18px 18px;
  width:100%;
  max-width:320px;
  box-shadow:0 24px 60px rgba(0,0,0,.25);
  transform:translateY(14px) scale(.97);
  transition:transform .24s var(--ease);
  text-align:center;
}
.scrim.show .popup{transform:none}
.popup .p-ic{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#F8F8FA;
  border:1px solid #E5E5EA;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}
.popup .p-ic svg{width:20px;height:20px}
.popup h3{margin:0 0 4px;font-family:var(--font-main);font-size:20px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.popup .p-q{font-size:14.5px;font-weight:600;color:var(--muted);margin:0 0 16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-btn{
  width:100%;
  border:0;
  border-radius:999px;
  padding:11px;
  font-size:14px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  cursor:pointer;
  margin-bottom:8px;
  transition:transform .12s;
}
.p-btn:active{transform:scale(.97)}
.p-primary{background:linear-gradient(135deg,#242429,#000);color:#fff}
.p-danger{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C}
.p-ghost{background:#F8F8FA;border:1px solid #E5E5EA;color:var(--ink);margin-bottom:0}

/* ---------- Quick View Popup (#sqaOv) Matching wishlist.html ---------- */
.sqa-ov{
  position:fixed;
  inset:0;
  z-index:110;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.sqa-ov[hidden]{display:none!important}
.sqa-sheet{
  width:100%;
  max-width:420px;
  background:#FFFFFF;
  border-top:1px solid #E5E5EA;
  border-radius:26px 26px 0 0;
  padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));
  position:relative;
  max-height:92dvh;
  overflow-y:auto;
  animation:sqaUp .28s var(--ease);
  box-shadow:0 -20px 50px rgba(0,0,0,.18);
}
@keyframes sqaUp{from{transform:translateY(40px);opacity:0}}
.sqa-grab{width:42px;height:4px;border-radius:999px;background:#D9D9DE;margin:0 auto 12px}
.sqa-top{display:flex;gap:14px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sqa-media{
  position:relative;
  width:110px;
  height:110px;
  flex:0 0 110px;
  border-radius:12px;
  overflow:hidden;
  background:#F4F4F6;
  border:1px solid var(--line);
}
.sqa-media.is-switching::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(108deg,rgba(244,244,246,.85) 20%,rgba(255,255,255,.98) 42%,rgba(17,17,19,.14) 50%,rgba(255,255,255,.98) 58%,rgba(244,244,246,.85) 80%);
  background-size:220% 100%;
  animation:sqaShimmer .68s linear infinite;
  z-index:3;
}
@keyframes sqaShimmer{to{background-position:-220% 0}}
.sqa-img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;display:block;transition:opacity .2s}
.sqa-media.is-switching .sqa-img{opacity:.25}
.sqa-summary{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sqa-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sqa-name{
  font-family:var(--font-main);
  font-size:18px;
  font-weight:600;
  color:var(--ink);
  line-height:1.22;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.sqa-x{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#F8F8FA;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--ink);
  margin-top:-2px;
}
.sqa-x svg{width:15px;height:15px;stroke-width:2.2}
.sqa-price-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin-top:2px}
.sqa-price{font-size:19px;font-weight:700;color:var(--rani)}
.sqa-mrp{font-size:13px;color:#7D828A;text-decoration:line-through;font-weight:500}
.sqa-lowest{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;color:#7C3AED}
.sqa-badges{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:2px}
.sqa-sku{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.sqa-shead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.7px;
  margin:11px 0 7px;
  color:var(--muted);
}
.sqa-shead em{font-style:normal;color:var(--ink);font-weight:700;text-transform:none;letter-spacing:0}
.sqa-err{color:#DC2626!important;font-style:normal;font-size:12.5px;font-weight:700!important;text-transform:none!important;letter-spacing:0!important}
.sqa-colors{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.sqa-colors::-webkit-scrollbar{display:none}
.sqa-sw{
  position:relative;
  flex:0 0 auto;
  width:46px;
  height:46px;
  border-radius:50%;
  border:2px solid var(--line);
  padding:2.5px;
  background:#fff;
  cursor:pointer;
  transition:transform .2s,border-color .2s;
}
.sqa-sw img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:50%;display:block}
.sqa-sw.on{border-color:#111113;transform:scale(1.06);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.sqa-sizes{display:flex;gap:7px;flex-wrap:wrap}
.sqa-sz{
  min-width:42px;
  height:38px;
  padding:0 12px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:#fff;
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:background .2s,color .2s,border-color .2s,transform .15s;
}
.sqa-sz:active{transform:scale(.95)}
.sqa-sz.on{
  background:linear-gradient(135deg,#242429,#0a0a0c);
  color:#fff;
  border-color:transparent;
  font-weight:700;
  box-shadow:0 5px 12px -3px rgba(0,0,0,.35);
}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.sqa-sizes.shake{animation:shake .35s}
.qty-box{
  flex:0 0 auto;
  height:40px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:#F8F8FA;
  border:1.5px solid var(--line);
  border-radius:999px;
  padding:3px 4px;
}
.qty-btn{
  position:relative;
  overflow:hidden;
  width:30px;
  height:30px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.qty-btn:active{transform:scale(.9)}
.qty-btn.plus{background:linear-gradient(135deg,#242429,#000000);color:#fff;border-color:#000}
.qty-btn.plus::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.72) 50%,transparent 80%);
  transform:translateX(-140%);
  animation:plusSimar 2.2s ease-in-out infinite;
}
@keyframes plusSimar{0%,55%{transform:translateX(-140%)}100%{transform:translateX(140%)}}
.qty-val{min-width:22px;text-align:center;font-size:14px;font-weight:700;color:var(--ink)}
.sqa-actions{display:grid;grid-template-columns:auto 1fr 40px 40px;gap:8px;margin-top:12px;align-items:center}
.sqa-add{
  grid-column:1/-1;
  width:100%;
  min-height:44px;
  background:linear-gradient(135deg,#242429,#000);
  color:#fff;
  border:0;
  border-radius:999px;
  padding:10px 18px;
  font-size:14.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  box-shadow:0 10px 22px -8px rgba(0,0,0,.45);
}
.sqa-add:active{transform:scale(.98)}
.sqa-add:disabled{opacity:.5;cursor:not-allowed}
.sqa-add svg{width:15px;height:15px;stroke-width:2.3}
.sqa-full{
  min-height:40px;
  padding:0 14px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-size:13.5px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.sqa-wish,.sqa-share{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:transform .2s,background .2s,color .2s,border-color .2s;
}
.sqa-wish:active,.sqa-share:active{transform:scale(.9)}
.sqa-wish svg,.sqa-share svg{width:16px;height:16px;stroke-width:2}
.sqa-wish.on{color:#C8102E;background:#FFF0F3;border-color:#C8102E}
.sqa-wish.on svg{fill:currentColor}

/* ---------- Shopping Bag Drawer (#cartDrawerOv) ---------- */
.cd-ov{
  position:fixed;
  inset:0;
  z-index:115;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
}
.cd-ov.on{display:flex}
.cd-sheet{
  width:100%;
  max-width:420px;
  max-height:88dvh;
  overflow-y:auto;
  background:#FFFFFF;
  border-radius:26px 26px 0 0;
  padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));
  border-top:1px solid #E5E5EA;
  box-shadow:0 -20px 50px rgba(0,0,0,.18);
  animation:sqaUp .28s var(--ease);
}
.cd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid #EBEBEF;margin-bottom:12px}
.cd-title-wrap{display:flex;align-items:center;gap:10px}
.cd-bag-ic{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#F8F8FA;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #E5E5EA;
}
.cd-bag-ic svg{width:18px;height:18px;stroke-width:2}
.cd-title-wrap h3{font-family:var(--font-main);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cd-title-wrap small{display:block;font-size:12.5px;color:var(--gold-text);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.cd-list{display:flex;flex-direction:column;gap:10px;max-height:44dvh;overflow-y:auto;padding-right:2px}
.cd-item{
  display:flex;
  align-items:center;
  gap:11px;
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:14px;
  padding:10px;
}
.cd-img{width:60px;height:60px;flex:0 0 60px;border-radius:0;object-fit:cover;background:#F4F4F6;border:1px solid #EBEBEF}
.cd-info{flex:1;min-width:0}
.cd-name{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.cd-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.cd-chip{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#F8F8FA;color:var(--ink);border:1px solid #E5E5EA}
.cd-price{font-size:15px;font-weight:700;color:var(--ink)}
.cd-ctrl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cd-del{width:26px;height:26px;border:0;border-radius:50%;background:#FEF2F2;color:var(--danger);display:inline-flex;align-items:center;justify-content:center}
.cd-del svg{width:13px;height:13px;stroke-width:2.2}
.cd-qty{display:inline-flex;align-items:center;background:#F8F8FA;border:1px solid #E5E5EA;border-radius:999px;padding:2px}
.cd-qbtn{width:25px;height:25px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.cd-qbtn.plus{background:var(--rani);color:#fff}
.cd-qval{min-width:22px;text-align:center;font-size:13px;font-weight:700;color:var(--ink)}
.cd-sum{
  margin-top:14px;
  padding:12px 14px;
  border-radius:14px;
  background:#F8F8FA;
  border:1px dashed #D4D4D8;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cd-sum span{font-size:13.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.cd-sum b{font-size:18px;font-weight:700;color:var(--ink)}
.cd-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.cd-checkout{
  width:100%;
  min-height:44px;
  border:0;
  border-radius:999px;
  background:linear-gradient(135deg,#242429,#000);
  color:#fff;
  font-size:14.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 10px 22px -6px rgba(0,0,0,.38);
}

/* Unified Top Pill Toast */
.foot{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
  letter-spacing:.02em;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);
  margin-top:6px;
}
.toast{
  position:fixed;
  left:50%;
  top:calc(62px + env(safe-area-inset-top,0px));
  bottom:auto;
  transform:translate(-50%,-16px);
  opacity:0;
  display:flex;
  align-items:center;
  gap:9px;
  background:linear-gradient(135deg,#16A34A,#15803D);
  color:#fff;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.02em;
  line-height:1.4;
  padding:10px 18px 10px 12px;
  border-radius:999px;
  box-shadow:0 10px 28px rgba(0,0,0,.32);
  pointer-events:none;
  transition:opacity .25s,transform .25s var(--ease);
  z-index:200;
  max-width:min(320px,88%);
}
.toast::before{
  content:"\2713";
  width:21px;
  height:21px;
  flex:0 0 21px;
  border-radius:50%;
  background:#fff;
  color:#16A34A;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
}
.toast[data-type="error"]{background:linear-gradient(135deg,#DC2626,#B91C1C)}
.toast[data-type="error"]::before{content:"!";color:#DC2626}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:375px){
  .top-row{padding:7px 8px}
  .back-btn,.icon-btn{width:33px;height:33px;flex:0 0 33px}
  main{padding-inline:12px}
  .pcard-foot{padding:7px 8px 0}
  .pcard-name{font-size:13.5px}
  .price{font-size:15.5px}
  .mrp{font-size:12px}
  .tag-off{font-size:12px}
  .rating{font-size:11px;padding:2px 5.5px}
  .go{width:26px;height:26px;flex:0 0 26px}
}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app">
  <header class="top" id="topBar">
    <div class="top-row">
      <button type="button" class="back-btn" onclick="goBack()" aria-label="Back"><i data-lucide="arrow-left"></i></button>
      <label class="search-box" id="searchBox">
        <i data-lucide="search"></i>
        <input type="search" id="searchInput" placeholder="Search blouse by name…" autocomplete="off" enterkeyhint="search" aria-label="Search products">
        <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear search"><i data-lucide="x"></i></button>
      </label>
      <a class="icon-btn" href="/wishlist" aria-label="Wishlist"><i data-lucide="heart"></i><span class="cart-badge" id="wishBadge" hidden>0</span></a>
      <button type="button" class="icon-btn" onclick="openCartDrawer()" aria-label="Shopping cart"><i data-lucide="shopping-cart"></i><span class="cart-badge" id="cartBadge" hidden>0</span></button>
    </div>
    <div class="filters" id="primaryFilters">
      <button type="button" class="dsel" id="sortBtn" aria-label="Sort products"><span id="sortLabel">Sort: Relevance</span><i data-lucide="chevron-down"></i></button>
      <button type="button" class="dsel" id="priceBtn" aria-label="Filter by price"><span id="priceLabel">Price: Any</span><i data-lucide="chevron-down"></i></button>
      <button type="button" class="chip" id="chipSale" aria-pressed="false"><i data-lucide="badge-percent"></i>On sale</button>
      <button type="button" class="chip" id="chipRate" aria-pressed="false"><i data-lucide="star"></i>4★ &amp; above</button>
    </div>
    <div class="filters" id="categoryFilters" hidden style="padding-top:0"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#F4F4F6"/><text x="200" y="210" font-family="Georgia,serif" font-size="30" fill="#8E8E93" text-anchor="middle">Aavira</text></svg>');
const FALLBACK_ATTR = `onerror="this.onerror=null;this.src='${PLACEHOLDER}'"`;
window.imgFallback = img => { img.onerror = null; img.src = PLACEHOLDER; };

const escapeHtml = v => String(v ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const safeUrl = v => {
  const r = String(v ?? '').trim();
  if (!r) return '';
  if (r.startsWith('data:image/')) return r;
  try {
    const u = new URL(r, location.origin);
    return ['http:', 'https:'].includes(u.protocol) ? u.href : '';
  } catch {
    return '';
  }
};
const safeImageUrl = v => safeUrl(v) || PLACEHOLDER;
const safeJson = (k, f) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? f : v; } catch { return f; } };
const saveJson = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const icons = () => { if (window.lucide) lucide.createIcons(); };
const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN');

const priceInfo = p => {
  const pr = Number(p.price) || 0;
  const m = Number(p.mrp) || pr;
  const saved = Math.max(0, m - pr);
  const off = m > pr ? Math.round((m - pr) / m * 100) : 0;
  return { pr, m, saved, off };
};

let toastTimer;
const showToast = (msg, type = 'success') => {
  const t = $('#toast');
  const m = $('#toastMsg');
  if (m) m.textContent = msg;
  else t.textContent = msg;
  t.dataset.type = type === 'error' ? 'error' : 'success';
  t.classList.add('show');
  navigator.vibrate?.(25);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2100);
};
window.showToast = showToast;

const TRENDING = ['Silk Blouses', 'Cotton Blouses', 'Bridal Blouses', 'Designer Blouses', 'Net Blouses'];

/* ---------- Storage & Badges ---------- */
const readCart = () => { const v = safeJson('aavira_cart', []); return Array.isArray(v) ? v : []; };
const writeCart = a => saveJson('aavira_cart', a);
const cartCount = () => readCart().reduce((s, it) => s + (Number(it.qty) || 0), 0);
const wishIds = () => new Set((safeJson('aavira_wishlist', []) || []).map(String));

const toggleWishId = id => {
  const s = wishIds(), key = String(id);
  s.has(key) ? s.delete(key) : s.add(key);
  saveJson('aavira_wishlist', [...s]);
  updateWishBadge();
  return s.has(key);
};

const updateCartBadge = () => {
  const n = cartCount(), b = $('#cartBadge');
  if (b) {
    if (n > 0) { b.hidden = false; b.textContent = n > 99 ? '99+' : n; }
    else { b.hidden = true; }
  }
  const qaCartBadge = $('#qaCartBadge');
  if (qaCartBadge) {
    qaCartBadge.hidden = !(n > 0);
    qaCartBadge.textContent = n > 99 ? '99+' : n;
  }
  paintCartBar();
};

const updateWishBadge = () => {
  const n = wishIds().size, b = $('#wishBadge');
  if (b) {
    if (n > 0) { b.hidden = false; b.textContent = n > 99 ? '99+' : n; }
    else { b.hidden = true; }
  }
  const qaWishBadge = $('#qaWishBadge');
  if (qaWishBadge) {
    qaWishBadge.hidden = !(n > 0);
    qaWishBadge.textContent = n > 99 ? '99+' : n;
  }
};

const paintCartBar = () => {
  const bar = $('#cartBar');
  if (!bar) return;
  const items = readCart().filter(it => it && (Number(it.qty) || 0) > 0);
  const count = items.reduce((s, it) => s + (Number(it.qty) || 1), 0);
  if (!count) {
    bar.hidden = true;
    return;
  }
  $('#cartBarImgs').innerHTML = items.slice(0, 3).map(it => `<img src="${escapeHtml(safeImageUrl(it.image || ''))}" alt="" loading="lazy" onerror="imgFallback(this)">`).join('');
  $('#cartBarCount').textContent = `${count} ${count === 1 ? 'item' : 'items'}`;
  bar.hidden = false;
  icons();
};

const recentSearches = () => { const v = safeJson('aavira_searches', []); return Array.isArray(v) ? v : []; };
const saveRecentSearch = q => {
  q = String(q || '').trim();
  if (q.length < 2) return;
  saveJson('aavira_searches', [q, ...recentSearches().filter(x => String(x).toLowerCase() !== q.toLowerCase())].slice(0, 8));
};
const removeRecentSearch = q => { saveJson('aavira_searches', recentSearches().filter(x => String(x) !== String(q))); };
const clearRecentSearches = () => { try { localStorage.removeItem('aavira_searches'); } catch {} render(); };

/* ---------- Admin Panel Colour Extraction & Normalization ---------- */
let allProducts = [];
let categories = [];
const prodMap = {};

const splitColorNames = val => {
  if (!val) return [];
  if (Array.isArray(val)) {
    return val.flatMap(item => {
      if (item && typeof item === 'object') {
        const n = item.name ?? item.color ?? item.colour ?? item.colorName ?? item.colourName ?? item.label ?? item.title ?? '';
        return String(n).trim() ? [String(n).trim()] : [];
      }
      return String(item ?? '').split(/[,|\n]+/).map(s => s.trim()).filter(Boolean);
    });
  }
  if (typeof val === 'string') {
    const trimmed = val.trim();
    if (!trimmed) return [];
    if (trimmed.startsWith('[')) {
      try { return splitColorNames(JSON.parse(trimmed)); } catch {}
    }
    return trimmed.split(/[,|\n]+/).map(s => s.trim()).filter(Boolean);
  }
  return [];
};

const extractAdminColorPairs = raw => {
  const pairs = [];
  const pushPair = (name, image) => {
    const cleanName = String(name ?? '').trim();
    const cleanImg = String(image ?? '').trim();
    if (!cleanName && !cleanImg) return;
    pairs.push({ name: cleanName, image: cleanImg });
  };
  const variantSources = [raw.colorVariants, raw.colourVariants, raw.variants, raw.colorOptions, raw.colourOptions, raw.colorList];
  for (const src of variantSources) {
    if (Array.isArray(src) && src.length && src.some(it => it && typeof it === 'object')) {
      src.forEach(it => {
        if (it && typeof it === 'object') {
          pushPair(
            it.name ?? it.color ?? it.colour ?? it.colorName ?? it.colourName ?? it.label ?? it.title ?? '',
            it.image ?? it.img ?? it.imageUrl ?? it.url ?? it.photo ?? it.src ?? ''
          );
        }
      });
      if (pairs.length) return pairs;
    }
  }
  if (Array.isArray(raw.colorImages) && raw.colorImages.some(it => it && typeof it === 'object')) {
    const fallbackNames = splitColorNames(raw.colors ?? raw.colours ?? raw.colorNames ?? raw.colourNames ?? raw.colorsInfo ?? raw.colorInfo);
    raw.colorImages.forEach((it, idx) => {
      if (it && typeof it === 'object') {
        pushPair(
          it.name ?? it.color ?? it.colour ?? it.colorName ?? it.colourName ?? it.label ?? fallbackNames[idx] ?? '',
          it.image ?? it.img ?? it.imageUrl ?? it.url ?? it.photo ?? it.src ?? ''
        );
      } else if (typeof it === 'string' && it.trim()) {
        pushPair(fallbackNames[idx] ?? '', it.trim());
      }
    });
    if (pairs.length) return pairs;
  }
  return pairs;
};

const getProductColorList = product => {
  const mainImg = String(product.img || product.imageMain || product.image || '').trim();
  const adminPairs = Array.isArray(product.colorPairs) && product.colorPairs.length
    ? product.colorPairs
    : extractAdminColorPairs(product);
  if (adminPairs.length) {
    return adminPairs.map(p => ({
      name: String(p.name || 'Standard').trim(),
      image: String(p.image || mainImg).trim()
    }));
  }
  const names = splitColorNames(product.colors ?? product.colorsInfo);
  const rawImgs = Array.isArray(product.colorImages) ? product.colorImages : [];
  const imgs = rawImgs
    .map(it => (it && typeof it === 'object') ? (it.image ?? it.img ?? it.imageUrl ?? it.url ?? '') : String(it ?? '').trim())
    .filter(Boolean);

  if (imgs.length > 0) {
    if (names.length === imgs.length + 1 && mainImg && !imgs.includes(mainImg)) {
      return [
        { name: names[0] || 'Main', image: mainImg },
        ...imgs.map((url, i) => ({ name: names[i + 1] || `Colour ${i + 2}`, image: url }))
      ];
    }
    const list = [{ name: names[0] || 'Main', image: mainImg }];
    imgs.forEach((url, i) => {
      if (url && url !== mainImg) {
        list.push({ name: names[i + 1] || names[i] || `Colour ${i + 2}`, image: url });
      }
    });
    return list;
  }
  if (names.length > 0) {
    return names.map(n => ({ name: n, image: mainImg }));
  }
  return mainImg ? [{ name: 'Standard', image: mainImg }] : [];
};

const normalize = x => {
  const pid = x.id ?? x._id;
  const item = {
    id: pid,
    name: x.name || x.title || '',
    price: x.price,
    mrp: x.mrp ?? x.originalPrice,
    colors: splitColorNames(x.colors ?? x.colours ?? x.colorNames ?? x.colorsInfo),
    colorsInfo: x.colorsInfo || '',
    colorImages: Array.isArray(x.colorImages) ? x.colorImages : [],
    colorPairs: extractAdminColorPairs(x),
    sizes: Array.isArray(x.sizes) && x.sizes.length ? x.sizes : ['32', '34', '36', '38', '40', '42'],
    img: x.imageMain || x.image || x.imageUrl || x.img || '',
    category: x.category || x.type || x.collection || x.tag || '',
    description: x.description || '',
    stock: x.stock,
    bestseller: !!x.bestseller,
    rating: clamp(Number(x.rating ?? x.averageRating ?? x.avgRating ?? x.ratingAvg ?? x.average_rating ?? x.avg_rating ?? x.stars) || 0, 0, 5)
  };
  if (pid != null) prodMap[String(pid)] = item;
  return item;
};

const applyReviewStats = () => {
  const agg = {};
  (safeJson('aavira_experiences', []) || []).forEach(e => {
    const pid = e.productId ?? e.product_id ?? e.pid;
    if (pid == null) return;
    const a = agg[String(pid)] = agg[String(pid)] || { s: 0, n: 0 };
    a.s += Number(e.rating) || 0;
    a.n++;
  });
  allProducts.forEach(p => {
    const a = agg[String(p.id)];
    if (a && a.n && !(Number(p.rating) > 0)) p.rating = clamp(Math.round((a.s / a.n) * 10) / 10, 0, 5);
  });
};

const buildCategories = () => {
  const seen = new Map();
  allProducts.forEach(p => {
    const c = String(p.category || '').trim();
    if (c && !seen.has(c.toLowerCase())) seen.set(c.toLowerCase(), c);
  });
  categories = [...seen.values()];
  const wrap = $('#categoryFilters');
  if (categories.length < 2) { wrap.hidden = true; wrap.innerHTML = ''; return; }
  wrap.hidden = false;
  wrap.innerHTML = categories.map(c => `<button type="button" class="chip" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
  wrap.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const on = !b.classList.contains('is-on');
    wrap.querySelectorAll('.chip').forEach(x => x.classList.remove('is-on'));
    if (on) b.classList.add('is-on');
    refresh(true);
  }));
};

/* Multi-word match across product name, category, colours, and description */
const matchesQuery = (p, q) => {
  if (!q) return true;
  const hay = [
    p.name,
    p.category,
    Array.isArray(p.colors) ? p.colors.join(' ') : '',
    p.colorsInfo,
    p.description
  ].join(' ').toLowerCase();
  return String(q).toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
};

/* ---------- Product Card Template (Identical to aavirafashion.shop & wishlist.html) ---------- */
const colorStripHtml = p => {
  const list = getProductColorList(p);
  const count = Math.max(1, list.length);
  return `<span class="color-strip">${count} ${count === 1 ? 'Colour' : 'Colours'}</span>`;
};

const ratingPill = p => {
  const r = clamp(Number(p.rating) || 0, 0, 5);
  const tone = r >= 4 ? '' : r >= 3 ? 'mid' : r > 0 ? 'bad' : 'none';
  return `<span class="rating ${tone}" role="img" aria-label="Rating ${r > 0 ? r.toFixed(1) : '0.0'}"><i data-lucide="star" fill="currentColor"></i>${r > 0 ? r.toFixed(1) : '0.0'}</span>`;
};

const resultCard = (p, i = 0) => {
  const { pr, m, saved, off } = priceInfo(p);
  const id = escapeHtml(p.id), name = escapeHtml(p.name);
  const href = `/product?id=${encodeURIComponent(p.id)}`;
  const stock = Number(p.stock);
  const isOut = Number.isFinite(stock) && stock <= 0 && p.stock !== '' && p.stock != null;
  const isLow = !isOut && Number.isFinite(stock) && stock > 0 && stock <= 4;

  const topTags = [
    p.bestseller ? '<span class="tag-best">BESTSELLER</span>' : '',
    off >= 20 && !isOut ? '<span class="tag-drop">PRICE DROP</span>' : ''
  ].filter(Boolean).join('');

  const stockOverlay = isOut
    ? '<span class="tag-stock oos">Out of Stock</span>'
    : (isLow ? `<span class="tag-stock low-stk">Only ${stock} Left</span>` : '');

  return `<article class="pcard${isOut ? ' out-stock' : ''}" style="--i:${i}">
    <span class="pcard-link" data-product="${id}">
      <span class="pcard-media">
        <img src="${escapeHtml(safeImageUrl(p.img))}" alt="${name}" loading="lazy" onerror="imgFallback(this)">
        ${topTags ? `<span class="tags">${topTags}</span>` : ''}
        ${stockOverlay}
      </span>
    </span>
    <div class="pcard-foot">
      <a class="pcard-text" href="${href}" data-product="${id}">
        <span class="pcard-name">${name}</span>
        <span class="pcard-price">
          <span class="price">${fmt(pr)}</span>
          ${m > pr ? `<span class="mrp">${fmt(m)}</span>` : ''}
          ${saved > 0 ? `<span class="tag-off">${fmt(saved)} OFF</span>` : ''}
        </span>
      </a>
      <div class="pcard-row">
        <a class="pcard-metalink" href="${href}" data-product="${id}">${colorStripHtml(p)}${ratingPill(p)}</a>
        <button type="button" class="go" data-qv="${id}" aria-label="Quick view ${name}"><i data-lucide="eye"></i></button>
      </div>
    </div>
  </article>`;
};

const skeletons = (n = 6) => `<div class="skel-grid">` + Array(n).fill(0).map((_, i) => `<div class="skel-card" style="--i:${i}"><div class="skel-media"></div><div class="skel-body"><div class="skel-line" style="width:76%"></div><div class="skel-line" style="width:48%"></div><div class="skel-line" style="width:60%"></div></div></div>`).join('') + `</div>`;

const homeView = () => {
  const r = recentSearches();
  const recentIds = (safeJson('aavira_recent', []) || []).map(String);
  const recentItems = recentIds.map(id => prodMap[id]).filter(Boolean).slice(0, 4);
  const wCount = wishIds().size;
  const cCount = cartCount();

  return `
  <section class="sec">
    <div class="qa-grid">
      <a href="/wishlist" class="qa">
        <div class="qa-ic"><i data-lucide="heart"></i></div>
        <span>My Wishlist</span>
        <b class="mini-badge" id="qaWishBadge" ${wCount > 0 ? '' : 'hidden'}>${wCount > 99 ? '99+' : wCount}</b>
      </a>
      <button type="button" class="qa" onclick="openCartDrawer()">
        <div class="qa-ic"><i data-lucide="shopping-cart"></i></div>
        <span>My Cart</span>
        <b class="mini-badge" id="qaCartBadge" ${cCount > 0 ? '' : 'hidden'}>${cCount > 99 ? '99+' : cCount}</b>
      </button>
      <a href="/orders" class="qa">
        <div class="qa-ic"><i data-lucide="package"></i></div>
        <span>My Orders</span>
      </a>
    </div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2 class="sec-title"><i data-lucide="trending-up"></i>Trending Searches</h2></div>
    <div class="chips-row">${TRENDING.map(t => `<button type="button" class="trend-chip" data-q="${escapeHtml(t)}"><i data-lucide="trending-up"></i>${escapeHtml(t)}</button>`).join('')}</div>
  </section>

  <section class="sec">
    <div class="sec-head">
      <h2 class="sec-title"><i data-lucide="clock"></i>Recent Searches</h2>
      ${r.length ? '<button type="button" class="clear-link" id="clearHistBtn">Clear all</button>' : ''}
    </div>
    ${r.length
      ? `<div class="chips-row">${r.map(q => `<button type="button" class="hist-chip" data-hq="${escapeHtml(q)}"><i data-lucide="clock"></i><span class="q">${escapeHtml(q)}</span><span class="hist-x" data-hx="${escapeHtml(q)}" aria-label="Remove"><i data-lucide="x"></i></span></button>`).join('')}</div>`
      : '<div class="empty-note">Your recent searches will appear here.</div>'}
  </section>

  ${recentItems.length ? `
  <section class="sec">
    <div class="sec-head">
      <h2 class="sec-title"><i data-lucide="sparkles"></i>Recently Viewed</h2>
      <button type="button" class="clear-link" id="clearViewedBtn">Clear</button>
    </div>
    <div class="results-grid">${recentItems.map((p, i) => resultCard(p, i)).join('')}</div>
  </section>` : ''}`;
};

function render() {
  const input = $('#searchInput'), c = $('#searchResults');
  const raw = input.value.trim(), q = raw.toLowerCase();
  $('#searchBox').classList.toggle('has-text', !!raw);
  const sale = $('#chipSale').classList.contains('is-on');
  const rate = $('#chipRate').classList.contains('is-on');
  const sort = sortVal;
  const priceRange = priceVal;
  const cat = (() => { const on = $('#categoryFilters .chip.is-on'); return on ? on.dataset.cat : ''; })();

  $('#sortBtn').classList.toggle('is-active', sort !== 'rel');
  $('#priceBtn').classList.toggle('is-active', priceRange !== 'any');

  const url = new URL(location.href);
  raw ? url.searchParams.set('q', raw) : url.searchParams.delete('q');
  try { history.replaceState(null, '', url); } catch {}

  if (!allProducts.length && window._loading) { c.innerHTML = skeletons(6); return; }
  if (!allProducts.length && window._failed) {
    c.innerHTML = `<div class="empty"><div class="e-ic"><i data-lucide="cloud-off"></i></div><b>Products unavailable</b><p>Please check your connection and try again.</p><button type="button" class="chip" onclick="loadProducts()"><i data-lucide="rotate-ccw"></i>Try again</button></div>`;
    icons();
    return;
  }

  const anyFilter = q || sale || rate || cat || priceRange !== 'any' || sort !== 'rel';
  if (!anyFilter) {
    c.innerHTML = homeView();
    bindHome();
    icons();
    return;
  }

  let f = allProducts.filter(p => matchesQuery(p, q));
  if (sale) f = f.filter(p => priceInfo(p).off > 0);
  if (rate) f = f.filter(p => Number(p.rating) >= 4);
  if (cat) f = f.filter(p => String(p.category || '').toLowerCase() === cat.toLowerCase());
  if (priceRange !== 'any') {
    const [lo, hi] = priceRange.split('-');
    f = f.filter(p => {
      const pr = priceInfo(p).pr;
      return pr >= Number(lo) && (hi === '' || hi === undefined || pr <= Number(hi));
    });
  }

  const by = {
    plh: (a, b) => priceInfo(a).pr - priceInfo(b).pr,
    phl: (a, b) => priceInfo(b).pr - priceInfo(a).pr,
    disc: (a, b) => priceInfo(b).off - priceInfo(a).off,
    rate: (a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0)
  }[sort];
  if (by) f = [...f].sort(by);

  const activeCount = [sale, rate, !!cat, priceRange !== 'any', sort !== 'rel'].filter(Boolean).length;
  let html = '';
  if (!f.length) {
    html = `<div class="empty"><div class="e-ic"><i data-lucide="search-x"></i></div><b>No matches found</b><p>Try searching with different keywords or clear active filters.</p>${activeCount ? '<button type="button" class="chip" onclick="clearAllFilters()"><i data-lucide="rotate-ccw"></i>Clear filters</button>' : ''}</div>`;
  } else {
    html += `<p class="res-count"><span>Showing <b>${f.length}</b> product${f.length > 1 ? 's' : ''}${raw ? ` for "${escapeHtml(raw)}"` : ''}</span>${activeCount ? '<button type="button" class="clear-link" onclick="clearAllFilters()">Reset filters</button>' : ''}</p>`;
    html += `<div class="results-grid">` + f.map((p, i) => resultCard(p, i)).join('') + `</div>`;
  }
  c.innerHTML = html;
  icons();
}

const pickSqaColor = btn => {
  const wasActive = btn.classList.contains('on');
  $$('#sqaColors .sqa-sw').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  sqaQty = 1;
  if ($('#sqaQtyVal')) $('#sqaQtyVal').textContent = '1';
  const em = $('#sqaColorName');
  if (em) em.textContent = '· ' + (btn.dataset.color || 'Standard');
  const img = $('#sqaImg');
  const media = $('#sqaMedia');
  const src = btn.dataset.img || '';
  if (!img || !src) return;
  if (wasActive) { navigator.vibrate?.(15); return; }

  const my = ++sqaSwitchToken;
  const t0 = Date.now(), MIN_SHOW = 420;
  media?.classList.add('is-switching');
  navigator.vibrate?.(15);
  const finish = ok => {
    if (my !== sqaSwitchToken) return;
    const wait = Math.max(0, MIN_SHOW - (Date.now() - t0));
    setTimeout(() => {
      if (my !== sqaSwitchToken) return;
      if (ok) img.src = src;
      media?.classList.remove('is-switching');
    }, wait);
  };
  const pre = new Image();
  pre.onload = () => finish(true);
  pre.onerror = () => finish(false);
  pre.src = src;
};

$('#sqaAdd').addEventListener('click', () => {

    updateCartBadge();
    closeSugQA();

});

/* ---------- Shopping Bag Drawer (#cartDrawerOv) ---------- */
window.renderCartDrawer = () => {
  const cart = readCart().filter(it => it && (Number(it.qty) || 0) > 0);
  const listEl = $('#cdList');
  const sumBox = $('#cdSumBox');
  const checkoutBtn = $('#cdCheckoutBtn');
  const totalCount = cart.reduce((s, it) => s + (Number(it.qty) || 1), 0);
  const totalAmt = cart.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);

  $('#cdSubCount').textContent = totalCount
    ? `${totalCount} ${totalCount === 1 ? 'item' : 'items'} ready to order`
    : 'Your bag is currently empty';

  if (!cart.length) {
    listEl.innerHTML = '<div class="empty-note"><b>No items in your bag yet</b><br>Tap any product eye icon to pick colour &amp; size.</div>';
    sumBox.hidden = true;
    checkoutBtn.disabled = true;
    $('#cdCheckoutText').textContent = 'Bag is Empty';
    icons();
    return;
  }

  sumBox.hidden = false;
  checkoutBtn.disabled = false;
  $('#cdTotalAmt').textContent = fmt(totalAmt);
  $('#cdCheckoutText').textContent = `Proceed to Checkout · ${fmt(totalAmt)}`;

  listEl.innerHTML = cart.map((it, idx) => {
    const qty = Number(it.qty) || 1;
    const price = Number(it.price) || 0;
    return `<div class="cd-item">
      <img class="cd-img" src="${escapeHtml(safeImageUrl(it.image))}" alt="" ${FALLBACK_ATTR}>
      <div class="cd-info">
        <div class="cd-name">${escapeHtml(it.name || 'Aavira Outfit')}</div>
        <div class="cd-meta">
          <span class="cd-chip">Size: ${escapeHtml(it.size || 'Free')}</span>
          <span class="cd-chip">${escapeHtml(it.color || 'Standard')}</span>
        </div>
        <div class="cd-price">${fmt(price * qty)} <small style="font-weight:500;color:var(--muted)">(${fmt(price)} × ${qty})</small></div>
      </div>
      <div class="cd-ctrl">
        <button type="button" class="cd-del" onclick="removeCartItemAt(${idx})" aria-label="Remove item"><i data-lucide="trash-2"></i></button>
        <div class="cd-qty">
          <button type="button" class="cd-qbtn" onclick="changeCartItemQty(${idx}, -1)" aria-label="Decrease">−</button>
          <span class="cd-qval">${qty}</span>
          <button type="button" class="cd-qbtn plus" onclick="changeCartItemQty(${idx}, 1)" aria-label="Increase">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
  icons();
};

window.openCartDrawer = () => {
  renderCartDrawer();
  $('#cartDrawerOv').classList.add('on');

};
window.closeCartDrawer = () => {
  $('#cartDrawerOv').classList.remove('on');

};
window.changeCartItemQty = (index, delta) => {
  const cart = readCart();
  if (!cart[index]) return;
  const next = (Number(cart[index].qty) || 1) + delta;
  if (next <= 0) cart.splice(index, 1);
  else cart[index].qty = clamp(next, 1, 20);
  writeCart(cart);
  updateCartBadge();
  renderCartDrawer();
};
window.removeCartItemAt = index => {
  const cart = readCart();
  cart.splice(index, 1);
  writeCart(cart);
  updateCartBadge();
  renderCartDrawer();
};
window.proceedToCheckout = btn => {
  const cart = readCart().filter(it => it && (Number(it.qty) || 0) > 0);

  saveJson('aavira_checkout_items', cart);

    location.href = '/checkout';

};

/* ---------- Load Products with Cache Fallback ---------- */
async function loadProducts() {
  window._loading = true;
  window._failed = false;
  render();
  try {
    let d = typeof window.getVercelData === 'function' ? await window.getVercelData() : [];
    if ((!Array.isArray(d) || !d.length)) {
      const cached = safeJson('aavira_cache_products', null);
      if (cached && Array.isArray(cached.data) && cached.data.length) d = cached.data;
    } else {
      saveJson('aavira_cache_products', { time: Date.now(), data: d });
    }
    if (!Array.isArray(d) || !d.length) throw new Error('No products');
    allProducts = d.map(normalize);
    applyReviewStats();
    buildCategories();
  } catch {
    window._failed = true;
  }
  window._loading = false;
  render();
}

function goBack() {
  const btn = document.querySelector('.back-btn');
  if (btn && !btn.classList.contains('is-loading')) btn.classList.add('is-loading');
  setTimeout(() => {
    try {
      if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
        history.back();
        return;
      }
    } catch {}
    location.href = '/';
  }, 300);
}

document.addEventListener('click', e => {
  const qvBtn = e.target.closest('[data-qv]');
  if (qvBtn) {
    e.preventDefault();
    e.stopPropagation();
    const id = qvBtn.dataset.qv;
    qvBtn.classList.add('is-busy');
    setTimeout(() => {
      qvBtn.classList.remove('is-busy');
      openSugQA(id);
    }, 200);
    return;
  }

  const sw = e.target.closest('#sqaColors .sqa-sw');
  if (sw) {
    pickSqaColor(sw);
    return;
  }

  const sz = e.target.closest('#sqaSizes .sqa-sz');
  if (sz) {
    $$('#sqaSizes .sqa-sz').forEach(b => b.classList.remove('on'));
    sz.classList.add('on');
    $('#sqaErr').hidden = true;
    navigator.vibrate?.(15);
    return;
  }

  if (e.target.closest('#sqaOv') && !e.target.closest('.sqa-sheet')) {
    closeSugQA();
    return;
  }

  const heart = e.target.closest('[data-heart]');
  if (heart) {
    e.preventDefault();
    const id = String(heart.dataset.heart);
    if (!id) return;
    const on = toggleWishId(id);
    heart.classList.toggle('on', on);
    heart.setAttribute('aria-pressed', on);
    showToast(on ? 'Saved to wishlist' : 'Removed from wishlist');
    return;
  }

  const prodEl = e.target.closest('[data-product]');
  if (!prodEl) return;
  saveRecentSearch($('#searchInput').value);
  let r = (safeJson('aavira_recent', []) || []).filter(i => String(i) !== prodEl.dataset.product);
  r.unshift(prodEl.dataset.product);
  saveJson('aavira_recent', r.slice(0, 8));
  if (prodEl.tagName !== 'A') {
    const anchor = prodEl.closest('.pcard')?.querySelector('a[data-product]');
    if (anchor && anchor !== prodEl) { anchor.click(); }
  }
});

});
window.addEventListener('storage', e => {
  if (!e.key || e.key.startsWith('aavira_')) {
    updateCartBadge();
    updateWishBadge();
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search).get('q');
  if (q) $('#searchInput').value = q;
  updateCartBadge();
  updateWishBadge();
  icons();
  loadProducts();
  if (!q) setTimeout(() => $('#searchInput').focus(), 400);
});
</script>
</body>
</html>
