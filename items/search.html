<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Search - Aavira</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{--rani:#D81B60;--rani-dark:#B71550;--rani-tint:#FCE8EF;--gold:#D4AF37;--ivory:#FDFBF7;--cream:#F7F1E8;--ink:#242024;--muted:#6B6369;--line:#E7E0D9;--ease:cubic-bezier(.2,.8,.2,1)}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--ivory);color:var(--ink);-webkit-font-smoothing:antialiased;position:relative}
a{color:inherit;text-decoration:none}
button,select,input{font-family:inherit}
:focus-visible{outline:2px solid var(--rani);outline-offset:2px}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.app{max-width:420px;margin:0 auto;background:var(--ivory);display:flex;flex-direction:column;min-height:100dvh;position:relative;overflow-x:clip}
@media(min-width:640px){body{background:#EFE8DE}.app{box-shadow:0 0 60px rgba(36,32,36,.12)}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .2s}
.top.scrolled{box-shadow:0 6px 24px rgba(36,32,36,.08)}
.top-row{min-height:64px;display:flex;align-items:center;gap:8px;padding:8px 10px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;transition:background .15s,transform .12s;cursor:pointer}
.icon-btn:hover{background:var(--rani-tint);color:var(--rani)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:22px;height:22px;stroke-width:1.6}
.back-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;box-shadow:0 2px 10px rgba(36,32,36,.08);transition:transform .12s}
.back-btn:active{transform:scale(.9)}
.back-btn svg{width:20px;height:20px;stroke-width:1.8}
.cart-badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--rani);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.search-box{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:0 8px 0 15px;height:46px;transition:border-color .15s,box-shadow .15s;box-shadow:0 2px 10px rgba(36,32,36,.05)}
.search-box:focus-within{border-color:var(--rani);box-shadow:0 4px 18px rgba(216,27,96,.14)}
.search-box>svg{width:18px;height:18px;color:var(--rani);flex:0 0 auto}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14.5px;color:var(--ink)}
.search-box input::placeholder{color:#A79FA5}
.search-box input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none;width:0;height:0}
.search-box input[type="search"]::-ms-clear{display:none;width:0;height:0}
.clear-btn{border:0;background:var(--cream);color:var(--muted);display:none;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.search-box.has-text .clear-btn{display:inline-flex}
.clear-btn svg{width:14px;height:14px}

.filters{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:2px 14px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.dsel{flex:0 0 auto;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,transform .12s}
.dsel:active{transform:scale(.95)}
.dsel svg{width:14px;height:14px;color:var(--muted)}
/* custom option sheet */
.scrim.sheet-scrim{align-items:flex-end;padding:0}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:420px;margin:0 auto;box-shadow:0 -12px 44px rgba(0,0,0,.18);transform:translateY(102%);transition:transform .3s var(--ease);max-height:72dvh;overflow-y:auto}
.scrim.show .sheet{transform:none}
.sheet-handle{width:42px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 10px}
.sheet h3{margin:0 0 6px;font-family:"Playfair Display",serif;font-size:19px;text-align:center}
.opt-row{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:16px 4px;font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line)}
.opt-row:last-child{border-bottom:0}
.opt-row .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:border-color .15s}
.opt-row.is-on{color:var(--rani);font-weight:600}
.opt-row.is-on .radio{border-color:var(--rani)}
.opt-row.is-on .radio::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--rani)}
.chip{flex:0 0 auto;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:active{transform:scale(.95)}
.chip svg{width:13px;height:13px}

/* ---------- main / sections ---------- */
main{flex:1;padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.sec{margin-bottom:26px;animation:fadeUp .4s var(--ease) both}
.sec:nth-child(2){animation-delay:.06s}.sec:nth-child(3){animation-delay:.12s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.sec-title{font-family:"Playfair Display",serif;font-size:18px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.sec-title svg{width:17px;height:17px;color:var(--rani)}
.clear-link{background:none;border:0;color:var(--rani);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 2px}

/* quick actions */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 6px 13px;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;position:relative}
.qa:hover{box-shadow:0 8px 22px rgba(36,32,36,.08);border-color:#F3D9E2}
.qa:active{transform:scale(.96)}

.qa-ic{width:46px;height:46px;border-radius:16px;background:var(--rani-tint);color:var(--rani);display:flex;align-items:center;justify-content:center}
.qa-ic svg{width:21px;height:21px;stroke-width:1.8}
.qa span{font-size:11.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.3}
.qa .mini-badge{position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--rani);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* trending + history chips */
.chips-row{display:flex;flex-wrap:wrap;gap:9px}
.trend-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--ink)}
.trend-chip:hover{border-color:var(--rani);color:var(--rani)}
.trend-chip:active{transform:scale(.95)}
.trend-chip svg{width:14px;height:14px;color:var(--rani)}
.hist-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 8px 9px 15px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--ink);max-width:100%}
.hist-chip:hover{border-color:var(--rani)}
.hist-chip:active{transform:scale(.96)}
.hist-chip svg{width:14px;height:14px;color:var(--muted);flex:0 0 auto}
.hist-chip .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-x{border:0;background:var(--cream);color:var(--muted);width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.hist-x svg{width:12px;height:12px}
.empty-note{text-align:center;color:var(--muted);font-size:13px;padding:18px 10px;border:1.5px dashed var(--line);border-radius:16px;background:#fff}

/* matched quick actions while typing */

/* ---------- results ---------- */
.res-count{font-size:12.5px;color:var(--muted);margin:0 2px 12px;display:flex;justify-content:space-between;align-items:center}
.res-count b{color:var(--ink)}



@keyframes resultIn{to{opacity:1;transform:translateY(0)}}








@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}







.rating{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:11px;color:#fff;background:#15803D;padding:3px 8px;border-radius:999px}
.rating.mid{background:#B45309}.rating.low{background:#B91C1C}
.rating svg{width:10px;height:10px;fill:currentColor;stroke:currentColor}
.dots{display:inline-flex;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;margin-left:-4px;box-shadow:0 0 0 2px #fff,inset 0 0 0 1px rgba(0,0,0,.14)}
.dots i:first-child{margin-left:0}
.dots b{min-width:20px;height:20px;padding:0 5px;margin-left:7px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}




@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

/* skeletons */
.results-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{position:relative;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;padding-bottom:12px;box-shadow:0 2px 8px rgba(36,32,36,.04);opacity:0;transform:translateY(10px);animation:resultIn .34s var(--ease) forwards;animation-delay:calc(var(--i,0) * 45ms);transition:box-shadow .25s}
.pcard:hover{box-shadow:0 10px 22px rgba(36,32,36,.1)}
.pcard-link{display:block;cursor:pointer}
.pcard-media{position:relative;display:block;aspect-ratio:1/1;background:var(--cream);overflow:hidden}
.pcard-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.pcard:hover .pcard-media img{transform:scale(1.05)}
.pcard-foot{display:block;padding:10px 10px 0}
.pcard-text{display:block;min-width:0}
.pcard-name{display:block;font-size:13px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-price{display:flex;align-items:baseline;gap:7px;margin-top:5px;flex-wrap:wrap}
.pcard-row{display:flex;align-items:center;gap:6px;margin-top:9px;min-width:0}
.pcard-metalink{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:2}
.tag-off{background:#15803D;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px}
.heart{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.14);cursor:pointer;transition:transform .15s;z-index:2}
.heart:active{transform:scale(.88)}
.heart svg{width:15px;height:15px;stroke-width:1.8}
.heart.is-on{color:var(--rani)}
.heart.is-on svg{fill:var(--rani)}
.heart.pulse{animation:pulse .32s var(--ease)}
.go{margin-left:auto;flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--rani);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,transform .15s}
.go svg{width:16px;height:16px;stroke-width:1.8}
.go.is-on{background:#15803D}
.go.pop{animation:pop .3s var(--ease)}





@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.skel-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;opacity:0;animation:resultIn .3s var(--ease) forwards;animation-delay:calc(var(--i,0) * 60ms)}
.skel-media{aspect-ratio:1/1;background:linear-gradient(90deg,#F1EBE3 25%,#FAF5EE 37%,#F1EBE3 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite}
.skel-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.skel-line{height:12px;border-radius:6px;background:linear-gradient(90deg,#F1EBE3 25%,#FAF5EE 37%,#F1EBE3 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* empty states */
.empty{ text-align:center;padding:56px 24px;color:var(--muted)}
.empty .e-ic{width:72px;height:72px;border-radius:24px;background:var(--rani-tint);color:var(--rani);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
.empty .e-ic svg{width:32px;height:32px;stroke-width:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;font-family:"Playfair Display",serif;margin-bottom:6px}
.empty p{font-size:13.5px;line-height:1.6;margin:0 0 18px}
.empty .chip{margin:0 auto}

/* ---------- custom popup ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,23,25,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:28px;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.show{opacity:1;pointer-events:auto}
.scrim[hidden]{display:none!important}
.popup{background:#fff;border-radius:24px;padding:22px 20px 18px;width:100%;max-width:320px;box-shadow:0 24px 60px rgba(0,0,0,.25);transform:translateY(14px) scale(.97);transition:transform .24s var(--ease);text-align:center}
.scrim.show .popup{transform:none}
.popup .p-ic{width:52px;height:52px;border-radius:18px;background:var(--rani-tint);color:var(--rani);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.popup .p-ic svg{width:24px;height:24px}
.popup h3{margin:0 0 4px;font-family:"Playfair Display",serif;font-size:18px}
.popup .p-q{font-size:13.5px;color:var(--muted);margin:0 0 18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-btn{width:100%;border:0;border-radius:999px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:9px;transition:transform .12s}
.p-btn:active{transform:scale(.97)}
.p-primary{background:var(--rani);color:#fff}
.p-danger{background:#FDECEF;color:#B91C1C}
.p-ghost{background:transparent;color:var(--muted);margin-bottom:0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease);z-index:95;white-space:nowrap;max-width:86%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="topBar">
    <div class="top-row">
      <button type="button" class="back-btn" onclick="goBack()" aria-label="Back"><i data-lucide="arrow-left"></i></button>
      <label class="search-box" id="searchBox">
        <i data-lucide="search"></i>
        <input type="search" id="searchInput" placeholder="Search sarees, suits, lehengas…" autocomplete="off" enterkeyhint="search" aria-label="Search products">
        <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear search"><i data-lucide="x"></i></button>
      </label>
      <a class="icon-btn" href="/wishlist" aria-label="Wishlist"><i data-lucide="heart"></i><span class="cart-badge" id="wishBadge" hidden>0</span></a>
      <a class="icon-btn" href="/cart" aria-label="Shopping cart"><i data-lucide="shopping-cart"></i><span class="cart-badge" id="cartBadge" hidden>0</span></a>
    </div>
    <div class="filters" id="primaryFilters">
      <button type="button" class="dsel" id="sortBtn" aria-label="Sort products"><span id="sortLabel">Sort: Relevance</span><i data-lucide="chevron-down"></i></button>
      <button type="button" class="dsel" id="priceBtn" aria-label="Filter by price"><span id="priceLabel">Price: Any</span><i data-lucide="chevron-down"></i></button>
      <button type="button" class="chip" id="chipSale" aria-pressed="false"><i data-lucide="badge-percent"></i>On sale</button>
      <button type="button" class="chip" id="chipRate" aria-pressed="false"><i data-lucide="star"></i>4★ &amp; above</button>
    </div>
    <div class="filters" id="categoryFilters" hidden style="padding-top:0"></div>
  </header>

  <main id="searchResults" aria-live="polite"></main>
</div>

<div class="scrim sheet-scrim" id="optScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="optTitle">
    <div class="sheet-handle"></div>
    <h3 id="optTitle"></h3>
    <div id="optList"></div>
  </div>
</div>

<div class="scrim" id="popupScrim" hidden>
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="p-ic"><i data-lucide="clock"></i></div>
    <h3 id="popupTitle">Recent search</h3>
    <p class="p-q" id="popupQ"></p>
    <button type="button" class="p-btn p-primary" id="popupSearch">Search again</button>
    <button type="button" class="p-btn p-danger" id="popupDelete">Delete</button>
    <button type="button" class="p-btn p-ghost" id="popupCancel">Cancel</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const PLACEHOLDER='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#F7F1E8"/><text x="200" y="210" font-family="Georgia,serif" font-size="30" fill="#B9AFA6" text-anchor="middle">Aavira</text></svg>');
window.imgFallback=img=>{img.onerror=null;img.src=PLACEHOLDER};
const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const safeUrl=v=>{const r=String(v??'').trim();if(!r)return'';try{const u=new URL(r,location.origin);return['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};
const safeImageUrl=v=>safeUrl(v)||PLACEHOLDER;
const safeJson=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch{return f}};
const saveJson=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const icons=()=>{if(window.lucide)lucide.createIcons()};
const fmt=n=>'₹'+Number(n).toLocaleString('en-IN');
const priceInfo=p=>{const pr=Number(p.price)||0,m=Number(p.mrp)||pr;return{pr,m,off:m>pr?Math.round((m-pr)/m*100):0}};
let toastTimer;
const showToast=msg=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)};

const ethnicColors={"red":"#C8102E","maroon":"#6D1230","wine":"#5E1A2B","rani pink":"#D81B60","pink":"#F4A6C0","magenta":"#C2185B","coral":"#F08A6E","peach":"#F6C1A5","orange":"#E2711D","rust":"#B7410E","mustard":"#D4A017","yellow":"#E8B923","gold":"#C9A227","beige":"#D9C3A0","ivory":"#F5EFE0","white":"#FFFFFF","green":"#2E7D5B","emerald":"#0F7B5A","olive":"#6B7A2A","lime":"#A4C639","mint":"#A8D5BA","teal":"#0F766E","turquoise":"#2BB5B8","sky blue":"#7FB7E0","blue":"#1F4E9C","navy blue":"#1B2A5C","lavender":"#C7B8E6","violet":"#9B6BC9","purple":"#6B3FA0","brown":"#7B4B2A","gray":"#8A8A8A","black":"#1A1A1A"};
const colorHex=n=>{
  const k=String(n).trim().toLowerCase();
  if(ethnicColors[k])return ethnicColors[k];
  return(window.CSS&&CSS.supports('color',k))?k:'#D1D5DB';
};

const TRENDING=['Sarees','Suits','Lehengas','Kurtis','Gowns','Blouses'];

/* ---------- storage ---------- */
const readCart=()=>{const v=safeJson('aavira_cart',[]);return Array.isArray(v)?v:[]};
const writeCart=a=>saveJson('aavira_cart',a);
const cartCount=()=>readCart().reduce((s,it)=>s+(Number(it.qty)||0),0);
const inCart=id=>readCart().some(it=>String(it.productId??it.id)===String(id));
const toggleCart=p=>{
  const c=readCart(),key=String(p.id);
  const i=c.findIndex(it=>String(it.productId??it.id)===key);
  let on;
  if(i>-1){c.splice(i,1);on=false}
  else{c.push({productId:key,name:p.name,price:Number(p.price)||0,mrp:Number(p.mrp)||0,image:p.img,qty:1,size:'Free Size',color:'As Shown'});on=true}
  writeCart(c);updateCartBadge();
  return on;
};
const wishIds=()=>new Set((safeJson('aavira_wishlist',[])||[]).map(String));
const toggleWish=id=>{
  const s=wishIds(),key=String(id);
  s.has(key)?s.delete(key):s.add(key);
  saveJson('aavira_wishlist',[...s]);updateWishBadge();
  return s.has(key);
};
const updateCartBadge=()=>{
  const n=cartCount(),b=$('#cartBadge');
  if(n>0){b.hidden=false;b.textContent=n>99?'99+':n}else{b.hidden=true}
};
const updateWishBadge=()=>{
  const n=wishIds().size,b=$('#wishBadge');
  if(!b)return;
  if(n>0){b.hidden=false;b.textContent=n>99?'99+':n}else{b.hidden=true}
};
const recentSearches=()=>{const v=safeJson('aavira_searches',[]);return Array.isArray(v)?v:[]};
const saveRecentSearch=q=>{
  q=String(q||'').trim();if(q.length<2)return;
  saveJson('aavira_searches',[q,...recentSearches().filter(x=>String(x).toLowerCase()!==q.toLowerCase())].slice(0,8));
};
const removeRecentSearch=q=>{saveJson('aavira_searches',recentSearches().filter(x=>String(x)!==String(q)))};
const clearRecentSearches=()=>{try{localStorage.removeItem('aavira_searches')}catch{}render()};

/* ---------- products ---------- */
let allProducts=[];
let categories=[];
const normalize=x=>({
  id:x.id,name:x.name,price:x.price,mrp:x.mrp,
  colors:Array.isArray(x.colors)?x.colors:[],
  img:x.imageMain||x.image||x.imageUrl||'',
  category:x.category||x.type||x.collection||x.tag||'',
  rating:x.rating??x.averageRating??x.avgRating??x.ratingAvg??x.average_rating??x.avg_rating??x.stars
});
const applyReviewStats=()=>{
  const agg={};
  (safeJson('aavira_experiences',[])||[]).forEach(e=>{
    const pid=e.productId??e.product_id??e.pid;if(pid==null)return;
    const a=agg[String(pid)]=agg[String(pid)]||{s:0,n:0};a.s+=Number(e.rating)||0;a.n++;
  });
  allProducts.forEach(p=>{const a=agg[String(p.id)];if(a&&a.n&&!(Number(p.rating)>0))p.rating=a.s/a.n});
};
const buildCategories=()=>{
  const seen=new Map();
  allProducts.forEach(p=>{const c=String(p.category||'').trim();if(c&&!seen.has(c.toLowerCase()))seen.set(c.toLowerCase(),c)});
  categories=[...seen.values()];
  const wrap=$('#categoryFilters');
  if(categories.length<2){wrap.hidden=true;wrap.innerHTML='';return}
  wrap.hidden=false;
  wrap.innerHTML=categories.map(c=>`<button type="button" class="chip" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
  wrap.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
    const on=!b.classList.contains('is-on');
    wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('is-on'));
    if(on)b.classList.add('is-on');
    refresh(true);
  }));
};

/* multi-word match: every typed word must appear, in any order */
const matchesQuery=(hay,q)=>{
  if(!q)return true;
  const h=String(hay||'').toLowerCase();
  return String(q).toLowerCase().split(/\s+/).filter(Boolean).every(w=>h.includes(w));
};

/* ---------- templates ---------- */
const colorDots=p=>{
  const c=p.colors;if(!c.length)return'';
  return `<span class="dots" role="img" aria-label="${c.length} ${c.length>1?'colours':'colour'} available">${c.slice(0,3).map(x=>`<i style="background:${colorHex(x)}"></i>`).join('')}${c.length>3?`<b>+${c.length-3}</b>`:''}</span>`;
};
const ratingPill=p=>{
  const r=Number(p.rating);
  return r>0?`<span class="rating ${r>=4?'':r>=3?'mid':'low'}">${r.toFixed(1)}<i data-lucide="star"></i></span>`:'';
};
const resultCard=(p,i)=>{
  const {pr,m,off}=priceInfo(p);
  const wished=wishIds().has(String(p.id));
  const added=inCart(p.id);
  const id=escapeHtml(p.id),name=escapeHtml(p.name);
  const href=`/product?id=${encodeURIComponent(p.id)}`;
  const tags=off?`<span class="tags"><span class="tag-off">${off}% off</span></span>`:'';
  return `<article class="pcard" style="--i:${i}">
    <span class="pcard-link" data-product="${id}">
      <span class="pcard-media"><img src="${escapeHtml(safeImageUrl(p.img))}" alt="" loading="lazy" onerror="imgFallback(this)">${tags}</span>
    </span>
    <div class="pcard-foot">
      <a class="pcard-text" href="${href}" data-product="${id}">
        <span class="pcard-name">${name}</span>
        <span class="pcard-price"><span class="price">${fmt(pr)}</span>${m>pr?`<span class="mrp">${fmt(m)}</span>`:''}</span>
      </a>
      <div class="pcard-row">
        <span class="pcard-metalink">${ratingPill(p)}${colorDots(p)}</span>
        <button type="button" class="go${added?' is-on':''}" data-cart="${id}" aria-label="${added?'Remove from bag':'Add to bag'}" aria-pressed="${added}"><i data-lucide="${added?'check':'shopping-bag'}"></i></button>
      </div>
    </div>
    <button type="button" class="heart${wished?' is-on':''}" data-wish="${id}" aria-label="Save to wishlist" aria-pressed="${wished}"><i data-lucide="heart"></i></button>
  </article>`;
};
const skeletons=(n=6)=>`<div class="skel-grid">`+Array(n).fill(0).map((_,i)=>`<div class="skel-card" style="--i:${i}"><div class="skel-media"></div><div class="skel-body"><div class="skel-line" style="width:72%"></div><div class="skel-line" style="width:42%"></div><div class="skel-line" style="width:58%"></div></div></div>`).join('')+`</div>`;

const homeView=()=>{
  const r=recentSearches();
  return `
  <section class="sec">
    <div class="sec-head"><h2 class="sec-title"><i data-lucide="trending-up"></i>Trending</h2></div>
    <div class="chips-row">${TRENDING.map(t=>`<button type="button" class="trend-chip" data-q="${escapeHtml(t)}"><i data-lucide="trending-up"></i>${escapeHtml(t)}</button>`).join('')}</div>
  </section>
  <section class="sec">
    <div class="sec-head">
      <h2 class="sec-title"><i data-lucide="clock"></i>Recent</h2>
      ${r.length?'<button type="button" class="clear-link" id="clearHistBtn">Clear all</button>':''}
    </div>
    ${r.length
      ? `<div class="chips-row">${r.map(q=>`<button type="button" class="hist-chip" data-hq="${escapeHtml(q)}"><i data-lucide="clock"></i><span class="q">${escapeHtml(q)}</span><span class="hist-x" data-hx="${escapeHtml(q)}" aria-label="Remove"><i data-lucide="x"></i></span></button>`).join('')}</div>`
      : '<div class="empty-note">Your recent searches will appear here.</div>'}
  </section>`;
};

function render(){
  const input=$('#searchInput'),c=$('#searchResults');
  const raw=input.value.trim(),q=raw.toLowerCase();
  $('#searchBox').classList.toggle('has-text',!!raw);
  const sale=$('#chipSale').classList.contains('is-on'),rate=$('#chipRate').classList.contains('is-on'),sort=sortVal;
  const priceRange=priceVal,cat=(()=>{const on=$('#categoryFilters .chip.is-on');return on?on.dataset.cat:''})();

  const url=new URL(location.href);
  raw?url.searchParams.set('q',raw):url.searchParams.delete('q');
  history.replaceState(null,'',url);

  if(!allProducts.length&&window._loading){c.innerHTML=skeletons(6);return}
  if(!allProducts.length&&window._failed){
    c.innerHTML=`<div class="empty"><div class="e-ic"><i data-lucide="cloud-off"></i></div><b>Products unavailable</b><p>Please check your connection and try again.</p><button type="button" class="chip" onclick="loadProducts()"><i data-lucide="rotate-ccw"></i>Try again</button></div>`;
    icons();return;
  }
  const anyFilter=q||sale||rate||cat||priceRange!=='any'||sort!=='rel';
  if(!anyFilter){c.innerHTML=homeView();bindHome();icons();return}

  let f=allProducts.filter(p=>matchesQuery(p.name,q));
  if(sale)f=f.filter(p=>priceInfo(p).off>0);
  if(rate)f=f.filter(p=>Number(p.rating)>=4);
  if(cat)f=f.filter(p=>String(p.category||'').toLowerCase()===cat.toLowerCase());
  if(priceRange!=='any'){
    const [lo,hi]=priceRange.split('-');
    f=f.filter(p=>{const pr=priceInfo(p).pr;return pr>=Number(lo)&&(hi===''||hi===undefined||pr<=Number(hi))});
  }
  const by={plh:(a,b)=>priceInfo(a).pr-priceInfo(b).pr,phl:(a,b)=>priceInfo(b).pr-priceInfo(a).pr,disc:(a,b)=>priceInfo(b).off-priceInfo(a).off,rate:(a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0)}[sort];
  if(by)f=[...f].sort(by);

  const activeCount=[sale,rate,!!cat,priceRange!=='any'].filter(Boolean).length;
  let html='';
  if(!f.length){
    html=`<div class="empty"><div class="e-ic"><i data-lucide="search-x"></i></div><b>No matches found</b><p>Try different words, or clear the filters below.</p>${activeCount?'<button type="button" class="chip" onclick="clearAllFilters()">Clear filters</button>':''}</div>`;
  }else if(f.length){
    html+=`<p class="res-count"><span><b>${f.length}</b> product${f.length>1?'s':''}</span>${activeCount?'<button type="button" class="clear-link" onclick="clearAllFilters()">Clear filters</button>':''}</p>`;
    html+=`<div class="results-grid">`+f.map((p,i)=>resultCard(p,i)).join('')+`</div>`;
  }
  c.innerHTML=html;
  icons();
}

function bindHome(){
  document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{
    $('#searchInput').value=b.dataset.q;refresh(true);$('#searchInput').focus();
  }));
  document.querySelectorAll('[data-hq]').forEach(b=>b.addEventListener('click',e=>{
    if(e.target.closest('[data-hx]'))return;
    openHistoryPopup(b.dataset.hq);
  }));
  document.querySelectorAll('[data-hx]').forEach(x=>x.addEventListener('click',e=>{
    e.stopPropagation();removeRecentSearch(x.dataset.hx);render();
  }));
  const cb=$('#clearHistBtn');
  if(cb)cb.addEventListener('click',()=>{clearRecentSearches();showToast('Search history cleared')});
}
const SORT_OPTS=[{v:'rel',t:'Relevance'},{v:'plh',t:'Price: Low to high'},{v:'phl',t:'Price: High to low'},{v:'disc',t:'Biggest discount'},{v:'rate',t:'Top rated'}];
const PRICE_OPTS=[{v:'any',t:'Any'},{v:'0-1000',t:'Under \u20B91,000'},{v:'1000-2500',t:'\u20B91,000 \u2013 \u20B92,500'},{v:'2500-5000',t:'\u20B92,500 \u2013 \u20B95,000'},{v:'5000-',t:'Above \u20B95,000'}];
let sortVal='rel',priceVal='any';
function openOpts(title,opts,current,onPick){
  $('#optTitle').textContent=title;
  $('#optList').innerHTML=opts.map(o=>'<button type="button" class="opt-row'+(o.v===current?' is-on':'')+'" data-v="'+o.v+'"><span>'+escapeHtml(o.t)+'</span><span class="radio"></span></button>').join('');
  $('#optList').querySelectorAll('.opt-row').forEach(b=>b.addEventListener('click',()=>{onPick(b.dataset.v);closeOpts()}));
  const s=$('#optScrim');s.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show')));
}
function closeOpts(){const s=$('#optScrim');s.classList.remove('show');setTimeout(()=>{s.hidden=true},300)}
function clearAllFilters(){
  $('#chipSale').classList.remove('is-on');$('#chipSale').setAttribute('aria-pressed','false');
  $('#chipRate').classList.remove('is-on');$('#chipRate').setAttribute('aria-pressed','false');
  sortVal='rel';priceVal='any';$('#sortLabel').textContent='Sort: Relevance';$('#priceLabel').textContent='Price: Any';
  $('#categoryFilters').querySelectorAll('.chip').forEach(b=>b.classList.remove('is-on'));
  render();
}

/* ---------- custom history popup ---------- */
let popupQ=null;
function openHistoryPopup(q){
  popupQ=q;
  $('#popupQ').textContent=q;
  const s=$('#popupScrim');
  s.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show')));
  icons();
}
function closeHistoryPopup(){
  const s=$('#popupScrim');
  s.classList.remove('show');
  setTimeout(()=>{s.hidden=true},220);
  popupQ=null;
}
$('#popupSearch').addEventListener('click',()=>{
  const q=popupQ;closeHistoryPopup();
  if(q){$('#searchInput').value=q;refresh(true);$('#searchInput').focus()}
});
$('#popupDelete').addEventListener('click',()=>{
  if(popupQ)removeRecentSearch(popupQ);
  closeHistoryPopup();render();showToast('Removed from history');
});
$('#popupCancel').addEventListener('click',closeHistoryPopup);
$('#popupScrim').addEventListener('click',e=>{if(e.target.id==='popupScrim')closeHistoryPopup()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#popupScrim').hidden)closeHistoryPopup();if(!$('#optScrim').hidden)closeOpts()}});

async function loadProducts(){
  window._loading=true;window._failed=false;render();
  try{
    const d=typeof window.getVercelData==='function'?await window.getVercelData():[];
    if(!Array.isArray(d)||!d.length)throw new Error('No products');
    allProducts=d.map(normalize);applyReviewStats();buildCategories();
  }catch{window._failed=true}
  window._loading=false;render();
}

function goBack(){
  if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1)history.back();
  else location.href='/';
}

let searchDebounce,skeletonTimeout;
const hasActiveSearch=()=>{
  if($('#searchInput').value.trim())return true;
  if($('#chipSale').classList.contains('is-on')||$('#chipRate').classList.contains('is-on'))return true;
  if(sortVal!=='rel'||priceVal!=='any')return true;
  return !!$('#categoryFilters .chip.is-on');
};
function refresh(withSkeleton){
  clearTimeout(searchDebounce);clearTimeout(skeletonTimeout);
  searchDebounce=setTimeout(()=>{
    if(withSkeleton&&allProducts.length&&hasActiveSearch()){
      $('#searchResults').innerHTML=skeletons(6);
      skeletonTimeout=setTimeout(render,320);
    }else render();
  },160);
}
$('#searchInput').addEventListener('input',()=>refresh(true));
$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveRecentSearch($('#searchInput').value);e.target.blur()}});
$('#clearBtn').addEventListener('click',()=>{const i=$('#searchInput');i.value='';i.focus();render()});
$('#sortBtn').addEventListener('click',()=>openOpts('Sort by',SORT_OPTS,sortVal,v=>{sortVal=v;$('#sortLabel').textContent='Sort: '+SORT_OPTS.find(o=>o.v===v).t;refresh(true)}));
$('#priceBtn').addEventListener('click',()=>openOpts('Price',PRICE_OPTS,priceVal,v=>{priceVal=v;$('#priceLabel').textContent='Price: '+(v==='any'?'Any':PRICE_OPTS.find(o=>o.v===v).t);refresh(true)}));
$('#optScrim').addEventListener('click',e=>{if(e.target.id==='optScrim')closeOpts()});
['chipSale','chipRate'].forEach(id=>$('#'+id).addEventListener('click',e=>{
  const b=e.currentTarget,on=!b.classList.contains('is-on');
  b.classList.toggle('is-on',on);b.setAttribute('aria-pressed',on);refresh(true);
}));
window.addEventListener('scroll',()=>{$('#topBar').classList.toggle('scrolled',scrollY>8)},{passive:true});

document.addEventListener('click',e=>{
  const wishBtn=e.target.closest('[data-wish]');
  if(wishBtn){
    e.preventDefault();e.stopPropagation();
    const on=toggleWish(wishBtn.dataset.wish);
    wishBtn.classList.toggle('is-on',on);wishBtn.setAttribute('aria-pressed',on);
    wishBtn.classList.remove('pulse');void wishBtn.offsetWidth;wishBtn.classList.add('pulse');
    showToast(on?'Saved to wishlist':'Removed from wishlist');
    return;
  }
  const cartBtn=e.target.closest('[data-cart]');
  if(cartBtn){
    e.preventDefault();e.stopPropagation();
    const p=allProducts.find(x=>String(x.id)===String(cartBtn.dataset.cart));
    if(!p)return;
    const on=toggleCart(p);
    cartBtn.classList.toggle('is-on',on);cartBtn.setAttribute('aria-pressed',on);
    cartBtn.setAttribute('aria-label',on?'Remove from bag':'Add to bag');
    cartBtn.innerHTML=`<i data-lucide="${on?'check':'shopping-bag'}"></i>`;icons();
    cartBtn.classList.remove('pop');void cartBtn.offsetWidth;cartBtn.classList.add('pop');
    showToast(on?'Added to bag':'Removed from bag');
    return;
  }
  const prodEl=e.target.closest('[data-product]');if(!prodEl)return;
  saveRecentSearch($('#searchInput').value);
  let r=(safeJson('aavira_recent',[])||[]).filter(i=>String(i)!==prodEl.dataset.product);
  r.unshift(prodEl.dataset.product);saveJson('aavira_recent',r.slice(0,8));
  if(prodEl.tagName!=='A'){
    const anchor=prodEl.closest('.pcard')?.querySelector('a[data-product]');
    if(anchor&&anchor!==prodEl){anchor.click();return}
  }
});

document.addEventListener('DOMContentLoaded',()=>{
  const q=new URLSearchParams(location.search).get('q');
  if(q)$('#searchInput').value=q;
  updateCartBadge();updateWishBadge();
  icons();loadProducts();
  if(!q)setTimeout(()=>$('#searchInput').focus(),400);
});
</script>
<script src="/user_data.js"></script>
</body>
</html>
