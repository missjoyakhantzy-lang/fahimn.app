<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aavira Luxe - Collections</title>
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
 --rani:#D81B60; --rani-dark:#B71550; --rani-light:#FDF0F5;
 --gold:#D4AF37; --ivory:#FDFBF7; --text:#242024; --muted:#756D73; --border:#E7E0D9;
 --green:#16a34a; --orange:#ea580c;
 --primary:#D81B60;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Plus Jakarta Sans",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--ivory)}
body{display:flex;justify-content:center;height:100dvh;overflow:hidden}
.app-container{width:100%;max-width:460px;height:100dvh;background:var(--ivory);display:flex;flex-direction:column;position:relative;overflow:hidden;border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* HEADER - rounded */
.pro-header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.icon-btn{width:40px;height:40px;flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;font-size:16px;text-decoration:none;position:relative}
.icon-btn:active{transform:scale(.92)}
.search-bar{flex:1;background:#F9FAFB;border:1px solid transparent;border-radius:13px;padding:0 12px;height:42px;display:flex;align-items:center;gap:9px;min-width:0}
.search-bar i{color:#9CA3AF;font-size:13px}
.search-bar input{border:0;background:transparent;outline:0;width:100%;font-size:13px;font-weight:500;color:var(--text);font-family:inherit}
.search-bar:focus-within{border-color:var(--rani);background:#fff;box-shadow:0 0 0 3px rgba(216,27,96,.09)}
.cart-badge{position:absolute;top:-5px;right:-5px;background:var(--rani);color:#fff;font-size:9px;font-weight:800;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid #fff}

/* CATEGORY - rounded Rani */
.cat-scroll-bar{display:flex;overflow-x:auto;gap:9px;padding:12px;background:#fff;border-bottom:1px solid #F3F4F6;scrollbar-width:none;flex-shrink:0}
.cat-scroll-bar::-webkit-scrollbar{display:none}
.cat-pill{padding:9px 20px;background:#fff;border:1px solid #E5E7EB;border-radius:100px;font-size:11px;font-weight:800;color:#4B5563;white-space:nowrap;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;transition:.25s}
.cat-pill.active{background:var(--rani);color:#fff;border-color:var(--rani);box-shadow:0 6px 14px rgba(216,27,96,.28)}

.main-content{flex:1;overflow-y:auto;padding:14px 12px 24px;background:var(--ivory);scrollbar-width:none}
.main-content::-webkit-scrollbar{display:none}
.right-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.right-header h2{font-size:20px;font-weight:700;color:var(--text);font-family:"Playfair Display",serif}
.right-header p{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:#fff;border:1px solid var(--border);padding:6px 12px;border-radius:100px}
.toolbar-row{display:flex;gap:8px;margin:10px 0 14px}
.sort-select{flex:1;height:42px;border:1px solid var(--border);border-radius:100px;background:#fff;font-size:12px;font-weight:700;padding:0 14px;outline:none;font-family:inherit}
.filter-chip-btn{height:42px;padding:0 16px;border:1px solid var(--border);background:#fff;border-radius:100px;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.filter-chip-btn.active{background:var(--rani);color:#fff;border-color:var(--rani)}

/* PRODUCT - 1:1 NO ROUNDED SHARP */
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:10px}
.p-card{background:#fff;display:flex;flex-direction:column;position:relative;border-radius:0;box-shadow:0 4px 20px -4px rgba(0,0,0,.06);border:1px solid #f3f0ee;overflow:hidden;animation:popIn .35s ease}
.p-card:active{transform:scale(.97)}
.p-img-wrap{position:relative;width:100%;aspect-ratio:1/1;background:#f8f7f6;overflow:hidden;cursor:pointer;border-radius:0;flex-shrink:0}
.p-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;border-radius:0;transition:transform .6s ease}
.p-card:hover .p-img{transform:scale(1.06)}
.discount-tag{position:absolute;top:0;left:0;z-index:10;background:#fff;color:var(--rani);padding:5px 10px;font-size:10px;font-weight:800;letter-spacing:.04em;border-radius:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.price-drop{position:absolute;top:27px;left:0;z-index:10;background:var(--green);color:#fff;padding:3px 8px;font-size:8.5px;font-weight:800;border-radius:0}
.bestseller{position:absolute;bottom:0;left:0;right:0;z-index:10;background:rgba(17,24,39,.88);color:#fff;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;text-align:center;padding:5px;border-radius:0}
.btn-wish{position:absolute;top:6px;right:6px;z-index:10;width:32px;height:32px;border:0;background:rgba(255,255,255,.95);color:#9ca3af;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:14px}
.btn-wish.wished{color:var(--rani)}

.p-info{padding:11px 11px 12px;display:flex;flex-direction:column;flex:1;background:#fff;border-radius:0}
.p-brand{font-size:8.5px;font-weight:800;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;margin-bottom:3px}
.p-name{font-size:12.5px;font-weight:600;color:#1f2937;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.rating-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rating-badge{display:inline-flex;align-items:center;gap:3px;background:var(--green);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px}
.rating-badge i{font-size:8px}
.colour-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.swatches{display:flex}
.swatches span{width:12px;height:12px;border-radius:50%;border:1px solid #e5e7eb;margin-left:-4px}
.swatches span:first-child{margin-left:0}
.colour-text{font-size:9.5px;color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.urgency{font-size:9.5px;font-weight:700;color:var(--orange);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.p-price-row{display:flex;align-items:baseline;gap:6px;padding-top:9px;margin-top:auto;border-top:1px solid #f3f4f6;flex-wrap:wrap}
.p-price{font-size:15px;font-weight:800;color:var(--rani)}
.p-old{font-size:10.5px;color:#9ca3af;text-decoration:line-through}
.p-off{font-size:9px;font-weight:800;color:var(--green);background:#f0fdf4;border:1px solid #bbf7d0;padding:2px 6px;border-radius:100px;margin-left:auto}

.skel-card{background:#fff;border:1px solid var(--border);border-radius:0;overflow:hidden}
.skel-img{width:100%;aspect-ratio:1/1}
.skel-box{background:linear-gradient(90deg,#eee 25%,#e0e0e0 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.3s infinite linear}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50vh;text-align:center;padding:20px}
.empty-state i{font-size:44px;color:#E5E7EB;margin-bottom:14px}
.empty-state h3{font-size:18px;font-family:"Playfair Display",serif;margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--muted)}
.pro-toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 18px;border-radius:100px;font-size:12px;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;display:flex;align-items:center;gap:8px;max-width:92%}
.pro-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app-container">
<header class="pro-header">
<button class="icon-btn" onclick="window.location.href='./'"><i class="fa-solid fa-arrow-left"></i></button>
<div class="search-bar"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="searchInput" placeholder="Search kurtis, sarees, lehengas..."></div>
<a href="wishlist" class="icon-btn"><i class="fa-regular fa-heart"></i></a>
<a href="cart" class="icon-btn"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge" id="topCartBadge" style="display:none">0</span></a>
</header>

<div class="cat-scroll-bar" id="categoryTabsContainer">
<div class="cat-pill skel-box" style="width:70px;height:34px;color:transparent;border:0">All</div>
<div class="cat-pill skel-box" style="width:95px;height:34px;color:transparent;border:0">..</div>
</div>

<div class="main-content" id="productsPanel">
<div class="right-header"><h2 id="currentCategoryTitle">All Collection</h2><p id="productCountBadge">Loading...</p></div>
<div class="toolbar-row">
<select id="sortSelect" class="sort-select" onchange="applySort()">
<option value="popular">Sort: Popular</option>
<option value="new">Newest First</option>
<option value="low">Price: Low to High</option>
<option value="high">Price: High to Low</option>
<option value="discount">Discount</option>
<option value="rating">Rating</option>
</select>
<button class="filter-chip-btn" onclick="toggleDiscount(this)"><i class="fa-solid fa-filter"></i> 50%+ Off</button>
</div>
<div class="products-grid" id="productsGrid"></div>
<div id="emptyProductState" class="empty-state" style="display:none"><i class="fa-solid fa-box-open"></i><h3 id="emptyStateTitle">No Products Found</h3><p>Try different search or category.</p></div>
</div>
<div class="pro-toast" id="alertToast"><span>♥</span><span id="toastMsg">Done</span></div>
</div>

<script src="user_data.js"></script>
<script>
let allProducts=[], allCategories=[], currentActiveCategory="All", currentSort="popular", only50Off=false, searchQ="";
function parsePrice(v){return parseInt(String(v??'').replace(/[^0-9]/g,''))||0}
function hashId(s){let h=0;s=String(s);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function meta(p){
 const c=parsePrice(p.price);let o=p.mrp?parsePrice(p.mrp):c+450;
 const d=o>c?Math.round((o-c)/o*100):0;const h=hashId(p.id);
 return {c,o,d,rating:(3.8+(h%12)/10).toFixed(1),stock:2+(h%9),best:(h%5)===0,out:p.outOfStock===true||p.stock===0};
}
function showToast(m){const t=document.getElementById('alertToast');document.getElementById('toastMsg').innerText=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2500);try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
function triggerHaptic(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}

document.addEventListener('DOMContentLoaded',()=>{updateCartBadge();loadData();
 document.getElementById('searchInput').addEventListener('input',e=>{clearTimeout(e.target._d);e.target._d=setTimeout(()=>{searchQ=e.target.value.toLowerCase().trim();filterAndRender()},250)});
});

// NO FIREBASE - only user_data.js
async function loadData(){
 try{
  if(typeof window.getVercelData==='function'){
   allProducts=await window.getVercelData()||[];
  } else { allProducts=[]; }
  // categories auto from products
  const set=new Set();
  allProducts.forEach(p=>{if(p.category)set.add(p.category)});
  allCategories=[...set];
  const urlP=new URLSearchParams(window.location.search);const cp=urlP.get('cat');
  if(cp)currentActiveCategory=decodeURIComponent(cp);
  renderCategories(currentActiveCategory);filterAndRender();
 }catch(e){console.error(e);showToast("Data load error");}
}
function renderCategories(active){
 const bar=document.getElementById('categoryTabsContainer');
 let html=`<div class="cat-pill ${active==='All'?'active':''}" onclick="selectCategory('All',this)">All</div>`;
 allCategories.forEach(c=>{html+=`<div class="cat-pill ${active===c?'active':''}" onclick="selectCategory('${String(c).replace(/'/g,"\\'")}',this)">${c}</div>`});
 bar.innerHTML=html;
}
function selectCategory(name,el){
 triggerHaptic();
 document.querySelectorAll('.cat-pill').forEach(x=>x.classList.remove('active'));el.classList.add('active');
 currentActiveCategory=name;el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
 filterAndRender();document.getElementById('productsPanel').scrollTo({top:0,behavior:'smooth'});
}
function applySort(){currentSort=document.getElementById('sortSelect').value;filterAndRender()}
function toggleDiscount(btn){only50Off=!only50Off;btn.classList.toggle('active',only50Off);filterAndRender()}

function filterAndRender(){
 let base=currentActiveCategory==="All"?[...allProducts]:allProducts.filter(p=>p.category===currentActiveCategory);
 if(searchQ)base=base.filter(p=>(p.name||'').toLowerCase().includes(searchQ));
 if(only50Off)base=base.filter(p=>meta(p).d>=50);
 if(currentSort==='low')base.sort((a,b)=>parsePrice(a.price)-parsePrice(b.price));
 else if(currentSort==='high')base.sort((a,b)=>parsePrice(b.price)-parsePrice(a.price));
 else if(currentSort==='discount')base.sort((a,b)=>meta(b).d-meta(a).d);
 else if(currentSort==='rating')base.sort((a,b)=>meta(b).rating-meta(a).rating);
 renderUI(base, searchQ?`Search: "${searchQ}"`:(currentActiveCategory==="All"?"All Collection":currentActiveCategory));
}

function renderUI(arr,title){
 const grid=document.getElementById('productsGrid'),empty=document.getElementById('emptyProductState');
 document.getElementById('currentCategoryTitle').innerText=title;
 document.getElementById('productCountBadge').innerText=`${arr.length} ITEMS`;
 grid.innerHTML='';
 if(!arr.length){grid.style.display='none';empty.style.display='flex';document.getElementById('emptyStateTitle').innerText=`No ${title} Found`;return}
 grid.style.display='grid';empty.style.display='none';
 let wish=[];try{wish=JSON.parse(localStorage.getItem('aavira_wishlist'))||[]}catch(e){}
 arr.forEach(p=>{
  const m=meta(p);
  const img=p.imageMain||p.image||p.imageUrl||'https://placehold.co/600x600/f5f5f5/cccccc?text=Aavira';
  const isW=wish.includes(String(p.id));
  const cols=Array.isArray(p.colors)?p.colors:[];
  const dots=cols.slice(0,3).map(c2=>{const v=typeof c2==='object'?(c2.hex||c2.code||c2.color||'#ddd'):c2;return `<span style="background:${String(v).replace(/"/g,'')}"></span>`}).join('');
  const card=document.createElement('div');card.className='p-card';
  card.innerHTML=`
   <div class="p-img-wrap" onclick="window.location.href='product?id=${p.id}'">
    <img class="p-img" src="${String(img).replace(/"/g,'&quot;')}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/600x600/f5f5f5/cccccc?text=Aavira'">
    ${m.d>0?`<div class="discount-tag">${m.d}% OFF</div>`:''}
    ${m.d>=20&&!m.out?`<div class="price-drop">PRICE DROP</div>`:''}
    ${m.best?`<div class="bestseller">★ Bestseller</div>`:''}
    <button class="btn-wish ${isW?'wished':''}" onclick="toggleHeart(event,this,'${p.id}')"><i class="${isW?'fa-solid':'fa-regular'} fa-heart"></i></button>
   </div>
   <div class="p-info" onclick="window.location.href='product?id=${p.id}'">
    <div class="p-brand">Aavira Luxe</div>
    <div class="p-name">${p.name||'Aavira Product'}</div>
    <div class="rating-row"><span class="rating-badge"><i class="fa-solid fa-star"></i>${m.rating}</span></div>
    <div class="colour-row"><div class="swatches">${dots}</div><span class="colour-text">${cols.length||1} Colour${(cols.length||1)>1?'s':''}</span></div>
    ${!m.out&&m.stock<=4?`<div class="urgency"><i class="fa-solid fa-fire"></i>Only ${m.stock} left</div>`:''}
    <div class="p-price-row"><span class="p-price">₹${m.c.toLocaleString('en-IN')}</span>${m.d>0?`<span class="p-old">₹${m.o.toLocaleString('en-IN')}</span><span class="p-off">${m.d}% OFF</span>`:''}</div>
   </div>`;
  grid.appendChild(card);
 });
}
function toggleHeart(e,btn,id){
 e.preventDefault();e.stopPropagation();triggerHaptic();
 const icon=btn.querySelector('i');let w=[];try{w=JSON.parse(localStorage.getItem('aavira_wishlist'))||[]}catch(e){}
 const s=String(id);
 if(btn.classList.contains('wished')){btn.classList.remove('wished');icon.classList.replace('fa-solid','fa-regular');w=w.filter(x=>String(x)!==s);showToast("Removed from wishlist");}
 else{btn.classList.add('wished');icon.classList.replace('fa-regular','fa-solid');if(!w.includes(s))w.push(s);showToast("Saved to wishlist ♥");}
 localStorage.setItem('aavira_wishlist',JSON.stringify(w));
}
function updateCartBadge(){
 let cart=[];try{cart=JSON.parse(localStorage.getItem('aavira_cart'))||[]}catch(e){}
 const b=document.getElementById('topCartBadge');const t=cart.reduce((s,i)=>s+(i.qty||1),0);
 b.innerText=t;b.style.display=t>0?'flex':'none';
}
</script>
</body>
</html>
