<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Track Order - Aavira Fashion</title>
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  color-scheme:light;
  --rani:#111113;
  --rani-dark:#000000;
  --gold:#D4AF37;
  --gold-soft:#E7D39A;
  --gold-text:#8A6D1D;
  --ivory:#FFFFFF;
  --cream:#F8F8FA;
  --ink:#111113;
  --mid:#4A4F55;
  --muted:#6E6E73;
  --line:#E5E5EA;
  --blush:#F2F2F7;
  --plum:#111113;
  --plum2:#1C1C1E;
  --green:#15803D;
  --green-soft:#ECFDF5;
  --green-border:#BBF7D0;
  --danger:#DC2626;
  --danger-dark:#B91C1C;
  --amber:#B45309;
  --ease:cubic-bezier(.22,1,.36,1);
  --ios-spring:cubic-bezier(.32,.72,0,1);
  --font-main:"Barlow Condensed","Roboto Condensed",system-ui,sans-serif;
  --font-sub:Inter,system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#FFFFFF!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--font-main);
  letter-spacing:.015em;
  background:#FFFFFF!important;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{
  font-family:inherit;
  letter-spacing:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
}
input{cursor:text}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--rani);outline-offset:2px}

/* App Shell: 420px Pure White Container (No Bottom Navigation Bar) */
.app{
  max-width:420px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#FFFFFF!important;
  position:relative;
  overflow:hidden;
}
@media(min-width:640px){
  body{background:#F5F5F7!important}
  .app{box-shadow:0 0 50px rgba(0,0,0,.06);border-inline:1px solid #EBEBEF}
}

/* Compact Solid White Header */
.hdr{
  display:grid;
  grid-template-columns:40px 1fr 40px;
  align-items:center;
  height:calc(50px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 10px 0;
  background:#FFFFFF!important;
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
  position:relative;
  z-index:10;
}
.hdr h1{
  font-family:var(--font-main);
  font-size:19px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  text-align:center;
  color:var(--ink);
}
.ib,
.ib.back{
  width:36px;
  height:36px;
  border:1px solid #EBEBEF;
  background:#F8F8FA!important;
  border-radius:50%!important;
  box-shadow:none!important;
  color:var(--ink)!important;
  font-size:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .15s,background .18s,border-color .18s;
}
.ib:hover,.ib:active,.ib.back:hover,.ib.back:active{
  background:#EFEFF4!important;
  border-color:#D4D4D8!important;
  color:var(--ink)!important;
  transform:scale(.92);
}
svg.lucide{width:1em;height:1em;flex-shrink:0}
.is-spinning{animation:spin .65s linear infinite}

.brand{display:flex;align-items:center;justify-content:center;min-width:0}
.brand img{height:28px;max-width:110px;object-fit:contain;display:block;border:0;background:none;border-radius:0}
.brand .wm{font-family:var(--font-main);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.brand .wm em{font-style:normal;color:var(--gold-text)}

/* Cards & Order Containers */
.card{
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:none!important;
}
.oc{
  cursor:pointer;
  animation:rise .35s var(--ease) backwards;
  transition:border-color .2s,transform .18s;
}
@media(hover:hover){.oc:hover{border-color:#111113}}
.oc:active{transform:scale(.99)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.oc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #F2F2F7}
.lbl{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.oid{font-size:15.5px;font-weight:700;letter-spacing:.02em;color:var(--ink)}

.oc-body{display:flex;gap:12px;align-items:stretch}
.thumb{position:relative;flex:0 0 auto;width:96px;height:96px;aspect-ratio:1/1}
.thumb img,.thumb .ph{
  width:96px!important;
  height:96px!important;
  aspect-ratio:1/1!important;
  border-radius:0!important;
  object-fit:cover;
  object-position:top;
  background:#F4F4F6;
  border:1px solid #EBEBEF;
  display:block;
}
.thumb .cnt{
  position:absolute;
  right:4px;
  bottom:4px;
  background:rgba(17,17,19,.9);
  color:#FFFFFF;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
  border-radius:999px;
  padding:2px 7px;
  border:1px solid rgba(255,255,255,.8);
}
.ph{display:flex;align-items:center;justify-content:center;color:#9A9298;font-size:24px}

.oc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{
  font-size:15.5px;
  font-weight:600;
  color:var(--ink);
  line-height:1.25;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.meta{font-family:var(--font-sub);font-size:12px;color:var(--muted);font-weight:500}
.price{margin-top:auto;font-size:18px;font-weight:700;color:var(--ink);line-height:1}

/* Status Badges — Out for Delivery & Delivered Both in Professional GREEN (Never Red) */
.badge{
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:999px;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-Processing{background:#EFF6FF;color:#1D4ED8;border:1px solid #DBEAFE}
.b-Confirmed{background:#F4F4F6;color:#111113;border:1px solid #E5E5EA}
.b-Shipped{background:#FEF3C7;color:var(--amber);border:1px solid #FDE68A}
.b-OutforDelivery{background:var(--green-soft);color:var(--green);border:1px solid var(--green-border)}
.b-Delivered{background:var(--green-soft);color:var(--green);border:1px solid var(--green-border)}
.b-Cancelled{background:#F3F4F6;color:#6B7280;border:1px solid #E5E7EB}

/* Mini Progress Bar inside Order Card */
.mt{margin:14px 4px 0}
.mt-line{position:relative;height:3px;border-radius:3px;background:var(--line)}
.mt-line>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--rani))}
.mt-line>i.is-green{background:linear-gradient(90deg,#22C55E,var(--green))}
.mt-line>b{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#FFFFFF;border:2px solid var(--line);transform:translate(-50%,-50%)}
.mt-line>b.on{border-color:var(--rani);background:var(--rani)}
.mt-line>b.on.is-green{border-color:var(--green);background:var(--green)}
.mt-lbl{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.mt-lbl strong{font-size:12px;color:var(--ink);font-weight:700}
.mt-lbl strong.is-green{color:var(--green)}
.mt.bad .mt-line>i{background:#D1D5DB}
.mt.bad span{font-size:12px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.04em}

.oc-bot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px dashed var(--line);
  font-size:13px;
  font-weight:600;
  color:var(--muted);
}
.oc-bot span{display:inline-flex;align-items:center;gap:6px}
.go{color:var(--ink);font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
.go svg,.go i{font-size:12px}

.skel{
  height:210px;
  border-radius:14px;
  border:1px solid #EBEBEF;
  background:linear-gradient(90deg,#F1EBE3 25%,#FAF6F0 37%,#F1EBE3 63%);
  background-size:400% 100%;
  animation:sh 1.4s infinite;
  margin-bottom:12px;
}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

/* Footer */
.foot{margin-top:8px;text-align:center;padding:24px 14px 12px;border-top:1px solid var(--line)}
.foot .brand img{height:38px;max-width:150px;filter:brightness(0)}
.foot .brand .wm{font-size:22px;color:#000}
.foot .ty{font-family:var(--font-main);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-top:12px;color:var(--ink)}
.foot .ty::after{content:"";display:block;width:32px;height:2px;background:var(--gold);margin:8px auto 0}
.foot p{font-family:var(--font-sub);font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.foot .links{display:flex;justify-content:center;gap:18px;margin-top:12px}
.foot .links a,.foot .links button{
  background:none;
  border:0;
  font-size:13px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  text-decoration:underline;
  text-underline-offset:3px;
}
.foot .copy{font-size:11.5px;margin-top:12px;color:#9A9298}

/* Main Tracking View (#dv) */
.app>.hdr,.searchbar,.head,.tabs,#list{display:none!important}
.dv{
  position:relative;
  flex:1;
  min-height:0;
  z-index:30;
  background:#FFFFFF!important;
  display:flex;
  flex-direction:column;
  transform:none;
  visibility:visible;
}
.dv-body{
  flex:1;
  overflow-y:auto;
  scrollbar-width:none;
  background:#FFFFFF!important;
  padding:14px 14px calc(32px + env(safe-area-inset-bottom,0px));
  -webkit-overflow-scrolling:touch;
}
.dv-body::-webkit-scrollbar{display:none}
.h3{
  font-family:var(--font-main);
  font-size:17px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  margin-bottom:12px;
}

/* Track Order Form Styling */
.trk-card{
  background:linear-gradient(180deg,#FAF8F5 0%,#FFFFFF 100%);
  border:1px solid #EBEBEF;
  border-radius:16px;
  padding:18px 16px;
  margin-bottom:12px;
}
.trk-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.trk-ic{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:50%;
  background:#FFFFFF;
  border:1.5px solid var(--ink);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}
.trk-head h3{
  font-family:var(--font-main);
  font-size:21px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:var(--ink);
  margin:0;
  line-height:1.1;
}
.trk-head p{
  font-family:var(--font-sub);
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}
.tl{
  display:block;
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink);
  margin:14px 0 6px;
}
.tf-wrap{position:relative}
.tf-wrap>i,.tf-wrap>svg.lucide{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  width:15px;
  height:15px;
  color:var(--muted);
  pointer-events:none;
}
.tf{
  width:100%;
  height:46px;
  border:1.2px solid #D4D4D8;
  border-radius:12px;
  padding:0 14px 0 38px;
  font-family:var(--font-sub);
  font-size:14.5px;
  font-weight:500;
  color:var(--ink);
  outline:none;
  background:#FFFFFF;
  transition:border-color .2s,box-shadow .2s;
}
.tf::placeholder{color:#A1A1AA}
.tf:focus{border-color:var(--rani);box-shadow:0 0 0 3px rgba(17,17,19,.08)}
.terr{
  margin-top:12px;
  font-family:var(--font-sub);
  font-size:12.5px;
  font-weight:600;
  line-height:1.45;
  color:var(--danger-dark);
  background:#FEF2F2;
  border:1px solid #FECACA;
  border-radius:12px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.terr svg{width:16px;height:16px;color:var(--danger);flex-shrink:0}

/* Account Sign-In Strip inside Track View */
.trk-auth-strip{
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.trk-auth-l{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.trk-auth-ic{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:50%;
  background:#F7F7FA;
  border:1px solid #E5E5EA;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.trk-auth-ic svg{width:17px;height:17px;stroke-width:1.85}
.trk-auth-txt b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:var(--ink);
  line-height:1.15;
}
.trk-auth-txt small{
  display:block;
  font-family:var(--font-sub);
  font-size:11.5px;
  color:var(--muted);
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.trk-auth-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.trk-pill-btn{
  height:34px;
  padding:0 13px;
  border-radius:999px;
  background:#000000;
  border:1.2px solid #000000;
  color:#FFFFFF;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
}
.trk-pill-btn.outline{
  background:#FFFFFF;
  color:var(--ink);
  border-color:#D4D4D8;
}

/* Order Tracking Hero Card inside Detail View */
.hero{
  position:relative;
  overflow:hidden;
  border-radius:16px;
  padding:18px 16px 20px;
  margin-bottom:12px;
  color:#FFFFFF;
  background:linear-gradient(135deg,#111113 0%,#1F1F24 50%,#111113 100%);
  border:1px solid rgba(212,175,55,.32);
}
.hero.ok{background:linear-gradient(135deg,#0F2A1B,#14532D,#166534);border-color:rgba(34,197,94,.4)}
.hero.no{background:linear-gradient(135deg,#27272A,#3F3F46,#27272A);border-color:rgba(255,255,255,.15)}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero .lbl{color:rgba(255,255,255,.65)}
.hero .oid{color:#FFFFFF;font-size:15px;letter-spacing:.03em}
.idrow{display:flex;align-items:center;gap:8px}
.idcp{
  width:26px;
  height:26px;
  border:0;
  border-radius:6px;
  background:rgba(255,255,255,.14);
  color:#FFFFFF;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.idcp:active{background:rgba(255,255,255,.28)}
.pill-live{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  background:rgba(22,163,74,.25);
  border:1px solid rgba(74,222,128,.45);
  color:#FFFFFF;
  border-radius:999px;
  padding:4px 10px;
}
.pill-live i{width:7px;height:7px;border-radius:50%;background:#4ADE80;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hero h3{
  position:relative;
  font-family:var(--font-main);
  font-size:25px;
  font-weight:700;
  letter-spacing:.02em;
  text-transform:uppercase;
  margin:14px 0 4px;
  line-height:1.1;
}
.hero .sub{position:relative;font-family:var(--font-sub);font-size:13px;color:rgba(255,255,255,.85);line-height:1.45}
.hero .placed{position:relative;font-size:12px;color:rgba(255,255,255,.65);margin-top:14px;letter-spacing:.03em;text-transform:uppercase}
.hero .eta-pill{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  padding:8px 12px;
  font-size:13px;
}
.hero .eta-pill i,.hero .eta-pill svg{color:#4ADE80}

/* 5-Step Progress Stepper inside Hero */
.sp{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin-top:20px}
.sp-track{position:absolute;left:10%;right:10%;top:15px;height:2.5px;border-radius:3px;background:rgba(255,255,255,.2)}
.sp-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,var(--gold),#4ADE80);transition:width 1s var(--ease) .12s}
.sp-s{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.sp-c{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#27272C;
  border:1.5px solid rgba(255,255,255,.24);
  color:rgba(255,255,255,.6);
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sp-s.done .sp-c{background:var(--gold);border-color:var(--gold);color:#111113}
.sp-s.cur .sp-c{background:#22C55E;border-color:#22C55E;color:#FFFFFF;animation:glow 2s infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.hero.ok .sp-s.done .sp-c,.hero.ok .sp-s.cur .sp-c{background:#22C55E;border-color:#22C55E;color:#FFFFFF;animation:none}
.sp-l{font-size:10.5px;line-height:1.2;color:rgba(255,255,255,.6);max-width:62px;text-transform:uppercase;letter-spacing:.03em}
.sp-s.done .sp-l,.sp-s.cur .sp-l{color:#FFFFFF;font-weight:700}

/* Delivery Partner Card */
.cour{display:flex;align-items:center;gap:12px}
.cour-ic{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--cream);
  border:1px solid var(--line);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex:0 0 auto;
}
.cour b{font-size:15px;font-weight:700;display:block;color:var(--ink)}
.cour small{font-family:var(--font-sub);font-size:12px;color:var(--muted)}
.cour .cp{
  margin-left:auto;
  background:var(--cream);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
}

/* Order Items in Detail View: 1:1 Sharp Square Product Photos */
.it{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.it:first-of-type{padding-top:0}
.it:last-child{border:0;padding-bottom:0}
.it .pic{
  position:relative;
  flex:0 0 auto;
  width:112px;
  height:112px;
  aspect-ratio:1/1;
  display:block;
  border-radius:0!important;
  overflow:hidden;
  box-shadow:none!important;
  border:1px solid #EBEBEF;
  background:#F4F4F6;
  text-decoration:none;
}
.it .pic img,.it .pic .ph{
  width:112px!important;
  height:112px!important;
  aspect-ratio:1/1!important;
  border-radius:0!important;
  border:0;
  display:block;
  object-fit:cover;
  object-position:top;
  transition:transform .35s ease;
}
.it a.pic:active img{transform:scale(1.04)}
.it .pic .view{
  position:absolute;
  left:6px;
  right:6px;
  bottom:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:4px 6px;
  border-radius:999px;
  background:rgba(255,255,255,.94);
  color:var(--ink);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.it .pic .view i,.it .pic .view svg{color:var(--ink);font-size:11px}
.it-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:1px}
.it h4{font-size:15.5px;font-weight:600;line-height:1.25;color:var(--ink)}
.it-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.it-tag{
  background:var(--cream);
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 8px;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
  color:var(--mid);
}
.it-color-pill{
  display:inline-flex;
  align-items:center;
  padding:2px 10px 2px 8px;
  border-radius:999px;
  background:linear-gradient(90deg,#EFEAE1 0%,rgba(239,234,225,.82) 68%,rgba(239,234,225,.12) 100%);
  color:#3A3532;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  box-shadow:-2px 3px 8px -2px rgba(0,0,0,.12),inset 1.5px 0 0 rgba(212,175,55,.65);
}
.it .ip{margin-top:auto;font-size:18px;font-weight:700;color:var(--ink)}

/* Key-Value Summary Rows */
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);font-weight:500;margin-bottom:8px}
.kv.save{color:var(--green);font-weight:700}
.kv.tot{
  margin:10px 0 0;
  padding-top:10px;
  border-top:1px dashed var(--line);
  font-size:17px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.02em;
  color:var(--ink);
}
.addr b{font-size:15px;font-weight:700;color:var(--ink)}
.addr p{font-family:var(--font-sub);font-size:13px;color:var(--muted);line-height:1.45;margin-top:3px}
.addr .cpy{
  margin-top:10px;
  background:var(--cream);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 14px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.pay{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}

/* Action Buttons */
.btn{
  width:100%;
  height:44px;
  padding:0 16px;
  border-radius:999px;
  border:0;
  font-size:14px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--rani);color:#FFFFFF}
.btn.k{background:var(--ink);color:#FFFFFF}
.btn.l{background:#FFFFFF;border:1px solid var(--line);color:var(--ink)}
.btn.d{background:#FEF2F2;border:1px solid #FECACA;color:var(--danger)}

/* Quick Actions Row */
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qa button{
  background:#FFFFFF;
  border:1px solid #EBEBEF;
  border-radius:12px;
  padding:11px 4px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.qa button:active{transform:scale(.97)}
.qa i,.qa svg{font-size:16px;color:var(--ink)}

/* Invoice Modal Sheet */
.mo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9500;background:rgba(0,0,0,.52);display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex}
.sheet{
  width:100%;
  max-width:420px;
  max-height:90dvh;
  overflow-y:auto;
  background:#FFFFFF;
  border-radius:24px 24px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));
  animation:rise .28s var(--ease);
}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inv{border:1px dashed var(--line);border-radius:12px;padding:14px;margin:12px 0;font-size:13.5px}
.inv .brand img{height:38px}

/* ============================================================================
   IN-PAGE LOGIN / SIGN UP / OTP / GOOGLE AUTH ENGINE (#authPopupModal)
   ============================================================================ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9990;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.scrim.is-open{opacity:1;visibility:visible;transition-delay:0s}
.layer{position:fixed;z-index:10000;visibility:hidden;pointer-events:none;transition:transform .38s var(--ease),opacity .3s,visibility 0s .38s}
.layer.is-open{visibility:visible;pointer-events:auto;transform:none;opacity:1;transition-delay:0s}
.sec-eyebrow{display:block;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text);margin-bottom:4px}
#authPopupModal{
  top:50%;
  left:50%;
  right:auto;
  bottom:auto;
  width:calc(100% - 28px);
  max-width:380px;
  max-height:92dvh;
  overflow-y:auto;
  background:#FFFFFF;
  border:1px solid #E5E5EA;
  border-radius:24px;
  padding:22px 18px 18px;
  box-shadow:0 24px 60px rgba(0,0,0,.28);
  transform:translate(-50%,-46%) scale(.94);
  opacity:0;
  transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .32s ease,visibility 0s .42s;
}
#authPopupModal.is-open{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
  transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .32s ease,visibility 0s 0s;
}
.ios-auth-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.ios-auth-close{width:32px;height:32px;flex:0 0 32px;border-radius:50%;border:1px solid #E5E5EA;background:#F8F8FA;color:#111113;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ios-auth-close svg{width:15px;height:15px;stroke-width:2.2}
.ios-auth-head h2{font-size:23px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#111113;line-height:1.15}
.ios-auth-head p{font-family:var(--font-sub);margin:3px 0 0;font-size:12.5px;color:var(--muted)}

/* RED ERROR ALERT INSIDE LOGIN POPUP (Automatic 30s Cooldown on >3 Requests or Auth Error) */
.auth-err-alert{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 13px;
  margin-bottom:12px;
  border-radius:13px;
  background:linear-gradient(135deg,#FEF2F2,#FEE2E2);
  border:1.5px solid #EF4444;
  color:#B91C1C;
  box-shadow:0 6px 16px -6px rgba(220,38,38,.25);
}
.auth-err-alert.on{
  display:flex;
  animation:errShake .38s cubic-bezier(.36,.07,.19,.97);
}
.auth-err-l{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.auth-err-l svg{width:18px;height:18px;color:#DC2626;flex-shrink:0;stroke-width:2.2}
.auth-err-txt{font-family:var(--font-sub);font-size:12.5px;font-weight:600;line-height:1.35;color:#B91C1C}
.auth-err-timer{padding:3px 8px;border-radius:999px;background:#DC2626;color:#FFFFFF;font-size:11.5px;font-weight:700;letter-spacing:.04em;flex-shrink:0}
@keyframes errShake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-5px)}
  40%,80%{transform:translateX(5px)}
}

.ios-seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;background:#F2F2F7;border-radius:12px;margin-bottom:12px}
.ios-seg-btn{height:34px;border:0;border-radius:9.5px;background:transparent;font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);transition:background .25s var(--ios-spring),color .25s,box-shadow .25s}
.ios-seg-btn[aria-selected="true"]{background:#FFFFFF;color:#111113;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ios-group{background:#F8F8FA;border:1.5px solid #E5E5EA;border-radius:14px;overflow:hidden;margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
.ios-group.is-err{border-color:#EF4444!important;box-shadow:0 0 0 3px rgba(239,68,68,.14)}
.ios-group.is-err .ios-row{background:#FFF8F8}
.ios-group.is-err .ios-row label{color:#B91C1C}
.ios-row{display:flex;align-items:center;padding:0 14px;min-height:46px;background:#FFFFFF}
.ios-row+.ios-row{border-top:1px solid #ECECF2}
.ios-row label{flex:0 0 78px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#111113}
.ios-row input{flex:1;min-width:0;height:46px;border:0;outline:0;background:transparent;font-family:var(--font-sub);font-size:14px;font-weight:500;color:#111113}
.ios-row input::placeholder{color:#A1A1AA}
.ios-sub-links{display:flex;align-items:center;justify-content:flex-end;margin:-2px 2px 10px}
.ios-auth-submit{width:100%;height:44px;border:0;border-radius:12px;background:#000000;color:#FFFFFF;font-size:14.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .15s}
.ios-auth-submit:active{transform:scale(.98)}
.ios-auth-submit:disabled{opacity:.65;cursor:not-allowed}
.ios-auth-submit.is-rate-locked{background:#DC2626!important;color:#FFFFFF!important}
.ios-auth-submit svg{width:15px;height:15px}
.ios-auth-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.ios-auth-link{background:none;border:0;padding:0;color:#111113;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-decoration:underline;font-size:12px;cursor:pointer}
.ios-eye-btn{width:30px;height:30px;flex:0 0 30px;border:0;background:transparent;color:#7D828A;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ios-eye-btn svg{width:15px;height:15px}
.ios-or{display:flex;align-items:center;gap:10px;margin:10px 0;color:#8E8E93;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ios-or::before,.ios-or::after{content:"";flex:1;height:1px;background:#E5E5EA}
.ios-btn-stack{display:flex;flex-direction:column;gap:8px}
.ios-google-btn{width:100%;height:42px;border-radius:12px;border:1px solid #E5E5EA;background:#FFFFFF;color:#111113;font-size:13.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,border-color .2s}
@media(hover:hover){.ios-google-btn:hover{border-color:#111113}}
.ios-google-btn img{width:16px;height:16px;object-fit:contain}
.view-hidden{display:none!important}
.view-active{display:block;animation:iosAuthFade .25s var(--ease)}
@keyframes iosAuthFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ios-otp-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0 12px}
.otp-box{width:100%;height:44px;text-align:center;font-family:var(--font-main);font-size:19px;font-weight:700;color:#111113;background:#F8F8FA;border:1.5px solid #E5E5EA;border-radius:10px;outline:none}
.otp-box:focus{border-color:#111113;background:#FFFFFF}
.otp-box-filled{border-color:#111113!important;background:#FFFFFF!important}
.ios-otp-row.is-err .otp-box{border-color:#EF4444!important;background:#FFF5F5!important;color:#B91C1C!important}
.mini-spin{width:15px;height:15px;border:2px solid rgba(17,17,17,.18);border-top-color:#111113;border-radius:50%;display:inline-block;flex:0 0 15px;animation:spin .55s linear infinite}
.mini-spin.white{border-color:rgba(255,255,255,.35);border-top-color:#FFFFFF}
.mini-spin.rani{border-color:rgba(17,17,17,.2);border-top-color:#111113}

/* Unified Top Pill Toast */
.toast{
  position:fixed;
  left:50%;
  top:calc(58px + env(safe-area-inset-top,0px));
  bottom:auto;
  transform:translate(-50%,-16px);
  opacity:0;
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,#16A34A,#15803D);
  color:#FFFFFF;
  font-family:var(--font-sub);
  font-size:13px;
  font-weight:600;
  line-height:1.4;
  text-align:left;
  padding:10px 18px 10px 12px;
  border-radius:999px;
  box-shadow:0 10px 28px rgba(0,0,0,.32);
  z-index:10060;
  pointer-events:none;
  transition:opacity .25s,transform .25s var(--ease);
  max-width:min(320px,88%);
}
.toast::before{
  content:"\2713";
  width:21px;
  height:21px;
  flex:0 0 21px;
  border-radius:50%;
  background:#FFFFFF;
  color:#16A34A;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
}
.toast[data-type="error"]{background:linear-gradient(135deg,#DC2626,#B91C1C)}
.toast[data-type="error"]::before{content:"!";color:#DC2626}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Action-button loading spinner */
.is-busy{position:relative;pointer-events:none;color:transparent!important}
.is-busy>*{opacity:0}
.is-busy::after{
  content:"";
  box-sizing:border-box;
  position:absolute;
  left:50%;
  top:50%;
  width:16px;
  height:16px;
  margin:-8px 0 0 -8px;
  border:2px solid var(--spin,var(--rani));
  border-top-color:transparent;
  border-radius:50%;
  animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.p,.btn.k,.idcp,.trk-pill-btn:not(.outline){--spin:#fff}
.ib.back,.ib,.trk-pill-btn.outline{--spin:#111113}
.btn.d{--spin:var(--danger)}
.idcp.is-busy::after{width:12px;height:12px;margin:-6px 0 0 -6px}
.foot .links a{display:inline-block}

@media print{
  .app>*:not(.mo){display:none!important}
  .mo{position:static;background:none;display:block}
  .sheet{max-height:none;max-width:none;padding:0}
  .sheet button{display:none!important}
}
@media (prefers-reduced-motion:reduce){
  .is-busy::after,.is-spinning{animation-duration:.8s!important;animation-iteration-count:infinite!important}
  *,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="scrim" class="scrim" onclick="closeAuthPopup()"></div>

<!-- IN-PAGE LOGIN / SIGNUP / OTP / RESET POPUP ENGINE -->
<div id="authPopupModal" class="layer" role="dialog" aria-modal="true" aria-labelledby="homeAuthTitle">
  <div class="ios-auth-top">
    <div class="ios-auth-head">
      <span class="sec-eyebrow" id="homeAuthEyebrow" style="margin-bottom:2px">Aavira Account</span>
      <h2 id="homeAuthTitle">Welcome Back</h2>
      <p id="homeAuthSub">Login to track &amp; manage your orders</p>
    </div>
    <button type="button" class="ios-auth-close" onclick="closeAuthPopup()" aria-label="Close"><i data-lucide="x"></i></button>
  </div>

  <!-- RED ERROR BANNER INSIDE LOGIN POPUP (Automatic 30s Cooldown on >3 Requests or Auth Error) -->
  <div id="authPopupErrorBox" class="auth-err-alert" role="alert" aria-live="assertive">
    <div class="auth-err-l">
      <i data-lucide="alert-octagon"></i>
      <span class="auth-err-txt" id="authPopupErrorText">Too many requests! Please wait 30s before trying again.</span>
    </div>
    <span class="auth-err-timer" id="authPopupErrorTimer" hidden>30s</span>
  </div>

  <div class="ios-seg" id="homeAuthSeg" role="tablist" aria-label="Authentication mode">
    <button type="button" class="ios-seg-btn" id="tabBtnLogin" role="tab" aria-selected="true" onclick="switchView('loginView')">Log In</button>
    <button type="button" class="ios-seg-btn" id="tabBtnSignup" role="tab" aria-selected="false" onclick="switchView('signupView')">Sign Up</button>
  </div>

  <!-- LOGIN VIEW -->
  <div id="loginView" class="view-active">
    <div class="ios-group" id="loginInputGroup">
      <div class="ios-row">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" placeholder="Email or Phone Number" oninput="clearAuthPopupError()">
      </div>
      <div class="ios-row">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Enter password" oninput="clearAuthPopupError()">
        <button type="button" class="ios-eye-btn" id="btnLoginEye" onclick="togglePassword('loginPassword','btnLoginEye')" aria-label="Toggle password"><i data-lucide="eye-off"></i></button>
      </div>
    </div>
    <div class="ios-sub-links">
      <button type="button" class="ios-auth-link" onclick="switchView('forgotView')">Forgot Password?</button>
    </div>
    <button type="button" id="btnLoginAction" class="ios-auth-submit" onclick="processLogin()"><span>Log In</span><i data-lucide="arrow-right"></i></button>
    <div class="ios-or">Or</div>
    <div class="ios-btn-stack">
      <button type="button" id="btnGoogleLogin" class="ios-google-btn" onclick="performGoogleLogin('btnGoogleLogin')">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
        <span>Continue with Google</span>
      </button>
    </div>
  </div>

  <!-- SIGNUP VIEW -->
  <div id="signupView" class="view-hidden">
    <div class="ios-group" id="signupInputGroup">
      <div class="ios-row">
        <label for="signupName">Name</label>
        <input type="text" id="signupName" autocomplete="name" placeholder="Full Name" oninput="clearAuthPopupError()">
      </div>
      <div class="ios-row">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" autocomplete="email" placeholder="Email Address" oninput="clearAuthPopupError()">
      </div>
      <div class="ios-row">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" autocomplete="new-password" placeholder="Create Password (min 6 chars)" oninput="clearAuthPopupError()">
        <button type="button" class="ios-eye-btn" id="btnSignupEye" onclick="togglePassword('signupPassword','btnSignupEye')" aria-label="Toggle password"><i data-lucide="eye-off"></i></button>
      </div>
    </div>
    <button type="button" id="btnSignupAction" class="ios-auth-submit" onclick="processSignup()"><span>Create Account</span><i data-lucide="arrow-right"></i></button>
    <div class="ios-or">Or</div>
    <div class="ios-btn-stack">
      <button type="button" id="btnGoogleSignup" class="ios-google-btn" onclick="performGoogleLogin('btnGoogleSignup')">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
        <span>Continue with Google</span>
      </button>
    </div>
  </div>

  <!-- OTP VIEW -->
  <div id="otpView" class="view-hidden">
    <p id="otpSubText" style="margin:0 0 6px;font-family:var(--font-sub);font-size:12.5px;color:var(--muted);text-align:center">Enter the 6-digit code sent to your email</p>
    <div id="otpBoxGroup" class="ios-otp-row">
      <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" class="otp-box" aria-label="Digit 1">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 2">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 3">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 4">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 5">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-box" aria-label="Digit 6">
    </div>
    <button type="button" id="btnOtpAction" class="ios-auth-submit" onclick="verifySignupOTP()"><span>Verify &amp; Login</span><i data-lucide="check-circle"></i></button>
    <div class="ios-auth-foot">
      <button type="button" class="ios-auth-link" onclick="resendSignupOTP()">Resend OTP</button>
      <button type="button" class="ios-auth-link" onclick="switchView('signupView')">Change Email</button>
    </div>
  </div>

  <!-- FORGOT PASSWORD VIEW -->
  <div id="forgotView" class="view-hidden">
    <div class="ios-group" id="forgotInputGroup">
      <div class="ios-row">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" autocomplete="email" placeholder="Registered Email Address" oninput="clearAuthPopupError()">
      </div>
    </div>
    <button type="button" id="btnForgotAction" class="ios-auth-submit" onclick="processForgotPassword()"><span>Send Reset Code</span><i data-lucide="mail"></i></button>
    <div class="ios-auth-foot" style="justify-content:center">
      <button type="button" class="ios-auth-link" onclick="switchView('loginView')">Back to Login</button>
    </div>

/* Load cached product catalog to resolve exact Admin Panel colour names & photos */
const splitColorNames = val => {
  if (!val) return [];
  if (Array.isArray(val)) {
    return val.flatMap(item => {
      if (item && typeof item === 'object') {
        const n = item.name ?? item.color ?? item.colour ?? item.colorName ?? item.colourName ?? item.label ?? item.title ?? '';
        return String(n).trim() ? [String(n).trim()] : [];
      }
      return String(item ?? '').split(/[,|\n]+/).map(s => s.trim()).filter(Boolean);
    });
  }
  if (typeof val === 'string') {
    const trimmed = val.trim();
    if (!trimmed) return [];
    if (trimmed.startsWith('[')) {
      try { return splitColorNames(JSON.parse(trimmed)); } catch (e) {}
    }
    return trimmed.split(/[,|\n]+/).map(s => s.trim()).filter(Boolean);
  }
  return [];
};

const getProductColorList = raw => {
  if (!raw) return [];
  const mainImg = String(raw.imageMain || raw.image || raw.imageUrl || raw.img || '').trim();
  const nameSources = [
    raw.colors, raw.colours, raw.colorNames, raw.colourNames,
    raw.colorsName, raw.coloursName, raw.colorsInfo, raw.coloursInfo,
    raw.colorInfo, raw.colourInfo, raw.colorLabels, raw.colourLabels,
    raw.color, raw.colour
  ];
  let names = [];
  for (const src of nameSources) {
    const list = splitColorNames(src);
    if (list.length > names.length) names = list;
  }
  const rawImgs = Array.isArray(raw.colorImages)
    ? raw.colorImages
    : (Array.isArray(raw.colourImages) ? raw.colourImages : []);
  const imgs = rawImgs
    .map(it => (it && typeof it === 'object') ? (it.image ?? it.img ?? it.imageUrl ?? it.url ?? '') : String(it ?? '').trim())
    .filter(Boolean);

  if (imgs.length > 0) {
    if (names.length === imgs.length + 1 && mainImg && !imgs.includes(mainImg)) {
      return [
        { name: names[0] || '', image: mainImg },
        ...imgs.map((url, i) => ({ name: names[i + 1] || '', image: url }))
      ];
    }
    return imgs.map((url, i) => ({ name: names[i] || '', image: url }));
  }
  if (names.length > 0) return names.map(n => ({ name: n, image: mainImg }));
  return [];
};

  let image = String(item.image || item.imageMain || item.img || '').trim();

  if (/^https?:|data:image|\//.test(color)) color = 'As Shown';

  if (pid && S.catalog.length) {
    const prod = S.catalog.find(p => String(p.id ?? p._id ?? p.productId ?? '') === pid);

        const byImg = colorList.find(c => c.image && c.image === image);

const AUTH_CONFIG = {
  GOOGLE_CLIENT_ID: "247971292356-8906dpm406huv7uidlblhjum8vg3dfj3.apps.googleusercontent.com",
  GOOGLE_PROMPT_TIMEOUT_MS: 30000,
  OTP_LENGTH: 6,
  MIN_PASSWORD_LENGTH: 6,
  AUTO_SUBMIT_DELAY_MS: 150,
  MAX_ATTEMPTS_ALLOWED: 3,
  RATE_LIMIT_WINDOW_MS: 30000,
  COOLDOWN_SECONDS: 30,
  STORAGE_KEYS: {
    NAME: 'aavira_display_name',
    EMAIL: 'aavira_user_email',
    ATTEMPTS: 'aavira_auth_attempts',
    LOCK_UNTIL: 'aavira_auth_lock_until'

};

function getLockUntil() {
  try { return Number(sessionStorage.getItem(AUTH_CONFIG.STORAGE_KEYS.LOCK_UNTIL)) || 0; } catch { return 0; }
}
function setLockUntil(ts) {
  try {
    if (ts > 0) sessionStorage.setItem(AUTH_CONFIG.STORAGE_KEYS.LOCK_UNTIL, String(ts));
    else sessionStorage.removeItem(AUTH_CONFIG.STORAGE_KEYS.LOCK_UNTIL);
  } catch {}
}
function getRecentAttempts() {
  try {
    const raw = JSON.parse(sessionStorage.getItem(AUTH_CONFIG.STORAGE_KEYS.ATTEMPTS) || '[]');
    const now = Date.now();
    return (Array.isArray(raw) ? raw : []).filter(t => now - t < AUTH_CONFIG.RATE_LIMIT_WINDOW_MS);
  } catch {
    return [];
  }
}
function saveRecentAttempts(list) {
  try { sessionStorage.setItem(AUTH_CONFIG.STORAGE_KEYS.ATTEMPTS, JSON.stringify(list)); } catch {}
}

function clearAuthPopupError() {
  if (Date.now() < getLockUntil()) return;
  const box = document.getElementById('authPopupErrorBox');

}

function showAuthPopupError(message, opts = {}) {
  const box = document.getElementById('authPopupErrorBox');
  const txt = document.getElementById('authPopupErrorText');
  const timerBadge = document.getElementById('authPopupErrorTimer');
  if (!box || !txt) return;

  txt.textContent = message;
  if (opts.countdownSec && timerBadge) {
    timerBadge.hidden = false;
    timerBadge.textContent = opts.countdownSec + 's';
  } else if (timerBadge) {
    timerBadge.hidden = true;
  }

  box.classList.remove('on');
  void box.offsetWidth;
  box.classList.add('on');

  if (opts.groupId) {
    document.getElementById(opts.groupId)?.classList.add('is-err');
  } else {
    const activeView = document.querySelector('#authPopupModal .view-active');
    activeView?.querySelector('.ios-group, .ios-otp-row')?.classList.add('is-err');
  }

  navigator.vibrate?.([50, 30, 50]);
  icons();
}

function startRateLimitLockdown(customMessage, durationSec = AUTH_CONFIG.COOLDOWN_SECONDS) {
  const until = Date.now() + durationSec * 1000;
  setLockUntil(until);
  clearInterval(rateLimitTimer);

  const msg = customMessage || `Too many requests! Please wait ${durationSec}s before trying again.`;
  const updateLockUI = () => {
    const lockUntil = getLockUntil();
    const remaining = Math.max(0, Math.ceil((lockUntil - Date.now()) / 1000));
    const timerBadge = document.getElementById('authPopupErrorTimer');
    const submitBtns = document.querySelectorAll('.ios-auth-submit');

    if (remaining <= 0) {
      clearInterval(rateLimitTimer);
      setLockUntil(0);
      saveRecentAttempts([]);
      submitBtns.forEach(b => {
        b.disabled = false;
        b.classList.remove('is-rate-locked');
      });
      clearAuthPopupError();
      return;
    }

    if (timerBadge) {
      timerBadge.hidden = false;
      timerBadge.textContent = remaining + 's';
    }
    submitBtns.forEach(b => {
      b.disabled = true;
      b.classList.add('is-rate-locked');
    });
  };

  showAuthPopupError(msg, { countdownSec: durationSec });
  updateLockUI();
  rateLimitTimer = setInterval(updateLockUI, 1000);
}

function recordServerRequestAndCheckLimit() {
  const lockUntil = getLockUntil();
  if (Date.now() < lockUntil) {
    const rem = Math.ceil((lockUntil - Date.now()) / 1000);
    startRateLimitLockdown(`Too many requests! Please wait ${rem}s before trying again.`, rem);
    return false;
  }
  const attempts = getRecentAttempts();
  attempts.push(Date.now());
  saveRecentAttempts(attempts);
  if (attempts.length > AUTH_CONFIG.MAX_ATTEMPTS_ALLOWED) {
    startRateLimitLockdown('Too many requests! Please wait 30s before trying again.', AUTH_CONFIG.COOLDOWN_SECONDS);
    return false;
  }
  return true;
}

function handleApiAuthError(result, fallbackMsg, groupId) {
  const status = result?.status || result?.httpStatus || 0;
  const rawMsg = String(result?.data?.message || result?.message || fallbackMsg || 'Request failed');
  if (status === 429 || /too many|rate limit|slow down|try again later/i.test(rawMsg)) {
    startRateLimitLockdown(rawMsg.includes('Too many') ? rawMsg : `Too many requests! ${rawMsg}`, AUTH_CONFIG.COOLDOWN_SECONDS);
    return;
  }
  showAuthPopupError(rawMsg, { groupId });
}

function setupOtpBoxGroup(groupId, onComplete) {
  const group = document.getElementById(groupId);
  if (!group) return;
  const boxes = Array.from(group.querySelectorAll('.otp-box'));
  const playPop = box => {
    box.classList.remove('otp-box-filled');
    void box.offsetWidth;
    box.classList.add('otp-box-filled');
  };
  const checkAutoSubmit = () => {
    if (boxes.every(b => b.value.length === 1) && typeof onComplete === 'function') {
      setTimeout(onComplete, AUTH_CONFIG.AUTO_SUBMIT_DELAY_MS);
    }
  };
  boxes.forEach((box, index) => {
    box.addEventListener('input', () => {
      clearAuthPopupError();
      box.value = box.value.replace(/[^0-9]/g, '').slice(-1);
      if (box.value) {
        playPop(box);
        if (boxes[index + 1]) boxes[index + 1].focus();
      } else {
        box.classList.remove('otp-box-filled');
      }
      checkAutoSubmit();
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !box.value && boxes[index - 1]) boxes[index - 1].focus();
      else if (e.key === 'ArrowLeft' && boxes[index - 1]) { e.preventDefault(); boxes[index - 1].focus(); }
      else if (e.key === 'ArrowRight' && boxes[index + 1]) { e.preventDefault(); boxes[index + 1].focus(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (typeof onComplete === 'function') onComplete(); }
    });
    box.addEventListener('paste', e => {
      e.preventDefault();
      clearAuthPopupError();
      const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      if (!pasted) return;
      pasted.split('').slice(0, boxes.length).forEach((d, i) => {
        boxes[i].value = d;
        playPop(boxes[i]);
      });
      const nextEmpty = boxes.findIndex(b => !b.value);
      (boxes[nextEmpty] || boxes[boxes.length - 1]).focus();
      checkAutoSubmit();
    });
  });
}

function getOtpBoxValue(groupId) {

function clearOtpBoxGroup(groupId) {

}

async function handleGoogleLoginResponse(googleAccessToken) {
  clearTimeout(googlePromptTimeout);
  toast('Google verified! Syncing your orders...');
  try {
    if (!window.DeliveryBoy || !window.DeliveryBoy.googleLogin) {
      showAuthPopupError('Google login service unavailable right now.');
      return;
    }
    const result = await window.DeliveryBoy.googleLogin(googleAccessToken);
    if (result && result.ok && result.data && result.data.success) {
      toast('Signed in successfully!');
      await persistSession(result.data.userName, result.data.email);
    } else {
      handleApiAuthError(result, 'Google login failed.');
    }
  } catch {
    showAuthPopupError('Network error during Google sign-in. Please try again.');
  } finally {
    resetGoogleButton();
  }
}

window.performGoogleLogin = function (triggerBtnId) {
  if (!recordServerRequestAndCheckLimit()) return;
  if (typeof google === 'undefined' || !google.accounts) {
    showAuthPopupError('Google Sign-In service unable to load. Check your connection.');
    return;
  }
  if (isSubmitting) return;
  isSubmitting = true;
  activeGoogleBtnId = triggerBtnId;
  setBtnLoading(triggerBtnId, true, GOOGLE_BTN_ORIGINAL_HTML, {
    loaderColor: 'text-rani-pink',
    loadingLabel: 'Connecting...'
  });
  try {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: AUTH_CONFIG.GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
      callback: response => {
        if (response && response.access_token) handleGoogleLoginResponse(response.access_token);
      },
      error_callback: error => {
        resetGoogleButton();
        if (error.type !== 'popup_closed' && error.type !== 'access_denied') {
          showAuthPopupError('Google sign-in failed or was cancelled.');
        }
      }
    });
    client.requestAccessToken();
    clearTimeout(googlePromptTimeout);
    googlePromptTimeout = setTimeout(() => {
      if (isSubmitting) {
        resetGoogleButton();
        showAuthPopupError('Google sign-in timed out. Please try again.');
      }
    }, AUTH_CONFIG.GOOGLE_PROMPT_TIMEOUT_MS);
  } catch {
    resetGoogleButton();
    showAuthPopupError('Unable to initialize Google Sign-In.');
  }
};

const sameContact = (o, c) => {
  const x = String(c || '').trim().toLowerCase();
  if (x.includes('@')) return String(o.email || o.customerEmail || '').trim().toLowerCase() === x;
  const d = x.replace(/\D/g, '').slice(-10);

/* Load signed-in user's recent orders so they can pick & track with 1 tap */
const loadSignedInOrders = async () => {
  const email = session();
  if (!email) { S.userOrders = []; return; }
  try {
    const url = `${BACKEND}/api/orders?nocache=${Date.now()}&email=${encodeURIComponent(email)}`;
    const headers = { 'Content-Type': 'application/json' };
    const authToken = localStorage.getItem('authToken') || localStorage.getItem('aavira_token');
    if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
    const res = await fetch(url, { headers });
    if (!res.ok) return;
    const json = await res.json();
    const rows = json.status === 'success' && Array.isArray(json.data) ? json.data : [];
    S.userOrders = rows.filter(o => o.guest !== true && String(o.email || o.customerEmail || o.userEmail || '').trim().toLowerCase() === email);
  } catch {}
};

const fetchOrders = async (silent = false) => {
  if (loading) return;
  if (!G.id || (!G.t && !G.c)) {
    if (!silent) { S.orders = []; showTrack(); }
    return;
  }
  loading = true;
  G.err = '';
  if (!silent) $('#dvBody').innerHTML = '<div class="skel"></div>';
  try {
    if (typeof window.trackAaviraOrder === 'function') {
      const r = await window.trackAaviraOrder(G.id, G.c, G.t);
      if (r.success) S.orders = [r.order];
      else { S.orders = []; if (r.status !== 404) G.err = r.message; }
    } else {
      const matchFromUser = S.userOrders.find(x => cid(rawId(x)) === cid(G.id));
      if (matchFromUser) {
        S.orders = [matchFromUser];
      } else {
        const res = await fetch(`${BACKEND}/api/orders?nocache=${Date.now()}&orderId=${encodeURIComponent(G.id)}`);
        const json = await res.json().catch(() => ({}));
        const list = Array.isArray(json.data) ? json.data : [];
        const found = list.find(x => cid(rawId(x)) === cid(G.id) && (!G.c || sameContact(x, G.c)));
        S.orders = found ? [found] : [];
      }
    }
    S.synced = Date.now();
  } catch (e) {
    if (!silent) S.orders = [];
    G.err = (e instanceof SyntaxError ? 'The server sent an unexpected reply.' : 'Could not reach the server. Please check your internet connection and try again.');
    console.error('[track] fetch failed', e);
  }
  loading = false;
  showTrack(silent);
};

    <div class="qa">
      <button type="button" onclick="openInv()"><i data-lucide="file-text"></i>Invoice</button>
      <button type="button" onclick="supportWA()"><i data-lucide="message-circle" style="color:#16A34A"></i>Support</button>
      <button type="button" onclick="shareOrder()"><i data-lucide="share-2"></i>Share</button>
    </div>
    ${courierHtml}
    <div class="card"><h3 class="h3">Your Order</h3>${resolvedItems.map(i => `<div class="it">${itemPic(i)}<div class="it-info"><h4>${esc(i.name || 'Item')}</h4><div class="it-tags"><span class="it-tag">Size: ${esc(i.size || 'Free Size')}</span><span class="it-color-pill">${esc(colorTxt(i.color))}</span><span class="it-tag">Qty: ${i.qty || 1}</span></div><div class="ip">${money(toSafeNumber(i.price || 0) * (Number(i.qty) || 1))}</div></div></div>`).join('')}</div>
    <div class="card addr"><h3 class="h3">Delivery Address</h3><b>${esc(o.customerName || o.name || 'Customer')}</b><p>${esc(o.address || 'Address not provided')}</p><p><i data-lucide="phone" style="font-size:11px"></i> ${esc(o.phone || o.customerPhone || '-')}</p><button type="button" class="cpy" data-copy="${esc(addrFull)}" onclick="copyTxt(this.dataset.copy,'Address copied')"><i data-lucide="copy"></i> Copy address</button></div>
    <div class="card"><h3 class="h3">Payment Summary</h3>${bill}
      <div class="pay"><div class="kv"><span>Method</span><b style="color:var(--ink);text-transform:uppercase">${esc(o.paymentMethod || '-')}</b></div><div class="kv" style="margin:0"><span>Status</span><b style="color:${color}">${label}</b></div>${payAct}</div></div>
    ${st === 'Delivered' ? '<button type="button" class="btn p" onclick="buyAgain()"><i data-lucide="rotate-cw"></i>Order again</button>' : ''}
    ${['Processing', 'Confirmed'].includes(st) ? '<button type="button" class="btn d" onclick="cancelWA()"><i data-lucide="ban"></i>Request cancellation</button>' : ''}
    <button type="button" class="btn l" onclick="supportWA()"><i data-lucide="message-circle" style="color:#16A34A"></i>Need help with this order?</button>
    ${footer()}`;
  if (keepScroll) body.scrollTop = top;
  requestAnimationFrame(() => requestAnimationFrame(() => { const f = body.querySelector('.sp-fill'); if (f) f.style.width = f.dataset.w + '%'; }));
  icons();
};

const openDv = id => {
  const o = S.orders.find(x => cid(rawId(x)) === cid(id));
  if (!o) return;
  renderDv(o);
  $('#dvBody').scrollTop = 0;
  if (!$('#dv').classList.contains('on')) { $('#dv').classList.add('on'); history.pushState({ dv: 1 }, ''); }
};
const closeDv = () => {};
window.addEventListener('popstate', () => { closeDv(); closeInv(); });

/* Quick-pick an order from signed-in user's recent orders list */
window.quickTrackUserOrder = orderId => {
  const found = S.userOrders.find(x => cid(rawId(x)) === cid(orderId));
  if (found) {
    G.id = rawId(found);
    G.c = session() || found.email || found.phone || '';
    S.orders = [found];
    showTrack(false);
    return;
  }
  G.id = orderId;
  G.c = session();
  loading = false;
  fetchOrders(false);
};

/* Actions */
window.wa = msg => window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
const supportWA = () => { if (S.cur) wa(`Hi Aavira Support,\n\nI need help with my order *${oid(S.cur)}*.`); };
const cancelWA = () => { if (S.cur) wa(`Hi Aavira Support,\n\nPlease cancel my order *${oid(S.cur)}*.`); };
const payWA = () => { if (S.cur) wa(`Hi Aavira Support,\n\nI want to pay for order *${oid(S.cur)}*.\n*Total: ${money(S.cur.totalAmount || S.cur.total)}*\nPlease share the UPI ID / QR code.`); };
const copyTxt = async (t, msg) => { try { await navigator.clipboard.writeText(String(t)); toast(msg); } catch { toast(String(t)); } };
const shareOrder = async () => {
  if (!S.cur) return;
  const o = S.cur, txt = `My Aavira order ${oid(o)} is ${norm(o.orderStatus)} (${money(o.totalAmount || o.total)})`;
  try { if (navigator.share) await navigator.share({ title: 'My Aavira order', text: txt }); else await copyTxt(txt, 'Order details copied'); } catch (e) {}
};
const buyAgain = () => {
  if (!S.cur) return;
  const items = (S.cur.items || []).filter(i => i.productId || i.id).map(resolveOrderItem);
  if (!items.length) { toast('Open the product page to order again', 'err'); return; }
  let cart = []; try { cart = JSON.parse(localStorage.getItem('aavira_cart')) || []; } catch {}
  items.forEach(i => {
    const pid = String(i.productId || i.id);
    const ex = cart.find(c => String(c.productId || c.id) === pid && c.size === i.size && String(c.color || '').toLowerCase() === String(i.color || '').toLowerCase());
    if (ex) ex.qty = Math.min(10, (Number(ex.qty) || 1) + (Number(i.qty) || 1));
    else cart.push({ cartId: `c_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, productId: pid, name: i.name, price: toSafeNumber(i.price), mrp: toSafeNumber(i.mrp || 0), image: i.image, size: i.size || 'Free Size', color: i.color || 'Standard', qty: Number(i.qty) || 1 });
  });
  try { localStorage.setItem('aavira_cart', JSON.stringify(cart)); } catch {}
  toast('Added to your bag');
  setTimeout(() => { location.href = '/cart'; }, 700);
};
const openInv = () => {
  if (!S.cur) return;
  const o = S.cur, d = pdate(o.createdAt);
  $('#invBody').innerHTML = `<div style="text-align:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px"><div class="brand">${brandHtml()}</div><p class="meta">Order Receipt</p></div>
    <div class="kv"><span>Order ID</span><b style="color:var(--ink)">${esc(oid(o))}</b></div><div class="kv"><span>Date</span><span>${d ? fd(d) : '-'}</span></div><div class="kv"><span>Customer</span><span>${esc(o.customerName || '-')}</span></div>
    <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:10px">${(o.items || []).map(i => `<div class="kv" style="margin-bottom:6px"><span>${esc(i.name)} (x${i.qty || 1})</span><b style="color:var(--ink)">${money(toSafeNumber(i.price || 0) * (Number(i.qty) || 1))}</b></div>`).join('')}</div>
    <div class="kv" style="margin:0;font-weight:700;color:var(--ink)"><span>Total</span><span>${money(o.totalAmount || o.total)}</span></div>`;
  $('#inv').classList.add('on');
};
const closeInv = () => $('#inv').classList.remove('on');

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#authPopupModal')?.classList.contains('is-open')) closeAuthPopup();
    else if ($('#inv').classList.contains('on')) closeInv();
  }
});

/* Loading spinner on action buttons (280ms). */
const SPIN_SEL = '.ib.back,.btn,.qa button,.cpy,.cp,.idcp,.foot .links button,.foot .links a,.empty a,.trk-pill-btn';
const SPIN_MS = 280;
document.addEventListener('click', e => {
  const el = e.target.closest(SPIN_SEL);
  if (!el) return;
  if (el.__go) { el.__go = false; return; }
  if (el.classList.contains('is-busy')) { e.preventDefault(); e.stopImmediatePropagation(); return; }
  const oc = el.getAttribute('onclick') || '';
  const now = /supportWA|cancelWA|payWA|wa\(|window\.open|window\.print|shareOrder|copyTxt|openAuthPopup/.test(oc);
  el.classList.add('is-busy');
  setTimeout(() => el.classList.remove('is-busy'), SPIN_MS);
  if (now) return;
  e.preventDefault(); e.stopImmediatePropagation();
  setTimeout(() => { el.__go = true; el.click(); }, SPIN_MS);
}, true);
window.addEventListener('pageshow', () => document.querySelectorAll('.is-busy').forEach(el => el.classList.remove('is-busy')));

setupOtpBoxGroup('otpBoxGroup', window.verifySignupOTP);
icons();
document.querySelectorAll('[data-brand]').forEach(el => { el.innerHTML = brandHtml(); });
$('#dv').classList.add('on');
$('#dvBody').innerHTML = '<div class="skel"></div>';

const renderAuthStripHtml = () => {
  const email = session();
  const userName = localStorage.getItem('aavira_display_name') || '';
  if (email) {
    return `<div class="trk-auth-strip">
      <div class="trk-auth-l">
        <span class="trk-auth-ic"><i data-lucide="user-check"></i></span>
        <div class="trk-auth-txt">
          <b>${esc(userName || 'Signed In')}</b>
          <small>${esc(email)}</small>
        </div>
      </div>
      <div class="trk-auth-btns">
        <a href="orders.html" class="trk-pill-btn">My Orders <i data-lucide="arrow-right"></i></a>
      </div>
    </div>`;
  }
  return `<div class="trk-auth-strip">
    <div class="trk-auth-l">
      <span class="trk-auth-ic"><i data-lucide="lock"></i></span>
      <div class="trk-auth-txt">
        <b>Have an Account?</b>
        <small>Sign in to view all your orders</small>
      </div>
    </div>
    <div class="trk-auth-btns">
      <button type="button" class="trk-pill-btn" onclick="openAuthPopup('login')">Log In</button>
      <button type="button" class="trk-pill-btn outline" onclick="openAuthPopup('signup')">Sign Up</button>
    </div>
  </div>`;
};

const renderUserOrdersQuickPickHtml = () => {
  if (!S.userOrders.length) return '';
  return `<div style="margin-top:14px">
    <div class="lbl" style="margin:0 2px 8px">Your Recent Orders (Tap to Track)</div>
    ${S.userOrders.slice(0, 4).map(o => {
      const st = norm(o.orderStatus);
      const items = o.items || [];
      const first = resolveOrderItem(items[0] || {});
      const d = pdate(o.createdAt), eta = etaText(o), cd = etaCountdown(o);
      let bot = eta ? `<span><i data-lucide="truck"></i>${cd || eta}</span>` : `<span><i data-lucide="clock"></i>Delivery update soon</span>`;
      if (st === 'Delivered') bot = '<span style="color:var(--green)"><i data-lucide="circle-check"></i>Delivered</span>';
      if (st === 'Cancelled') bot = '<span><i data-lucide="circle-x"></i>Cancelled</span>';
      if (st === 'Out for Delivery') bot = `<span style="color:var(--green);font-weight:700"><i data-lucide="truck"></i>${cd || eta || 'Out for delivery'}</span>`;
      return `<article class="card oc" onclick="quickTrackUserOrder('${esc(rawId(o))}')" tabindex="0" role="button" aria-label="Track order ${esc(oid(o))}">
        <div class="oc-head"><div><div class="lbl">Order</div><div class="oid">${esc(oid(o))}</div></div><span class="badge b-${st.replace(/ /g, '')}">${st}</span></div>
        <div class="oc-body">
          <div class="thumb">${imgTag(first.image)}${items.length > 1 ? `<span class="cnt">+${items.length - 1}</span>` : ''}</div>
          <div class="oc-info"><div class="nm">${esc(first.name || 'Your order')}</div>
            <div class="meta">${d ? fd(d) : ''} &bull; ${items.length || 1} item${items.length > 1 ? 's' : ''}${first.color && first.color !== 'Standard' ? ` &bull; ${esc(colorTxt(first.color))}` : ''}</div>
            <div class="price">${money(o.totalAmount || o.total)}</div></div>
        </div>
        ${miniTrack(st)}
        <div class="oc-bot">${bot}<span class="go">Track live<i data-lucide="arrow-right"></i></span></div></article>`;
    }).join('')}
  </div>`;
};

const showForm = (err, id = G.id, c = G.c || session()) => {
  $('#dvBody').innerHTML = `
    ${renderAuthStripHtml()}
    <div class="trk-card">
      <div class="trk-head">
        <div class="trk-ic"><i data-lucide="crosshair"></i></div>
        <div>
          <h3>Track Your Order</h3>
          <p>Enter your Order ID and email or mobile number</p>
        </div>
      </div>
      <label class="tl" for="tfId">Order ID</label>
      <div class="tf-wrap">
        <i data-lucide="hash"></i>
        <input class="tf" id="tfId" value="${esc(id)}" placeholder="e.g. AVF-123456" autocomplete="off" autocapitalize="characters" onkeydown="if(event.key==='Enter')submitTrack()">
      </div>
      <label class="tl" for="tfC">Email or Phone Number</label>
      <div class="tf-wrap">
        <i data-lucide="mail"></i>
        <input class="tf" id="tfC" value="${esc(c)}" placeholder="Email or 10-digit mobile number" autocomplete="off" autocapitalize="none" onkeydown="if(event.key==='Enter')submitTrack()">
      </div>
      ${err ? `<div class="terr"><i data-lucide="alert-circle"></i><span>${esc(err)}</span></div>` : ''}
      <button type="button" class="btn p" style="margin-top:14px" onclick="submitTrack()"><i data-lucide="crosshair"></i>Track Order</button>
    </div>
    ${renderUserOrdersQuickPickHtml()}
    ${footer()}`;
  icons();
};

const submitTrack = () => {
  const id = ($('#tfId')?.value || '').trim().replace(/^#/, '').toUpperCase();
  const c = ($('#tfC')?.value || '').trim();
  const okC = c.includes('@') ? EMAIL_PATTERN.test(c) : c.replace(/\D/g, '').length >= 10;
  if (id.length < 4 || !okC) return showForm('Enter your Order ID and a valid email or 10-digit mobile number.', id, c);
  G.id = id; G.c = c; G.t = ''; loading = false;
  fetchOrders();
};

const showTrack = keep => {
  const o = S.orders[0];
  if (o) {
    renderDv(o, !!keep);
    const f = $('#dvBody').querySelector('.foot');
    const privacy = o.masked ? `<div class="card" style="border-color:#F5D77A;background:#FFF8E1"><b style="font-size:15px;display:flex;align-items:center;gap:6px"><i data-lucide="shield-check" style="color:#D99A00"></i> Personal Details Are Hidden</b><p class="meta" style="margin:6px 0 0;line-height:1.5">For your privacy, name, phone and address are hidden on this link. Verify your email or phone number, or log in to see everything.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button type="button" class="btn p" style="margin:0" onclick="showForm('', G.id, session())"><i data-lucide="lock-open"></i>Verify Contact</button><button type="button" class="btn l" style="margin:0" onclick="openAuthPopup('login')"><i data-lucide="user"></i>Log In</button></div></div>` : '';
    if (f) f.insertAdjacentHTML('beforebegin', privacy + '<button type="button" class="btn l" onclick="showForm()"><i data-lucide="search"></i>Track another order</button>');
    icons();
    try { if (G.t && location.search.includes('t=')) history.replaceState(null, '', location.pathname + '?id=' + encodeURIComponent(G.id)); } catch (e) {}
    return;
  }
  showForm(G.err || (G.id && (G.t || G.c) ? 'We could not find an order with these details. Please check your Order ID and email or phone number.' : ''), G.id, G.c);
};

loadSignedInOrders().then(() => fetchOrders());
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
