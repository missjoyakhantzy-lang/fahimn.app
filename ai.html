<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aavira AI - Fashion Assistant</title>
<meta name="description" content="Chat with Aavira AI for blouse sizes, orders, offers and styling help.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{--rani:#161616;--rani-dark:#000000;--rani-tint:#F5F1E8;--ivory:#FDFBF7;--cream:#F7F1E8;--ink:#242024;--muted:#6B6369;--line:#E7E0D9;--ease:cubic-bezier(.2,.8,.2,1)}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;font-family:"Inter",system-ui,sans-serif;background:var(--ivory);color:var(--ink);-webkit-font-smoothing:antialiased;position:relative}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--rani);outline-offset:2px}
.app{max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow-x:clip;background:linear-gradient(180deg,#FDF7FA 0%,var(--ivory) 30%)}
@media(min-width:640px){body{background:#EFE8DE}.app{box-shadow:0 0 60px rgba(36,32,36,.12)}}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-row{min-height:64px;display:flex;align-items:center;gap:11px;padding:8px 14px 8px 10px}
.back-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--rani);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;box-shadow:0 4px 14px rgba(22,22,22,.35);transition:transform .12s;position:relative}
.back-btn:active{transform:scale(.9)}
.back-btn svg{width:20px;height:20px;stroke-width:1.8}
.back-btn.is-loading{pointer-events:none}
.back-btn.is-loading svg{display:none}
.back-btn.is-loading::after{content:'';width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-ava{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;box-shadow:0 4px 14px rgba(22,22,22,.3);border:2px solid #fff}
.top-tx{flex:1;min-width:0}
.top-tx b{display:block;font-family:"Playfair Display",serif;font-size:17px}
.top-tx small{display:flex;align-items:center;gap:5px;color:#15803D;font-size:12px;font-weight:500}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;display:inline-block}

/* chat */
.chat{flex:1;padding:18px 14px 12px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.msg-row{display:flex;gap:9px;align-items:flex-end;animation:msgIn .3s var(--ease) both;max-width:88%}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.msg-row.ai .bubble{flex:1}
.mini-ava{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:1.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.bubble{padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.55;box-shadow:0 2px 10px rgba(36,32,36,.06);min-width:0;overflow-wrap:break-word}
.msg-row.ai .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;color:var(--ink)}
.msg-row.user .bubble{background:linear-gradient(135deg,var(--rani),var(--rani-dark));color:#fff;border-bottom-right-radius:6px}
.bubble b{font-weight:600}
.msg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.act-btn{border:1.5px solid var(--rani);color:var(--rani);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.act-btn:active{transform:scale(.95)}
.act-btn svg{width:13px;height:13px}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--rani);opacity:.5;animation:tb 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-5px);opacity:1}}

/* suggestions */
.sugg{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.sugg button:active{transform:scale(.95)}
.sugg button svg{width:14px;height:14px;color:var(--rani)}

/* input */
.composer{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.composer-row{display:flex;align-items:center;gap:9px}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:13px 17px;font-size:14px;outline:0;background:#fff;color:var(--ink);transition:border-color .15s}
.composer input:focus{border-color:var(--rani)}
.send-btn{width:44px;height:44px;border-radius:50%;border:0;background:#1F2937;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:all .15s}
.send-btn svg{width:20px;height:20px;stroke-width:2.4}
.send-btn:disabled{background:#E9E2D9;color:#B9AFA6;cursor:default}
.send-btn:not(:disabled){box-shadow:0 4px 14px rgba(0,0,0,.28)}
.send-btn:not(:disabled):active{transform:scale(.88)}
.send-btn.is-loading{pointer-events:none;background:#1F2937}
.send-btn.is-loading svg{display:none}
.send-btn.is-loading::after{content:'';width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:aiSpin .7s linear infinite}
@keyframes aiSpin{to{transform:rotate(360deg)}}
.ai-plist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ai-plist a{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px;text-align:left;box-shadow:0 2px 8px rgba(36,32,36,.05)}
.ai-plist a:active{transform:scale(.98)}
.ai-plist img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--cream)}
.ai-plist .t{flex:1;min-width:0}
.ai-plist .n{display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-plist .p{display:block;font-size:13.5px;font-weight:700;color:var(--rani);margin-top:2px}
.ai-plist svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <button type="button" class="back-btn" onclick="goBack()" aria-label="Back"><i data-lucide="arrow-left"></i></button>
      <img src="/public/ai-913.png" alt="Aavira AI" class="ai-ava">
      <div class="top-tx"><b>Aavira AI</b><small><span class="online-dot"></span>Online · Fashion Assistant</small></div>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <div class="sugg" id="sugg"></div>

  <div class="composer">
    <div class="composer-row">
      <input type="text" id="msgInput" placeholder="Ask about sizes, orders, offers…" autocomplete="off" enterkeyhint="send" aria-label="Message Aavira AI">
      <button type="button" class="send-btn" id="sendBtn" aria-label="Send" disabled><i data-lucide="arrow-up"></i></button>
    </div>
  </div>
</div>

<script src="/user_data.js"></script>
<script>
const $=s=>document.querySelector(s);
const chat=$('#chat'),input=$('#msgInput');
const WA='https://wa.me/919608720622?text='+encodeURIComponent('Hi Aavira Fashion! I need help.');
const HISTORY=[]; // conversation memory: {role:'user'|'ai', text}
const MAX_HIST=12;
let CATALOG=[];
async function loadCatalog(){
  try{
    if(typeof window.getVercelData==='function'){
      const d=await window.getVercelData();
      if(Array.isArray(d)) CATALOG=d;
    }
  }catch(e){}
}
function pushHist(role,text){ HISTORY.push({role,text:String(text).slice(0,500)}); if(HISTORY.length>MAX_HIST) HISTORY.splice(0,HISTORY.length-MAX_HIST); }
function findProducts(query,n){
  n=n||4;
  const words=String(query||'').toLowerCase().split(/\s+/).filter(w=>w.length>2);
  if(!words.length||!CATALOG.length) return [];
  return CATALOG.map(p=>({p,s:words.reduce((a,w)=>a+(((p.name||'').toLowerCase().includes(w))?1:0),0)}))
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.p);
}
function topProducts(n){
  n=n||4;
  const bs=CATALOG.filter(p=>p.bestseller);
  const pool=bs.length>=n?bs:CATALOG.slice().sort((a,b)=>(b.rating||0)-(a.rating||0));
  return pool.slice(0,n);
}
function productCardsHTML(items){
  if(!items||!items.length) return '';
  return '<div class="ai-plist">'+items.map(p=>{
    const id=encodeURIComponent(p.id);
    const img=escapeHtml(p.imageMain||p.image||p.imageUrl||'');
    const name=escapeHtml(p.name||'Blouse');
    const price=p.price?('\u20B9'+Number(p.price).toLocaleString('en-IN')):'';
    return '<a href="/product?id='+id+'">'
      +(img?'<img src="'+img+'" alt="" loading="lazy">':'')
      +'<span class="t"><span class="n">'+name+'</span><span class="p">'+price+'</span></span>'
      +'<i data-lucide="chevron-right"></i></a>';
  }).join('')+'</div>';
}
function extractProductsTag(text){
  const m=String(text).match(/\[\[SHOW_PRODUCTS:\s*([^\]]+)\]\]/i);
  return m?m[1].trim():null;
}
const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const icons=()=>{if(window.lucide)lucide.createIcons()};
const scrollDown=()=>requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight});

const SUGGESTIONS=[
  {t:'Find my size',icon:'ruler'},
  {t:'Track my order',icon:'package'},
  {t:'Best sellers',icon:'sparkles'},
  {t:'Any offers?',icon:'badge-percent'},
];

const FALLBACK={t:"Network thoda slow lag raha hai — ek baar phir se try karo.",
  a:[]};



function formatAI(text){
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}
const AI_BACKEND='https://ai-system-242.vercel.app/api/chat';
async function fetchAIAnswer(text, signal){
  const r=await fetch(AI_BACKEND,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:text,history:HISTORY.slice(-12)}),
    signal:signal||undefined
  });
  if(!r.ok) throw new Error('ai-http-'+r.status);
  const j=await r.json();
  const t=String(j.reply||'').trim();
  if(!t) throw new Error('ai-empty');
  return t;
}

function addMsg(who,html,actions){
  const row=document.createElement('div');
  row.className='msg-row '+who;
  row.innerHTML=(who==='ai'?'<img src="/public/ai-913.png" alt="" class="mini-ava">':'')
    +`<div class="bubble">${html}${actions&&actions.length?`<div class="msg-actions">${actions.map(a=>`<a class="act-btn" href="${a.h}" ${a.h.startsWith('http')?'target="_blank" rel="noopener"':''}><i data-lucide="${a.i||'arrow-right'}"></i>${escapeHtml(a.t)}</a>`).join('')}</div>`:''}</div>`;
  chat.appendChild(row);icons();scrollDown();
}
function addTyping(){
  const row=document.createElement('div');
  row.className='msg-row ai';row.id='typingRow';
  row.innerHTML='<img src="/public/ai-913.png" alt="" class="mini-ava"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  chat.appendChild(row);scrollDown();
}
function removeTyping(){document.getElementById('typingRow')?.remove()}

function aiBubble(ans,query){
  const clean=String(ans).replace(/\[\[SHOW_PRODUCTS:[^\]]+\]\]/gi,'').trim();
  let html=formatAI(clean);
  const q=query||extractProductsTag(ans);
  if(q){
    const items=findProducts(q);
    if(items.length) html+=productCardsHTML(items);
  }
  return html;
}
async function send(text){
  text=(text??input.value).trim();
  if(!text||send._busy)return;
  addMsg('user',escapeHtml(text));
  input.value=''; syncSendBtn();
  send._busy=true;
  setSendLoading(true);
  addTyping();
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),30000);
  try{
    const ans=await fetchAIAnswer(text, ctrl.signal);
    clearTimeout(timer);
    removeTyping();
    pushHist('user',text);
    addMsg('ai',aiBubble(ans));
    pushHist('ai',String(ans).replace(/\[\[SHOW_PRODUCTS:[^\]]+\]\]/gi,'').trim().slice(0,500));
  }catch(e){
    clearTimeout(timer);
    removeTyping();
    addMsg('ai',FALLBACK.t,FALLBACK.a);
    pushHist('ai','fallback');
  }finally{
    send._busy=false;
    setSendLoading(false);
  }
}
function syncSendBtn(){ const b=document.getElementById('sendBtn'); if(b&&!b.classList.contains('is-loading')) b.disabled=!input.value.trim(); }
function setSendLoading(on){
  const b=document.getElementById('sendBtn');
  if(!b) return;
  b.classList.toggle('is-loading',!!on);
  if(on) b.disabled=true; else syncSendBtn();
}

function renderSugg(){
  $('#sugg').innerHTML=SUGGESTIONS.map(s=>`<button type="button" data-s="${escapeHtml(s.t)}"><i data-lucide="${s.icon}"></i>${escapeHtml(s.t)}</button>`).join('');
  $('#sugg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>send(b.dataset.s)));
  icons();
}

function goBack(){
  const btn=document.querySelector('.back-btn');
  if(btn&&!btn.classList.contains('is-loading'))btn.classList.add('is-loading');
  setTimeout(()=>{
    if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1)history.back();
    else location.href='/';
  },450);
}

$('#sendBtn').addEventListener('click',()=>send());
input.addEventListener('input',syncSendBtn);
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});

async function aiWelcome(){
  setSendLoading(true);
  addTyping();
  try{
    const ans=await fetchAIAnswer('The customer just opened the chat. Greet them warmly in 1-2 lines as Aavira AI and tell them what you can help with.', null);
    removeTyping();
    const clean=String(ans).replace(/\[\[SHOW_PRODUCTS:[^\]]+\]\]/gi,'').trim();
    addMsg('ai',aiBubble(ans));
    pushHist('ai',clean.slice(0,500));
  }catch(e){
    removeTyping();
    addMsg('ai',"Namaste! I'm <b>Aavira AI</b> — your blouse fashion assistant. Ask me anything!");
  }finally{
    setSendLoading(false);
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  renderSugg();icons();syncSendBtn();loadCatalog();
  setTimeout(aiWelcome,400);
});
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
