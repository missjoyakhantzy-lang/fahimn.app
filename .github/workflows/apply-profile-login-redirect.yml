name: Apply profile login redirect

on:
  push:

jobs:
  update-profile:
    if: ${{ !contains(github.event.head_commit.message, '[profile-login-redirect]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update profile login flow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('profile.html')
          s = p.read_text(encoding='utf-8')

          # Login button now opens the dedicated clean login URL.
          s = s.replace('onclick="window.openLoginModal()"', 'onclick="window.location.href=\'login.html\'"')

          # Remove only the embedded authentication UI from the profile page.
          s = re.sub(r'\n\s*/\* AUTH UI \*/.*?\n\s*/\* TOAST \*/', '\n        /* TOAST */', s, flags=re.S)
          s = re.sub(r'\n\s*<!-- 1\. AUTH MODAL -->.*?\n\s*<!-- 2\. EDIT PROFILE MODAL -->', '\n        <!-- 2. EDIT PROFILE MODAL -->', s, flags=re.S)

          # Remove the profile page's embedded auth JavaScript, while keeping all other UI logic.
          s = s.replace('        let tempSignupData = { name: "", email: "", pwd: "" };\n\n', '')
          s = re.sub(r'\n\s*window\.openLoginModal = function\(\)\s*\{.*?\n\s*document\.addEventListener\("DOMContentLoaded", \(\) => \{', '\n\n        document.addEventListener("DOMContentLoaded", () => {', s, flags=re.S)

          # The profile page no longer needs the dedicated auth data provider.
          s = s.replace('    <!-- 🔗 DATA PROVIDER LINK -->\n    <script src="user_data.js"></script>\n\n', '')

          p.write_text(s, encoding='utf-8')

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-profile-login-redirect.yml
          git add profile.html .github/workflows/apply-profile-login-redirect.yml
          git diff --cached --quiet || git commit -m "fix: redirect profile login to clean login page [profile-login-redirect]"
          git push
